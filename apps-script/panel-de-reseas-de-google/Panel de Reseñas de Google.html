  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:680px){.cards{grid-template-columns:1fr}}
  .card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 22px rgba(69,107,80,.08)}
  .rate-big{font-size:64px;font-weight:700;color:var(--verde);line-height:1;font-family:'Playfair Display',serif}

  .bar .lab{width:34px;color:var(--verde);font-weight:700;font-size:13px}
  .bar .track{flex:1;height:12px;background:#eee7db;border-radius:99px;overflow:hidden}
  .bar .fill{height:100%;background:var(--verdem);border-radius:99px}

  h2{font-family:'Playfair Display',serif;color:var(--verde);font-size:20px;margin:26px 0 12px}
  table.goal{width:100%;border-collapse:collapse}
  table.goal td{padding:8px 6px;border-bottom:1px solid #eee7db;font-size:15px}
  table.goal td.n{font-weight:700;color:var(--verde);text-align:right;white-space:nowrap}
  .hl{background:#eef6f0;border-left:4px solid var(--verdem);padding:12px 14px;border-radius:10px;margin-bottom:14px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
  .filters button{border:1px solid var(--verde);background:transparent;color:var(--verde);border-radius:99px;padding:5px 13px;font-size:13px;cursor:pointer}
  .filters button.on{background:var(--verde);color:var(--crema)}
  input#q{width:100%;padding:11px 14px;border:1px solid #d8d3c8;border-radius:12px;font-size:15px;margin-bottom:12px}
  .rev{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 3px 12px rgba(69,107,80,.06)}
  .rev .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .rev .nm{font-weight:700}
  .rev .st{color:var(--gold);font-size:15px;white-space:nowrap}
  .rev .cm{margin:6px 0 0;font-size:14px;line-height:1.5}
  .rev .rep{margin-top:8px;font-size:13px;color:var(--verde);background:#f4f8f5;border-radius:9px;padding:8px 10px}
  .rev .noreply{margin-top:6px;font-size:12px;color:#b9770a}
  .center{text-align:center}
  .spin{width:26px;height:26px;border:3px solid #ddd;border-top-color:var(--verde);border-radius:50%;animation:s 1s linear infinite;margin:40px auto;display:none}
  @keyframes s{to{transform:rotate(360deg)}}
  .date{color:var(--gris);font-size:12px}
</style>

<body>
<div class="wrap">
  <h1 class="marca" role="img" aria-label="Rosanta"></h1>
  <div class="sub">Panel de Reseñas de Google · en vivo</div>

  <div class="spin" id="spin" style="display:block"></div>
  <div id="app" style="display:none">

    <div class="cards">
      <div class="card center">
        <div class="rate-big" id="avg">–</div>
        <div class="stars-row" id="avgStars"></div>
        <div class="muted" id="total"></div>
      </div>
      <div class="card">
        <div id="dist"></div>
      </div>
    </div>

    <h2>Subir la puntuación</h2>
    <div class="hl" id="goalHl"></div>
    <div class="card">
      <table class="goal"><tbody id="goalTable"></tbody></table>
      <div class="muted" style="margin-top:10px">Google muestra el promedio redondeado a 1 decimal. El cálculo usa tu promedio real y cuántas reseñas de 5★ hacen que el número mostrado suba al siguiente escalón.</div>
    </div>

    <h2>Todas las reseñas (<span id="cnt"></span>)</h2>
    <div class="filters" id="filters">
      <button data-f="all" class="on">Todas</button>
      <button data-f="5">5★</button>
      <button data-f="4">4★</button>
      <button data-f="3">3★</button>
      <button data-f="2">2★</button>
      <button data-f="1">1★</button>
      <button data-f="noreply">Sin responder</button>
    </div>
    <input id="q" placeholder="Buscar por nombre o texto...">
    <div id="list"></div>
  </div>
</div>

<script>
  var DATA=null, filter='all';

  google.script.run.withSuccessHandler(function(d){
    DATA=d; render();
    document.getElementById('spin').style.display='none';
    document.getElementById('app').style.display='block';
  }).withFailureHandler(function(e){
    document.getElementById('spin').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('app').innerHTML='<div class="card">No se pudieron cargar las reseñas: '+e.message+'</div>';
  }).getDatosDashboard();

  function starStr(n){ return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n); }

  function render(){
    var avg=DATA.average, total=DATA.total;
    document.getElementById('avg').textContent = avg.toFixed(1);
    document.getElementById('avgStars').textContent = starStr(Math.round(avg));
    document.getElementById('total').textContent = total + ' reseñas en Google';

    var dist=DATA.dist, maxc=Math.max(1,dist[1],dist[2],dist[3],dist[4],dist[5]);
    var html='';
    [5,4,3,2,1].forEach(function(s){
      var c=dist[s]||0, pct=Math.round(c/maxc*100);
      html+='<div class="bar"><div class="lab">'+s+'★</div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><div class="cnt">'+c+'</div></div>';
    });
    document.getElementById('dist').innerHTML=html;

    // Cálculo sobre el promedio REAL (de la distribución) y el redondeo de Google (1 decimal).
    var d=DATA.dist;
    var totalD=(d[1]||0)+(d[2]||0)+(d[3]||0)+(d[4]||0)+(d[5]||0);
    var sumD=5*(d[5]||0)+4*(d[4]||0)+3*(d[3]||0)+2*(d[2]||0)+1*(d[1]||0);
    var trueAvg = totalD ? sumD/totalD : 0;
    function needFor(targetAvg){
      if(targetAvg>=5) return null;                 // 5.0 exacto no se alcanza agregando 5★
      if(targetAvg<=trueAvg) return 0;
      return Math.ceil((targetAvg*totalD - sumD)/(5-targetAvg));
    }
    var displayed=Math.round(trueAvg*10)/10;
    var rows='', next=null, nextTier=null;
    for(var T=Math.round((displayed+0.1)*10)/10; T<=5.0001; T=Math.round((T+0.1)*10)/10){
      var threshold=Math.round((T-0.05)*100)/100;   // promedio real para que Google muestre T
      var n=needFor(threshold);
      if(n===null) break;
      if(next===null){ next=n; nextTier=T; }
      rows+='<tr><td>Que Google muestre <b>'+T.toFixed(1)+' ★</b></td><td class="n">'+n+' reseñas de 5★</td></tr>';
      if(T>=5) break;
    }
    document.getElementById('goalTable').innerHTML=rows || '<tr><td>¡Ya estás en 5.0! 🎉</td></tr>';
    if(displayed>=5){
      document.getElementById('goalHl').innerHTML='Google muestra <b>5.0★</b>. El objetivo ahora es mantenerlo.';
    } else {
      document.getElementById('goalHl').innerHTML='Google muestra <b>'+displayed.toFixed(1)+'★</b> (promedio real '+trueAvg.toFixed(2)+'). Con <b>'+next+'</b> reseña(s) de 5★ más, subirá a <b>'+nextTier.toFixed(1)+'★</b>.';
    }

    bindFilters(); renderList();
  }

  function bindFilters(){
    document.querySelectorAll('#filters button').forEach(function(b){
      b.onclick=function(){
        document.querySelectorAll('#filters button').forEach(function(x){x.classList.remove('on')});
        b.classList.add('on'); filter=b.getAttribute('data-f'); renderList();
      };
    });
    document.getElementById('q').oninput=renderList;
  }

  function renderList(){
    var q=(document.getElementById('q').value||'').toLowerCase();
    var arr=DATA.reviews.filter(function(r){
      if(filter==='noreply' && r.hasReply) return false;
      if(filter!=='all' && filter!=='noreply' && r.stars!=parseInt(filter,10)) return false;
      if(q && (r.name+' '+r.comment).toLowerCase().indexOf(q)<0) return false;
      return true;
    });
    document.getElementById('cnt').textContent=DATA.reviews.length;
    var html=arr.map(function(r){
      var date=r.time? new Date(r.time).toLocaleDateString('es-GT',{year:'numeric',month:'short',day:'numeric'}):'';
      var rep = r.hasReply ? '<div class="rep"><b>Respuesta:</b> '+esc(r.reply)+'</div>' : '<div class="noreply">Sin responder</div>';
      return '<div class="rev"><div class="top"><span class="nm">'+esc(r.name)+'</span><span class="st">'+starStr(r.stars)+'</span></div>'+
             '<div class="date">'+date+'</div>'+
             (r.comment?'<div class="cm">'+esc(r.comment)+'</div>':'<div class="cm muted">(sin texto)</div>')+
             rep+'</div>';
    }).join('');
    document.getElementById('list').innerHTML=html || '<div class="card">No hay reseñas con ese filtro.</div>';
  }

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
