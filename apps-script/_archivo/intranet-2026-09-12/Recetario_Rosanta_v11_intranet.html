<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recetario Rosanta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#FBF8F2; --surface:#FFFFFF; --surface-2:#F4EFE4; --line:#E4DBCB; --line-soft:#EFE8DA;
  --ink:#2D2119; --ink-2:#7A6B5A; --ink-3:#9C8D7C;
  --spine:#4A6741; --spine-ink:#F5EFE0; --accent:#B57F2C; --accent-soft:#F3E4CB;
  --ok:#3F7A52; --ok-bg:#E6EFE4; --over:#B4342A; --over-bg:#F7E4E1; --under:#4A6FA5; --under-bg:#E4EAF4;
  --none:#8A7C6C; --none-bg:#EDE7DB;
  --shadow:0 1px 2px rgba(45,33,25,.06), 0 8px 24px -12px rgba(45,33,25,.18);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#16120E; --surface:#1F1913; --surface-2:#271F18; --line:#3A3027; --line-soft:#2E261E;
  --ink:#F2EBE0; --ink-2:#A99883; --ink-3:#88796A;
  --spine:#6E8E62; --spine-ink:#12100C; --accent:#D9A85A; --accent-soft:#3A2E1B;
  --ok:#7FB68A; --ok-bg:#22301F; --over:#E28579; --over-bg:#37211E; --under:#8DAAD8; --under-bg:#1E2634;
  --none:#9A8A78; --none-bg:#2A231C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#16120E; --surface:#1F1913; --surface-2:#271F18; --line:#3A3027; --line-soft:#2E261E;
  --ink:#F2EBE0; --ink-2:#A99883; --ink-3:#88796A;
  --spine:#6E8E62; --spine-ink:#12100C; --accent:#D9A85A; --accent-soft:#3A2E1B;
  --ok:#7FB68A; --ok-bg:#22301F; --over:#E28579; --over-bg:#37211E; --under:#8DAAD8; --under-bg:#1E2634;
  --none:#9A8A78; --none-bg:#2A231C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--spine);color:var(--spine-ink)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{font-family:"Archivo";font-weight:800;font-stretch:80%;letter-spacing:.16em;text-transform:uppercase;font-size:15px;white-space:nowrap}
.mark small{display:block;font-weight:400;font-stretch:100%;letter-spacing:.08em;font-size:9.5px;opacity:.72;margin-top:1px}
.seg{display:flex;background:rgba(0,0,0,.22);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:5px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--spine-ink);opacity:.72;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--spine-ink);color:var(--spine);opacity:1}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border-radius:8px;border:1px solid transparent;
  background:rgba(255,255,255,.14);color:var(--spine-ink);font-size:14px}
.search input::placeholder{color:var(--spine-ink);opacity:.6}
.search input:focus{background:var(--surface);color:var(--ink);outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.65;pointer-events:none}
.search input:focus + svg{opacity:.5}

/* ---------- estructura ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:330px 1fr;gap:26px;align-items:start}
.rail{position:sticky;top:60px;max-height:calc(100dvh - 76px);overflow-y:auto;padding:16px 6px 40px 0}
.grp{font-family:"Archivo";font-stretch:82%;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  font-size:10.5px;color:var(--ink-3);padding:16px 8px 6px}
.row{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:7px;line-height:1.3}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft)}
.row[aria-current="true"] .rn{color:var(--ink)}
.rn{flex:1;font-size:14px;color:var(--ink-2)}
.row[aria-current="true"] .rn,.row:hover .rn{color:var(--ink)}
.pct{font-size:11.5px;font-weight:600;letter-spacing:.01em}

/* ---------- ficha ---------- */
.sheet{padding:22px 0 80px;min-width:0}
.eyebrow{font-family:"Archivo";font-stretch:82%;font-weight:700;text-transform:uppercase;letter-spacing:.14em;
  font-size:10.5px;color:var(--accent)}
h1{font-stretch:80%;font-weight:800;font-size:clamp(28px,5.2vw,44px);line-height:1.03;margin:6px 0 0;letter-spacing:-.01em}
.stats{display:flex;flex-wrap:wrap;gap:0;margin:20px 0 0;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.stat{flex:1 1 108px;padding:11px 14px;border-right:1px solid var(--line-soft)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:"Archivo";font-stretch:84%;font-weight:700;text-transform:uppercase;
  letter-spacing:.11em;font-size:9.5px;color:var(--ink-3);margin-bottom:3px}
.stat span{font-size:20px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;
  font-weight:600;letter-spacing:.02em;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.s-ok{color:var(--ok);background:var(--ok-bg)} .s-over{color:var(--over);background:var(--over-bg)}
.s-under{color:var(--under);background:var(--under-bg)} .s-none{color:var(--none);background:var(--none-bg)}
.note{margin:16px 0 0;padding:11px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 8px 8px 0;font-size:13.5px;color:var(--ink)}
.tablewrap{overflow-x:auto;margin-top:22px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:440px}
th{font-family:"Archivo";font-stretch:84%;font-weight:700;text-transform:uppercase;letter-spacing:.11em;
  font-size:9.5px;color:var(--ink-3);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:9px 16px;border-bottom:1px solid var(--line-soft);vertical-align:baseline}
tr:last-child td{border-bottom:0}
.qty{text-align:right;white-space:nowrap;font-size:16px;font-weight:600;width:1%}
.cost{text-align:right;white-space:nowrap;color:var(--ink-2);font-size:13px;width:1%}
.link{color:var(--ink);border-bottom:1.5px solid var(--accent);padding-bottom:1px;text-align:left}
.link:hover{color:var(--accent)}
.link::after{content:"›";color:var(--accent);margin-left:5px;font-weight:600}
tfoot td{border-top:1px solid var(--line);border-bottom:0;padding-top:11px;font-size:13px;color:var(--ink-2)}
tfoot tr.total td{font-size:15.5px;font-weight:600;color:var(--ink);padding-bottom:12px}
.empty{margin-top:22px;padding:26px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);
  background:var(--surface);font-size:14px}
.back{display:none}
.foot{max-width:1240px;margin:0 auto;padding:26px 16px 60px;color:var(--ink-3);font-size:12px;border-top:1px solid var(--line-soft)}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:0}
  .rail{position:static;max-height:none;padding:6px 0 40px}
  .sheet{padding:16px 0 70px}
  body[data-view="detail"] .rail{display:none}
  body[data-view="list"] .sheet{display:none}
  body[data-view="detail"] .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
    color:var(--accent);padding:8px 0;margin-bottom:2px}
  .stat{flex:1 1 50%;border-bottom:1px solid var(--line-soft)}
}
@media (min-width:861px){ body[data-view]{} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const MIN = new Set(["de","del","la","el","y","en","con","a","al","los","las","por"]);
const tc = s => s.toLowerCase().split(/\s+/).map((w,i)=>{
  if(i>0 && MIN.has(w)) return w;
  return w.charAt(0).toUpperCase()+w.slice(1);
}).join(" ");
DATA.items.forEach(it => it.ings.forEach(g => {
  const n = (g.nombre||"").trim();
  if(n && n === n.toUpperCase() && /[A-ZÁÉÍÓÚÑ]{3}/.test(n)) g.nombre = tc(n);
}));

const F = n => n==null ? "—" : "Q" + n.toLocaleString("es-GT",{minimumFractionDigits:2,maximumFractionDigits:2});
const FU = n => n==null ? "—" : "Q" + n.toLocaleString("es-GT",{minimumFractionDigits:(n<1?4:2),maximumFractionDigits:(n<1?5:2)});
const PCT = n => n==null ? "—" : (n*100).toFixed(1).replace(".",",") + "%";
const NUM = n => n==null ? "" : (Math.round(n*1000)/1000).toLocaleString("es-GT",{maximumFractionDigits:3});

function estado(it){
  if(it.tipo==="sub") return null;
  if(!it.costo || !it.cmv) return {k:"none", t:"Sin receta"};
  const m = it.meta;
  if(it.cmv > m*1.15) return {k:"over", t:"Sobre meta"};
  if(it.cmv < m*0.6)  return {k:"under", t:"Muy bajo"};
  return {k:"ok", t:"En meta"};
}
let area = "cocina", sel = null, q = "";

function coincide(it, needle){
  if(!needle) return true;
  const n = needle.toLowerCase();
  if(it.nombre.toLowerCase().includes(n)) return true;
  return it.ings.some(g => (g.nombre||"").toLowerCase().includes(n));
}

function renderRail(){
  const rail = document.getElementById("rail");
  const grupos = DATA.grupos[area];
  let html = "";
  let total = 0;
  grupos.forEach(g => {
    const rows = DATA.items.filter(it => it.area===area && it.grupo===g && coincide(it,q));
    if(!rows.length) return;
    total += rows.length;
    html += `<div class="grp">${g}</div>`;
    rows.forEach(it => {
      const e = estado(it);
      const pct = it.tipo==="sub"
        ? `<span class="pct mono" style="color:var(--ink-3)">${it.cpu && it.cpu[0]!=null ? FU(it.cpu[0]) : ""}</span>`
        : `<span class="pct mono" style="color:var(--${e.k==="none"?"none":e.k})">${it.cmv?PCT(it.cmv):"—"}</span>`;
      html += `<button class="row" data-id="${it.id}" aria-current="${sel===it.id}">
        <span class="rn">${it.nombre}</span>${pct}</button>`;
    });
  });
  if(!total) html = `<div class="grp">Sin resultados</div><div style="padding:0 9px;color:var(--ink-2);font-size:14px">Nada coincide con “${q}”.</div>`;
  rail.innerHTML = html;
  rail.querySelectorAll(".row").forEach(b => b.onclick = () => abrir(b.dataset.id));
}

function renderSheet(){
  const el = document.getElementById("sheet");
  const it = DATA.items.find(x => x.id===sel);
  if(!it){ el.innerHTML = `<div class="empty">Elegí una receta de la lista.</div>`; return; }
  const e = estado(it);
  let stats = "";
  if(it.tipo==="sub"){
    stats = `<div class="stats">
      <div class="stat"><b>Costo del batch</b><span class="mono">${F(it.costo)}</span></div>

    stats = `<div class="stats">
      <div class="stat"><b>Precio carta</b><span class="mono">${F(it.precio)}</span></div>

      <div class="stat"><b>CMV</b><span class="mono" style="color:var(--${e.k==="none"?"none":e.k})">${PCT(it.cmv)}</span></div>
      <div class="stat"><b>Meta</b><span class="mono" style="color:var(--ink-2)">${PCT(it.meta)}</span></div>
    </div>`;
  }
  let cuerpo;
  if(!it.ings.length){
    cuerpo = `<div class="empty"><strong>Todavía no hay receta cargada.</strong><br>

    ? `<p class="note">${it.nota}</p>` : "";
  el.innerHTML = `
    <button class="back" id="back">← Todas las recetas</button>
    <p class="eyebrow">${it.grupo}</p>
    <h1>${it.nombre}</h1>
    ${it.tipo!=="sub" && e ? `<p style="margin:10px 0 0"><span class="chip s-${e.k}"><span class="dot"></span>${e.t}</span></p>`:""}
    ${stats}${nota}${cuerpo}`;
  el.querySelectorAll("[data-go]").forEach(b => b.onclick = () => abrir(b.dataset.go));
  const back = document.getElementById("back");
  if(back) back.onclick = () => { document.body.dataset.view = "list"; window.scrollTo(0,0); };
}

function abrir(id){
  const it = DATA.items.find(x => x.id===id);
  if(!it) return;
  if(it.area !== area){ area = it.area; syncTabs(); }
  sel = id;
  location.hash = id;
  document.body.dataset.view = "detail";
  renderRail(); renderSheet();
  window.scrollTo({top:0, behavior:"instant"});
}
function syncTabs(){
  document.getElementById("tab-cocina").setAttribute("aria-pressed", area==="cocina");
  document.getElementById("tab-barra").setAttribute("aria-pressed", area==="barra");
}
function primero(){
  const g = DATA.grupos[area];
  const it = DATA.items.find(x => x.area===area && x.grupo===g[0]);
  return it ? it.id : null;
}
function resumen(){
  const platos = DATA.items.filter(x => x.tipo==="plato");
  const conCosto = platos.filter(x => x.costo);
  const sin = platos.length - conCosto.length;
  document.getElementById("foot").innerHTML =
    `${platos.length} recetas de plato y cóctel · ${DATA.items.length - platos.length} pre-elaborados · ${sin} todavía sin receta.
     Meta de CMV: 30% en cocina, 20% en barra. Los costos salen del Banco de Datos del recetario maestro.`;
}
document.getElementById("tab-cocina").onclick = () => { area="cocina"; syncTabs(); sel=primero(); renderRail(); renderSheet(); };
document.getElementById("tab-barra").onclick  = () => { area="barra";  syncTabs(); sel=primero(); renderRail(); renderSheet(); };
document.getElementById("q").addEventListener("input", ev => { q = ev.target.value.trim(); renderRail(); });

const h = location.hash.slice(1);
if(h && DATA.items.some(x => x.id===h)){ const it=DATA.items.find(x=>x.id===h); area=it.area; sel=h; }
else { sel = primero(); }
document.body.dataset.view = window.matchMedia("(max-width:860px)").matches ? "list" : "detail";
syncTabs(); renderRail(); renderSheet(); resumen();
</script>

</body>
