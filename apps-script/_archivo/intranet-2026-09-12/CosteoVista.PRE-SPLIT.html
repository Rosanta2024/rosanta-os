/* ===== EL HEADER. Verde Bosque como el resto de la intranet, con el wordmark

   otro producto.

   nunca data-theme. La unica rama oscura que corre es la del media query, asi que
   cada regla de [data-theme="dark"] va DUPLICADA ahi. Si se escribe una sola, en

/* ===== Ingenieria de menu ==========================================
   Todo cuelga de #im y todas las clases llevan prefijo im-. Ninguna
   regla de aca puede tocar el resto de la vista, y ninguna regla de la
   vista puede entrar aca sin perder por especificidad.
   Los tokens de abajo son alias de los que ya existen arriba: si algun
   dia cambia la paleta de CosteoVista, esta pestana cambia con ella.
   ------------------------------------------------------------------ */
#im{
  --im-medio:var(--verde);          /* estrella  */
  --im-bosque:var(--bosque);        /* caballo   */
  --im-lila:var(--lila);            /* rompecabezas y punto ciego */
  --im-gris:var(--muted);           /* perro     */
  --im-alerta:var(--alto);          /* fuera de meta */
  --im-sup:var(--surface);
  --im-tinta:var(--ink); --im-tinta-2:var(--ink-2); --im-tinta-3:var(--muted);
  --im-linea:var(--line);
  --im-linea-2:color-mix(in srgb, var(--line) 55%, var(--surface));
  --im-wash:color-mix(in srgb, var(--verde) 8%, transparent);
  --im-chip:var(--panel);
}
/* En oscuro, --bosque se aclara tanto que caballo y estrella quedan del mismo

<script>
/* EL TOKEN DEL ENLACE PERSONAL (10-sep-2026)
   Toda llamada a google.script.run tiene que mandarlo como primer argumento. La
   pagina se abre porque doGet ya resolvio la identidad, pero cada llamada al
   servidor es una peticion nueva y llega sin nada: sin el token cae en la sesion
   de dominio y a quien entra con Gmail personal le contesta "Sin acceso al
   recetario". Asi le paso a Jeffry, que fue el primero en entrar de verdad al
   modulo. Si agregas una llamada nueva, pasale AUTH. */
var AUTH = '<?= authToken ?>';

function iniciarApp(){
const D = window.__DATA__;
const R = D.recetas, I = D.insumos, P = D.proveedores;
const sim = new Map();
/* El modulo abre en el tablero: contesta "como vamos". La ingenieria de menu, que
   contesta "que hago esta semana", queda segunda. Las otras son de consulta. */
let view = 'inicio', q = '', area = 'COCINA', filt = {rec:'carta', ins:'todos', prov:null};
let imArea = 'COCINA', imSemanas = 13;   // el trimestre: ver IM_VENTANAS
let dbSemanas = 13;                      // el tablero abre en la misma ventana

/* EL AREA. Los permisos dicen QUE puede hacer cada uno; esto dice DONDE.
   Jeffry es cocina y Jose es barra: sin este filtro la pantalla le ofrece a Jose
   los botones de las fichas de cocina, el servidor se los rechaza uno por uno, y
   el se queda mirando errores sin entender por que. Ofrecer algo que se va a negar
   no es seguridad, es una trampa.

   El candado DE VERDAD esta en exigirArea_(), del lado del servidor. Esto es
   maquillaje: esconder un boton no protege nada.

   Con el filtro en "Todo" el area viene vacia y se deja pasar: el servidor elige
   la del rol. Y si window.PUEDE.areas no llego, no se ofrece nada. */
const AREA_EDITABLE = a => {
  const mias = (window.PUEDE && window.PUEDE.areas) || [];
  if(!mias.length) return false;
  const t = String(a || '').trim().toUpperCase();
  return t ? mias.indexOf(t) !== -1 : true;
};

/* Cuando el area que se esta mirando no es la suya, decirlo. Sin esto la pantalla
   se ve igual pero sin botones, y eso se lee como "esta roto" y no como "esto no
   es tuyo". */
const avisoArea = a => {
  const mias = (window.PUEDE && window.PUEDE.areas) || [];
  const t = String(a || '').trim().toUpperCase();
  if(!t || !mias.length || mias.indexOf(t) !== -1) return '';
  return `<p class="nota" style="border-left:3px solid var(--lila);padding-left:13px">
    Estás viendo <strong>${t === 'BARRA' ? 'Barra' : 'Cocina'}</strong>, que no es tu área:
    podés mirar todo, pero no editar. Lo tuyo es
    <strong>${mias.map(x => x === 'BARRA' ? 'Barra' : 'Cocina').join(' y ')}</strong>.</p>`;
};

const Q  = n => 'Q' + (n==null ? '—' : n.toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2}));
const Q0 = n => n==null ? '—' : 'Q' + Math.round(n);
const QU = n => n==null ? '—' : 'Q' + n.toLocaleString('es-GT',{minimumFractionDigits:n<1?4:2, maximumFractionDigits:n<1?5:2});
const nrm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const MIN = new Set(['de','del','la','el','y','en','con','a','al','los','las','por','the']);
/* Los nombres vienen del nombre de la pestana y estan en MAYUSCULAS. Se presentan en capital. */
const Tt = s => { s = String(s||'').trim(); if(!s) return '';
  if(s !== s.toUpperCase()) return s;
  return s.toLowerCase().split(/\s+/).map((w,i)=> (i>0 && MIN.has(w)) ? w : w.charAt(0).toUpperCase()+w.slice(1)).join(' '); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- motor de costos ---------- */
const memo = new Map();
function precioEf(id, guard){
  const ins = I[id]; if(!ins) return null;
  if(sim.has(id)) return sim.get(id);
  if(ins.sub != null && ins.pr){
    const g = guard || new Set();
    if(g.has('r'+ins.sub)) return ins.pr;
    const r = R[ins.sub];
    if(r && r.base > 0) return ins.pr * (batch(ins.sub, g) / r.base);
  }
  return ins.pr;
}
function batch(rid, guard){
  const g = guard ? new Set(guard) : new Set();
  if(g.has('r'+rid)) return R[rid].base;
  g.add('r'+rid);
  const key = rid + '|' + [...sim.entries()].sort().join(';');
  if(memo.has(key)) return memo.get(key);
  let s = 0;
  for(const ln of R[rid].ing){
    if(ln.i == null){ s += ln.t || 0; continue; }
    const base = I[ln.i].pr, ef = precioEf(ln.i, g);
    if(base && ln.t != null) s += ln.t * (ef / base);
    else s += (ln.q || 0) * (ef || 0);
  }
  memo.set(key, s);
  return s;
}
function costoAhora(r){
  if(!r.ing.length) return null;
  const b = batch(r.id);
  if(r.t === 'plato') return b * (1 + (r.merma || 0)/100);
  if(r.costoUnit != null && r.base > 0) return r.costoUnit * (b / r.base);
  return r.rinde ? b / r.rinde : b;
}
function cmvAhora(r){
  const c = costoAhora(r);
  return (c != null && r.precio) ? c / r.precio * 100 : null;
}
/* La meta sale de la receta: 30% en cocina, 20% en barra. */
function estadoDe(cmv, r){
  if(!r.ing.length) return 'vacia';
  if(r.t !== 'plato') return 'pre';
  if(!r.precio) return 'sin_precio';
  if(cmv == null) return 'vacia';
  if(cmv > r.obj + 5) return 'alto';
  if(cmv < r.obj * 0.6) return 'bajo';
  return 'ok';
}
const ETIQ = {ok:'En meta', alto:'Sobre meta', bajo:'Muy bajo', vacia:'Ficha vacía', sin_precio:'Sin precio', pre:'Pre-elaborado'};

/* ---------- filtros ---------- */
const enArea = x => !area || x.area === area;
function recetasVis(){
  // BUSCAR PASA POR ENCIMA DE TODO. Si hay texto en el buscador se ignoran los
  // filtros de tipo y de area, y se busca en el recetario entero.
  //
  // Antes no era asi y era un defecto real: la pestaña abre con el filtro "De carta"
  // puesto, que muestra solo platos. Buscar un pre-elaborado no daba NINGUN resultado,
  // aunque existiera. Y quien busca no tiene por que saber de antemano si lo que busca
  // es un plato, un pre-elaborado, o si es de cocina o de barra. Justamente busca
  // porque no lo sabe.
  if(q){
    const k = nrm(q);
    return R.filter(r => nrm(r.n).includes(k) || nrm(r.cat).includes(k)
      || r.ing.some(l => nrm(l.n).includes(k) || (l.i!=null && nrm(I[l.i].prov).includes(k))));
  }
  let list = R.filter(enArea);
  if(filt.rec === 'carta') list = list.filter(r => r.t === 'plato');
  else if(filt.rec === 'pre') list = list.filter(r => r.t === 'preelaborado');
  else if(filt.rec === 'alerta') list = list.filter(r => ['alto','vacia'].includes(estadoDe(cmvAhora(r), r)));
  else if(filt.rec === 'tocadas') list = list.filter(tocada);
  return list;
}
function tocada(r){
  if(!sim.size) return false;
  const c1 = costoAhora(r);
  return c1 != null && r.costo != null && Math.abs(c1 - r.costo) > 0.005;
}
function insumosVis(){
  // Mismo criterio que en recetas: buscar ignora los filtros y el area.
  if(q){
    const k = nrm(q);
    return I.filter(i => nrm(i.p).includes(k) || nrm(i.prov).includes(k) || nrm(i.c).includes(k));
  }
  let list = I.filter(enArea);
  if(filt.prov) list = list.filter(i => i.prov === filt.prov);
  if(filt.ins === 'usados') list = list.filter(i => i.usos.length);
  else if(filt.ins === 'sinuso') list = list.filter(i => !i.usos.length);
  else if(filt.ins === 'produccion') list = list.filter(i => i.sub != null || /PRODUCCION|PREELAB/i.test(i.c));
  return list;
}

function tarjeta(r){
  const cmv = cmvAhora(r), c = costoAhora(r), st = estadoDe(cmv, r);
  const base = r.cmv;
  let d = '';
  if(sim.size && base != null && cmv != null && Math.abs(cmv - base) > 0.05){
    const up = cmv > base;
    d = `<span class="delta" style="color:var(--${up?'alto':'meta'})">${up?'▲':'▼'} ${Math.abs(cmv-base).toFixed(1)} pts</span>`;
  }
  const tercera = r.t === 'plato'
    ? `<span class="fig"><span class="lbl">CMV · meta ${r.obj}%</span><span class="val big s-${st}">${cmv!=null?cmv.toFixed(1)+'%':'—'}</span>${d}</span>`
    : `<span class="fig"><span class="lbl">Por ${esc(r.unidadCosto||'porción')}</span><span class="val big">${QU(c)}</span></span>`;
  return `<button class="card" data-r="${r.id}">
    <span class="stripe b-${st}"></span>
    <span class="eyebrow">${esc(r.cat || (r.t==='plato'?'Sin categoría':'Producción Rosanta'))} · ${r.area==='BARRA'?'Barra':'Cocina'}</span>
    <h3>${esc(Tt(r.n))}</h3>
    <span class="badge s-${st}">${ETIQ[st]}</span>
    <span class="figs">
      <span class="fig"><span class="lbl">${r.t==='plato'?'Precio':'Batch'}</span><span class="val">${r.t==='plato'?(r.precio?Q0(r.precio):'—'):Q(batch(r.id))}</span></span>
      ${r.t==='plato'?`<span class="fig"><span class="lbl">Costo</span><span class="val">${c!=null?Q(c):'—'}</span></span>`:`<span class="fig"><span class="lbl">Rinde</span><span class="val" style="font-size:13px">${esc(r.rindeTexto||r.rinde||'—')}</span></span>`}
      ${tercera}
    </span>
  </button>`;
}

/* ===== Ingenieria de menu ==========================================
   La pantalla contesta "que hago esta semana", no "cual es la tabla".
   Orden: periodo -> cinco contadores -> una sola matriz -> las dos listas
   de accion -> el punto ciego. Sin tabla de detalle: esa ya esta en el
   Excel y en la pestana de Costeo, y empuja hacia abajo lo unico que pide
   una decision. Decision de Juanma, 26-ago-2026.
   Lee el payload de getIngenieriaMenu() tal como viene. No toca el .gs.
   ------------------------------------------------------------------ */
const IM_CLASES = {
  ESTRELLA:     ['Estrella',     'Protegela: no le toques el precio ni la receta'],
  CABALLO:      ['Caballo',      'Vende mucho y deja poco: bajale el costo'],
  ROMPECABEZAS: ['Rompecabezas', 'Deja bien y no se vende: empujala en sala'],
  PERRO:        ['Perro',        'Ni vende ni deja: sacala o rehacela']
};
/* El color es el argumento. Estrella en verde claro, caballo en verde bosque,
   rompecabezas en lila —el mismo lila del punto ciego y de "empujar en sala"—
   y perro en gris. Cambiar esto rompe la lectura de la matriz. */
const IM_COLOR = {
  ESTRELLA:'var(--im-medio)', CABALLO:'var(--im-bosque)',
  ROMPECABEZAS:'var(--im-lila)', PERRO:'var(--im-gris)'
};
/* Las ventanas son MULTIPLOS ENTEROS DE SEMANA, no meses de calendario. La venta
   de un restaurante depende del dia de la semana: un mes de 31 dias con 5 sabados
   contra uno de 28 con 4 no son comparables, y la popularidad es una razon de
   unidades —basta un fin de semana de mas para mover el mix y con el la
   clasificacion—. 4, 13 y 52 semanas siempre traen la misma cantidad de fines de
   semana, y calzan con el ritual del lunes. El sello de arriba dice el rango y los
   dias exactos, asi que el nombre corto nunca engana.
   "Ano" es un ano CORRIDO de 52 semanas, no "todo lo cargado": cuando entren datos
   de 2027, "todo" seria 14 meses y nadie lo notaria. */
const IM_VENTANAS = [
  [4,  'Mes',       'Últimas 4 semanas — el mes corrido'],
  [13, 'Trimestre', 'Últimas 13 semanas — el trimestre corrido. Es la ventana por defecto'],
  [52, 'Año',       'Últimas 52 semanas — el año corrido, o todo lo que haya si hay menos']
];
const imQ  = n => 'Q' + Math.round(n||0).toLocaleString('es-GT');
/* LA FECHA DEL CATALOGO DEL POS, en el sello y a la vista.
   Esta es la mitad del valor de resolver el catalogo solo: el problema nunca fue que
   el dato estuviera viejo, fue que NO HABIA FORMA DE DARSE CUENTA. Arriba de dos
   semanas se pone en rojo y pide exportar; si se leyo el respaldo en vez de la
   carpeta, tambien lo dice. */
const IM_CAT_DIAS = 14;
const IM_MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
                  'septiembre','octubre','noviembre','diciembre'];
function imCatalogo(c){
  if(!c) return '';
  if(!c.fecha) return `<span style="color:var(--im-alerta)">Catálogo del POS: sin fecha reconocible</span>`;
  const f = new Date(c.fecha);
  const txt = `${f.getDate()} de ${IM_MESES[f.getMonth()]} de ${f.getFullYear()}`;
  const dias = Math.floor((Date.now() - c.fecha) / 86400000);
  const viejo = dias > IM_CAT_DIAS;
  const extra = c.respaldo ? ' · leído del respaldo, no de la carpeta'
              : (c.aviso ? ' · ' + esc(c.aviso) : '');
  return `<span style="color:${viejo||c.respaldo||c.aviso ? 'var(--im-alerta)' : 'inherit'}">
    Catálogo del POS: ${txt}${viejo ? ' — hay que exportar de nuevo' : ''}${extra}</span>`;
}

const imFe = s => { const m = String(s||'').match(/(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2] : String(s||'—'); };

/* Nombres cortos, solo para las etiquetas dentro de la matriz. En las listas
   y en los tooltips siempre va el nombre completo. */
function imCorto(n){
  return String(n)
    .replace(/^(Whiskey|Ron|Tequila|Single Malts|Ginebra|Irlandes|Infusiones|Tes|Tés) - /,'')
    .replace(/ \/\/ Casa/,'')
    .replace('Ensalada Rosanta con','Ens.')
    .replace('Pasta de la Casa con','Pasta')
    .replace('Costillas de Cerdo con Cafe y Cardamomo','Costillas')
    .replace('Pollo en Salsa de Tamarindo','Pollo Tamarindo')
    .replace('Camarones al Horno','Camarones')
    .replace('Pulpo a la Parrilla','Pulpo')
    .replace('Brisket en Salsa Bordelesa','Brisket')
    .replace('Coliflor a la Parrilla con Romesco','Coliflor')
    .replace('Tabla de Jamones y Quesos','Tabla Jamones')
    .replace('Ejotes al Aceite de Ajonjoli y Ajo','Ejotes')
    .replace('Agua Natural de la casa 1L','Agua natural')
    .replace(/^Pan de la Casa$/,'Pan');
}

/* La matriz. Una sola, no una por categoria: cada punto ya viene normalizado
   contra el umbral y el margen promedio DE SU PROPIA CATEGORIA, asi que el
   cruce cae siempre en 1x1 y caben todas las categorias en un plano sin
   romper la regla de comparar solo dentro de la categoria.
   El tamano es la contribucion en quetzales. */
function imMatriz(pts, sin){
  const W=560, H=340, L=44, R=16, T=18, B=56;
  const rx = pts.map(p=>p.popNorm), ry = pts.map(p=>p.mcNorm);
  /* Topamos el eje en el percentil 92 para que un solo producto altisimo no
     aplaste a los demas contra el origen. Lo que se sale se dibuja en el borde. */
  const pc = (a,q)=>{ const s=a.slice().sort((x,y)=>x-y); return s.length ? s[Math.min(s.length-1, Math.floor(s.length*q))] : 1; };
  const mx = Math.min(Math.max(2.2,...rx,0)*1.06, Math.max(2.2, pc(rx,.92)*1.35));
  const my = Math.min(Math.max(1.7,...ry,0)*1.08, Math.max(1.7, pc(ry,.92)*1.30));
  const X = v => L + Math.min(v,mx)/mx*(W-L-R);
  const Y = v => H-B - Math.min(v,my)/my*(H-T-B);
  const maxC = Math.max(1, ...pts.map(p=>Math.abs(p.contrib)||0));

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Matriz de ingeniería de menú">`;
  s += `<rect x="${X(1)}" y="${T}" width="${W-R-X(1)}" height="${Y(1)-T}" fill="var(--im-wash)"/>`;
  s += `<line class="im-cross" x1="${X(1)}" y1="${T}" x2="${X(1)}" y2="${H-B}"/>`;
  s += `<line class="im-cross" x1="${L}" y1="${Y(1)}" x2="${W-R}" y2="${Y(1)}"/>`;
  /* Los rotulos fijos se guardan y se dibujan AL FINAL, encima de todo. Iban
     primero, y entonces cualquier punto que cayera cerca del origen les pasaba el
     circulo por encima: con datos reales de cocina, dos platos tapaban "perro" y la
     leyenda del cuadrante se perdia. Los nombres de producto ya esquivan estas
     cajas; lo que faltaba era protegerlas de los circulos, que se dibujan donde
     manda el dato y no esquivan nada. El halo del CSS hace el resto. */
  const fijos =
      `<text class="im-qz" x="${W-R-4}" y="${T+11}" text-anchor="end" fill="var(--im-medio)">estrella</text>`
    + `<text class="im-qz" x="${L+4}" y="${T+11}" fill="var(--im-lila)">rompecabezas</text>`
    + `<text class="im-qz" x="${W-R-4}" y="${H-B-5}" text-anchor="end" fill="var(--im-bosque)">caballo</text>`
    + `<text class="im-qz" x="${L+4}" y="${H-B-5}" fill="var(--im-gris)">perro</text>`
    + `<text class="im-axl" x="${X(1)}" y="${H-B+13}" text-anchor="middle">umbral de su categoría</text>`
    + `<text class="im-axl" x="${L-6}" y="${Y(1)+3}" text-anchor="end">MC prom.</text>`
    + `<text class="im-axt" x="${W-R}" y="${H-4}" text-anchor="end">popularidad relativa →</text>`
    + `<text class="im-axt" x="${L-6}" y="${T+2}" text-anchor="end" transform="rotate(-90 ${L-6} ${T+2})">margen relativo →</text>`;

  /* LOS NOMBRES. Antes solo se etiquetaban los siete de mayor contribucion y
     las etiquetas se pisaban con los puntos: en barra, con 50 circulos, la
     mitad de los nombres caia encima de un dato. Ahora se intenta etiquetar
     TODOS, en orden de contribucion —el que mas pesa escoge lugar primero— y
     cada nombre se prueba en ocho posiciones alrededor de su punto. Si ninguna
     queda libre de otros nombres y de otros circulos, ese punto se queda sin
     etiqueta y se lee con el mouse. Asi la matriz nunca miente por encimarse.  */
  const orden = pts.slice().sort((a,b)=>(Math.abs(b.contrib)||0)-(Math.abs(a.contrib)||0));
  const circ = [], textos = [];
  /* Los rotulos fijos del plano —los cuatro cuadrantes, los ejes y el titulo
     vertical— entran como cajas ocupadas antes que ningun nombre, para que
     ningun producto se les monte encima. */
  const cajas = [[L-2,T,L+78,T+13],[W-R-58,T,W-R,T+13],
                 [L-2,H-B-14,L+40,H-B-2],[W-R-46,H-B-14,W-R,H-B-2],
                 [L-40,Y(1)-8,L+1,Y(1)+3],[L-2,T,L+11,H-B-2]];

  orden.forEach(p=>{
    const x = X(p.popNorm), y = Y(p.mcNorm);
    const rad = 4 + Math.sqrt(Math.max(Math.abs(p.contrib)||0,0)/maxC)*8;
    circ.push([x,y,rad]);
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${IM_COLOR[p.clase]}" opacity=".8"><title>${esc(p.n)} — ${esc(p.cat)}
${p.uds} uds · margen ${imQ(p.mc)} · contribución ${imQ(p.contrib)}
Precio de carta ${imQ(p.precio)} · neto ${imQ(p.precioNeto)} · costo ${imQ(p.costo)} · CMV ${(p.cmv*100).toFixed(1)}%</title></circle>`;
  });

  const choca = (b, saltar) => {
    if(b[0] < 2 || b[2] > W-2 || b[1] < T-6 || b[3] > H-B-2) return true;
    for(let i=0;i<cajas.length;i++){ const c=cajas[i];
      if(b[0] < c[2]+3 && b[2] > c[0]-3 && b[1] < c[3]+2 && b[3] > c[1]-2) return true; }
    for(let i=0;i<circ.length;i++){ if(i===saltar) continue;
      const [cx,cy,cr]=circ[i];
      const dx = Math.max(b[0]-cx, 0, cx-b[2]), dy = Math.max(b[1]-cy, 0, cy-b[3]);
      if(dx*dx+dy*dy < (cr+1.5)*(cr+1.5)) return true; }
    return false;
  };

  orden.forEach((p,i)=>{
    const [x,y,rad] = circ[i];
    const txt = imCorto(p.n), an = 4.55*txt.length + 2, alt = 9;   /* ancho aproximado a 9px */
    /* Derecha e izquierda primero —es donde se lee mejor—, despues arriba y
       abajo, y por ultimo las diagonales. */
    const cand = [[rad+4,3.2,'start'],[-(rad+4),3.2,'end'],[0,-(rad+5),'middle'],[0,rad+11,'middle'],
                  [rad+4,-(rad+2),'start'],[-(rad+4),-(rad+2),'end'],[rad+4,rad+8,'start'],[-(rad+4),rad+8,'end']];
    for(const [dx,dy,anc] of cand){
      const lx = x+dx, ly = y+dy;
      const x0 = anc==='start' ? lx : anc==='end' ? lx-an : lx-an/2;
      const caja = [x0, ly-alt+1.5, x0+an, ly+2];
      if(choca(caja, i)) continue;
      cajas.push(caja);
      textos.push(`<text class="im-lab" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anc}">${esc(txt)}</text>`);
      return;
    }
  });
  s += textos.join('');

  /* Repartidos parejo a lo ancho, no por popularidad: aca lo que importa es
     cuantos son, no donde caerian. Amontonados no se cuentan. */
  const b0 = L+54, b1 = W-R, paso = sin.length>1 ? (b1-b0)/(sin.length-1) : 0;
  sin.forEach((p,i)=>{
    const x = sin.length>1 ? b0 + i*paso : (b0+b1)/2;
    s += `<circle cx="${x.toFixed(1)}" cy="${H-B+32}" r="3.5" fill="none" stroke="var(--im-lila)" stroke-width="1.4" stroke-dasharray="2.5 2"><title>${esc(p.n)} — sin costo confiable · ${p.uds} uds</title></circle>`;
  });
  if(sin.length) s += `<text class="im-axl" x="${L-6}" y="${H-B+35}" text-anchor="end" fill="var(--im-lila)">sin costo</text>`;
  return s + fijos + '</svg>';
}

function vistaMenu(){
  const d = window.__IM__;
  const bar = `<div class="im-bar">
      <div class="im-grp"><b>Área</b><div class="im-seg" role="group" aria-label="Área">
        ${['COCINA','BARRA'].map(a=>`<button data-ima="${a}" aria-pressed="${imArea===a}">${a==='COCINA'?'Cocina':'Barra'}</button>`).join('')}
      </div></div>
      <div class="im-grp"><b>Ventana</b><div class="im-seg" role="group" aria-label="Ventana">
        ${IM_VENTANAS.map(([n,l,t])=>`<button data-ims="${n}" title="${t}" aria-pressed="${imSemanas===n}">${l}</button>`).join('')}
      </div></div>
      <div class="im-stamp" id="imStamp"><b>${d&&d.ok?imFe(d.desde)+' – '+imFe(d.hasta)+' · '+d.dias+' días':'—'}</b>
        <span>${d&&d.ok?d.tickets.toLocaleString('es-GT')+' tickets · '+imQ(d.venta)+(d.cargadoEl?' · cargado el '+esc(d.cargadoEl):''):'—'}</span>
        ${d&&d.ok?imCatalogo(d.catalogo):''}</div>
    </div>`;
  if(!d)    return `<div id="im">${bar}<p class="empty">Leyendo las ventas…</p></div>`;
  if(!d.ok) return `<div id="im">${bar}<p class="empty">${esc(d.error||'No se pudo leer')}</p></div>`;

  const a = d.areas[imArea], c = a.conteo;
  const lead = `<p class="im-lead">${a.productos} productos con venta · ${a.firmes} con costo firme ·
    CMV ponderado <strong>${(a.cmv*100).toFixed(1)}%</strong> ·
    contribución <strong>${imQ(a.contribucion)}</strong> ·
    recuperable contra meta <strong>${imQ(a.recuperable)}/año</strong></p>`;

  const kpis = `<div class="im-kpis">
    ${Object.keys(IM_CLASES).map(k=>`<div class="im-k" style="--im-kc:${IM_COLOR[k]}">
      <b>${c[k]}</b><span>${IM_CLASES[k][0]}</span><em>${IM_CLASES[k][1]}</em></div>`).join('')}
    <div class="im-k" style="--im-kc:var(--im-lila)"><b>${c['SIN CLASIFICAR']}</b><span>Sin costo</span>
      <em>${a.sinCostoUds.toLocaleString('es-GT')} uds · ${imQ(a.sinCostoVenta)} sin poder medir</em></div>
  </div>`;

  /* "Empujar en sala" solo trae productos con al menos una venta al mes. Sin ese
     piso la barra proponia empujar el Macallan 12: una copa en ocho meses. Eso no
     es una decision, es una corazonada. El filtro ya viene hecho del .gs. */
  const push = a.empujar.slice(0,5).map(p=>{
    const mp = p.mcNorm ? p.mc/p.mcNorm : 0;
    return `<li><span class="im-nm">${esc(p.n)}<small>${esc(p.cat)} · ${Math.round(p.udsMes)} al mes · margen ${imQ(p.mc)} contra ${imQ(mp)} de su categoría</small></span>
      <span class="im-vv" style="color:var(--im-lila)">+${imQ(p.mc*5*12)}<small>por 5 más al mes</small></span></li>`;
  }).join('') || `<li><span class="im-nm im-vacio">Nada que empujar con el piso de una venta al mes.</span></li>`;

  const meta = a.fueraDeMeta.slice(0,5).map(p=>
    `<li><span class="im-nm">${esc(p.n)}<small>${(p.cmv*100).toFixed(1)}% contra meta de ${(p.meta*100).toFixed(0)}% · ${p.uds} uds</small></span>
      <span class="im-vv" style="color:var(--im-alerta)">${imQ(p.vsMeta)}<small>al año</small></span></li>`
  ).join('') || `<li><span class="im-nm im-vacio">Todo dentro de meta.</span></li>`;

  /* CUATRO SECCIONES, cada tema en su propio panel con su titulo: la matriz,
     empujar en sala, fuera de meta, y el punto ciego. Antes las dos listas de
     accion compartian caja y se leian como una sola cosa; son dos decisiones
     distintas —una es de sala y la otra es de costo— y cada una tiene su
     propio numero. Decision de Juanma, 29-ago-2026. */
  const secMatriz = `<div class="im-panel">
      <h3>Dónde está cada producto</h3>
      <p class="im-h">Todas las categorías en un solo plano. Cada punto está medido contra el umbral y el
        margen promedio <strong>de su propia categoría</strong>, así que el cruce siempre cae en 1&nbsp;×&nbsp;1.
        El tamaño es la contribución. Pasá el mouse para el detalle.</p>
      ${imMatriz(a.puntos, a.sinCosto)}
    </div>`;

  const secPush = `<div class="im-panel">
      <h3 style="color:var(--im-lila)">Empujar en sala</h3>
      <p class="im-h">Dejan buen margen y se venden poco. Solo entran los que venden al menos una vez
        al mes: empujar algo que nadie pide no es una decisión, es una corazonada.</p>
      <ul class="im-acc">${push}</ul>
    </div>`;

  const secMeta = `<div class="im-panel">
      <h3 style="color:var(--im-alerta)">Fuera de meta</h3>
      <p class="im-h">Lo que cuesta al año no llegar al objetivo de CMV de su categoría.
        Acá la palanca es el costo o la receta, no la sala.</p>
      <ul class="im-acc">${meta}</ul>
    </div>`;

  const cols = `<div class="im-cols">${secMatriz}<div class="im-stack">${secPush}${secMeta}</div></div>`;

  /* El punto ciego. Tope de 12 y una linea de resumen para el resto: la lista
     completa no cabe y tampoco hace falta. */
  const TOP = 12, vis = a.sinCosto.slice(0,TOP), resto = a.sinCosto.slice(TOP);
  const ciego = !a.sinCosto.length ? '' : `<div class="im-panel">
    <h3 style="color:var(--im-lila)">Lo que no se puede medir</h3>
    <p class="im-h">${a.sinCosto.length} productos se venden sin un costo en el que se pueda confiar —
      ${a.sinCostoUds.toLocaleString('es-GT')} unidades y ${imQ(a.sinCostoVenta)} en esta ventana.
      Ninguno entra a la matriz: clasificarlos sería inventar.</p>
    <div class="im-ciego">
      ${vis.map(p=>`<div class="im-cg"><div class="im-cr"><span class="im-cn">${esc(p.n)}</span>
        <span class="im-cv">${imQ(p.venta)}</span></div><span class="im-cm">${esc(p.cat)} · ${p.uds} uds</span></div>`).join('')}
      ${resto.length?`<div class="im-cg im-resto"><div class="im-cr"><span class="im-cn">y ${resto.length} más</span>
        <span class="im-cv">${imQ(resto.reduce((s,p)=>s+p.venta,0))}</span></div>
        <span class="im-cm">${resto.reduce((s,p)=>s+p.uds,0)} uds entre todos</span></div>`:''}
    </div></div>`;

  return `<div id="im">${bar}${lead}${kpis}${cols}${ciego}</div>`;
}

const DB_VENTANAS = IM_VENTANAS;   // la misma ventana y por la misma razon

/* Verde si esta en meta o abajo, naranja si esta arriba. El color es el
   veredicto: un numero sin veredicto obliga a recordar cual era la meta. */
const dbSemaforo = (valor, meta) => valor <= meta ? 'var(--meta)' : 'var(--alto)';
const dbPct = n => (n * 100).toFixed(1) + '%';

function dbTile(o){

}

/* UNA SOLA LLAMADA PARA LAS DOS PANTALLAS.
   El tablero y la ingenieria de menu miran los mismos numeros desde angulos
   distintos, y cada uno se los pedia por su cuenta: el servidor leia la hoja de
   9.500 filas y clasificaba los 130 productos DOS VECES. Medido el 30-ago-2026:
   10.5 s cada llamada. Ahora getProfitOS calcula una vez y devuelve las dos, asi
   que abrir el modulo cuesta una pasada y la segunda pestana abre al instante.

   Las dos ventanas son independientes —se puede mirar el tablero en Trimestre y la
   matriz en Ano—, asi que se guarda por ventana. Cambiar una trae las dos de esa
   ventana: es una llamada igual, y deja la otra pestana lista. */
window.__POS_CACHE__ = window.__POS_CACHE__ || {};   // el arranque ya pudo llenarlo
/* El gancho que usa el arranque: si el prefetch aterriza DESPUES de iniciarApp,
   entra por aca. Si aterrizo antes, pedirProfitOS lo encuentra en el cache. */
window.__profitListo = function(semanas){
  var r = window.__POS_CACHE__[semanas];
  if(r) aplicarProfitOS(semanas, r);
};
function pedirProfitOS(semanas){
  const guardado = window.__POS_CACHE__[semanas];
  if(guardado){ aplicarProfitOS(semanas, guardado); return; }
  if(window.__POSCARGANDO__ === semanas) return;
  window.__POSCARGANDO__ = semanas;
  google.script.run
    .withSuccessHandler(function(r){
      window.__POSCARGANDO__ = null;
      window.__POS_CACHE__[semanas] = r;
      aplicarProfitOS(semanas, r);
      pedirAvisos();
    })
    .withFailureHandler(function(e){
      window.__POSCARGANDO__ = null;
      const err = {ok:false, error:e.message};
      aplicarProfitOS(semanas, {tablero:err, menu:err});
      pedirAvisos();
    })
    .getProfitOS(AUTH, semanas);
}
/* Cada payload entra solo si su selector sigue en esa ventana: si alguien cambio
   de ventana mientras la llamada viajaba, lo que llega ya no es lo que se pidio. */
function aplicarProfitOS(semanas, r){
  if(dbSemanas === semanas) window.__DB__ = r.tablero;
  if(imSemanas === semanas) window.__IM__ = r.menu;
  pintar();
}

/* LOS AVISOS SALEN DESPUES DE LOS NUMEROS, no a la par.
   Tocan Drive, el catalogo del POS y el semaforo del cierre: son lo mas lento de
   la pantalla y ademas son lo menos urgente. Lanzados junto con getDashboard, las
   dos llamadas compiten por los mismos documentos y el tablero entero espera a que
   Drive conteste. Encadenados, los seis numeros se pintan primero y los avisos
   aparecen solos cuando esten. */
function pedirAvisos(){
  if(window.__DBAV__ || window.__DBAVCARGANDO__) return;
  window.__DBAVCARGANDO__ = true;
  google.script.run
    .withSuccessHandler(function(r){ window.__DBAV__ = (r && r.avisos) || [];
                                     if(view==='inicio') pintar(); })
    .withFailureHandler(function(){ window.__DBAV__ = []; window.__DBAVCARGANDO__ = false; })
    .getAvisosDashboard(AUTH);
}

function pintar(){
  memo.clear();
  // Se derivan del DOM y NO de una lista a mano: el 29-ago-2026 se agrego la seccion
  // v-menu, se cableo el ruteo y la vista se calculaba entera... pero quedaba oculta,
  // porque el nombre faltaba en el arreglo. Un modo de falla mudo — la pestana se veia
  // vacia sin un solo error en consola. Asi, una seccion nueva funciona sola.
  document.querySelectorAll('main > section[id^="v-"]').forEach(s => s.hidden = s.id !== 'v-' + view);
  if(view==='recetas')     document.getElementById('v-recetas').innerHTML = vistaRecetas();
  if(view==='insumos')     document.getElementById('v-insumos').innerHTML = vistaInsumos();
  if(view==='proveedores') document.getElementById('v-proveedores').innerHTML = vistaProveedores();
  if(view==='guia')        document.getElementById('v-guia').innerHTML = vistaGuia();
  if(view==='inicio'){
    document.getElementById('v-inicio').innerHTML = vistaInicio();
    if(!window.__DB__) pedirProfitOS(dbSemanas);
  }
  if(view==='menu'){
    document.getElementById('v-menu').innerHTML = vistaMenu();
    if(!window.__IM__) pedirProfitOS(imSemanas);
  }
  if(view==='higiene'){
    document.getElementById('v-higiene').innerHTML = vistaHigiene();
    if(!window.__HIG__ && !window.__HIGCARGANDO__){
      window.__HIGCARGANDO__ = true;
      google.script.run.withSuccessHandler(function(h){ window.__HIG__ = h; if(view==='higiene') pintar(); })
        .withFailureHandler(function(e){ document.getElementById('v-higiene').innerHTML = '<p class="empty">'+e.message+'</p>'; })
        .getReporteHigiene(AUTH);
    }
  }
  document.querySelectorAll('.nav button[data-view]').forEach(b => b.setAttribute('aria-selected', b.dataset.view===view));
  document.querySelectorAll('.areas button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.area||'')===area));
  simbar();
}
function simbar(){
  const bar = document.getElementById('simbar');
  bar.classList.toggle('on', sim.size>0);
  if(!sim.size) return;
  const af = R.filter(tocada);
  const platos = af.filter(r => r.t==='plato' && r.precio);
  const fuera = platos.filter(r => { const c = cmvAhora(r); return c!=null && c > r.obj+5; }).length;
  const antes = platos.filter(r => r.cmv!=null && r.cmv > r.obj+5).length;
  document.getElementById('simtext').innerHTML =
    `<strong>${sim.size} precio${sim.size===1?'':'s'} simulado${sim.size===1?'':'s'}</strong> · ${af.length} receta${af.length===1?'':'s'} afectada${af.length===1?'':'s'} · platos sobre meta: ${antes} → <strong>${fuera}</strong>`;
}

        <p style="font-size:12.5px;color:var(--muted);margin:8px 0 0"><strong>Simular</strong> no guarda nada: sirve para ver el impacto antes de aceptarlo.${(window.PUEDE && window.PUEDE.cambiarPrecio) ? ` <strong>Registrar</strong> escribe el precio en el Banco de Datos y lo deja en el histórico con fecha y factura.` : ` Para registrar el precio hace falta un permiso que tu rol no tiene; simular podés siempre.`}</p>
      </div>
      ${(window.PUEDE && window.PUEDE.crearProveedor && AREA_EDITABLE(i.area)) ? `<div>
        <div class="sec-t">Proveedor</div>
        <div class="simrow">
          <input id="np-prov" list="lista-provs" value="${esc(i.prov==='—'?'':i.prov)}" placeholder="Proveedor" style="width:240px" autocomplete="off">
          <button class="chip" id="np-prov-save" data-prod="${esc(i.p)}" data-area="${esc(i.area||'COCINA')}">Guardar</button>
        </div>
        <datalist id="lista-provs">${P.map(x=>`<option value="${esc(x.nombre)}">`).join('')}</datalist>
        <p style="font-size:12.5px;color:var(--muted);margin:8px 0 0">Cambia a quién le compramos este producto. <strong>No toca el precio.</strong> Si el proveedor todavía no existe, creálo primero en la pestaña Proveedores.</p>
      </div>` : ''}
      <div><div class="sec-t">Historial de precios</div>${histHTML}</div>
      <div>
        <div class="sec-t">Se usa en ${usos.length} receta${usos.length===1?'':'s'}</div>
        ${usos.length ? [
          platos.length?`<div style="margin-bottom:10px"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">Platos y cócteles</div>${platos.map(linea).join('')}</div>`:'',
          pre.length?`<div><div style="font-size:12px;color:var(--muted);margin-bottom:4px">Pre-elaborados</div>${pre.map(linea).join('')}</div>`:''
        ].join('') : `<p style="color:var(--muted);font-size:13.5px;margin:0">Ninguna ficha lo usa hoy. O sobra en el Banco, o el nombre no coincide con el que escribió cocina.</p>`}
      </div>
    </div>`;
}
function abrirInsumo(id){
  const i = I[id];
  abrir(insumoHTML(i, undefined));
  google.script.run
    .withSuccessHandler(function(h){ if(dr.classList.contains('on')) abrir(insumoHTML(i, h)); })
    .withFailureHandler(function(){ if(dr.classList.contains('on')) abrir(insumoHTML(i, [])); })
    .getHistorialPrecios(AUTH, i.p);
}
function linea(r){
  const cmv = cmvAhora(r), st = estadoDe(cmv,r);
  return `<button class="linkline" data-r="${r.id}">${esc(Tt(r.n))} <span style="color:var(--muted)">· ${cmv!=null?cmv.toFixed(1)+'% de '+r.obj+'%':'sin CMV'}</span></button>`;
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.classList.contains('close')) return cerrar();
  if(t.dataset.ima){ imArea = t.dataset.ima; pintar(); return; }
  if(t.dataset.dbs !== undefined){
    dbSemanas = +t.dataset.dbs; window.__DB__ = null; pintar(); return;
  }
  if(t.dataset.ims !== undefined){
    imSemanas = +t.dataset.ims; window.__IM__ = null; pintar(); return;
  }
  if(t.dataset.view){ view = t.dataset.view; pintar(); return; }
  if(t.dataset.area !== undefined && t.closest('.areas')){ area = t.dataset.area || ''; filt.prov=null; pintar(); return; }
  if(t.dataset.fr){ filt.rec = t.dataset.fr; pintar(); return; }
  if(t.dataset.fi){ if(t.dataset.fi==='_prov'){filt.prov=null;} else filt.ins = t.dataset.fi; pintar(); return; }
  if(t.dataset.p){ filt.prov = t.dataset.p; filt.ins='todos'; view='insumos'; area=''; pintar(); return; }
  if(t.dataset.r != null && t.dataset.r !== ''){ abrir(fichaHTML(R[+t.dataset.r])); return; }
  if(t.id === 'aplicar'){
    const id = +t.dataset.i, ins = I[id], v = parseFloat(document.getElementById('np').value);
    if(!isNaN(v) && ins.pc) sim.set(id, ins.pr * (v / ins.pc));
    else if(!isNaN(v)) sim.set(id, v);
    memo.clear(); abrirInsumo(id); pintar(); return;
  }
  if(t.id === 'quitar'){ const id=+t.dataset.i; sim.delete(id); memo.clear(); abrirInsumo(id); pintar(); return; }
  if(t.id === 'registrar'){
    const id = +t.dataset.i, ins = I[id];
    const v = parseFloat(document.getElementById('np').value);
    if(isNaN(v) || v <= 0){ alert('Escribí un precio de compra válido.'); return; }
    const fac = prompt('Número de factura o boleta (podés dejarlo vacío):', '');
    if(fac === null) return;
    t.disabled = true; t.textContent = 'Guardando…';
    google.script.run
      .withSuccessHandler(function(res){
        sim.delete(id);
        alert('Guardado. ' + res.producto + ': Q' + res.antes + ' → Q' + res.ahora +
              (res.variacion!=null ? ' (' + (res.variacion>0?'+':'') + res.variacion.toFixed(1) + '%)' : '') +
              '\n' + res.recetasAfectadas.length + ' receta(s) recalculada(s).');
        location.reload();
      })
      .withFailureHandler(function(e){ t.disabled = false; t.textContent = 'Registrar precio'; alert('No se pudo guardar: ' + e.message); })
      .registrarPrecio(AUTH, {producto: ins.p, proveedor: ins.prov, precioCompra: v, factura: fac});
    return;
  }
  // --- abrir el formulario de receta nueva
  if(t.id === 'nueva'){ nfTipo = 'plato'; abrir(fichaNuevaHTML()); return; }
  if(t.dataset.nft){ nfTipo = t.dataset.nft; abrir(fichaNuevaHTML()); return; }

  // --- crear la ficha
  if(t.id === 'nf-crear'){
    const esPlato = nfTipo === 'plato';
    const datos = {
      tipo: nfTipo,
      nombre: (document.getElementById('nf-nombre').value || '').trim(),
      nota: (document.getElementById('nf-nota').value || '').trim()
    };
    if(!datos.nombre){ alert('Escribi el nombre de la receta.'); return; }
    if(esPlato){
      datos.categoria = (document.getElementById('nf-cat').value || '').trim();
      datos.precio = parseFloat(document.getElementById('nf-precio').value);
      if(!datos.categoria){ alert('Elegi o escribi una categoria.'); return; }
      if(isNaN(datos.precio) || datos.precio <= 0){ alert('El precio de carta tiene que ser mayor que cero.'); return; }
    } else {
      datos.rinde = parseFloat(document.getElementById('nf-rinde').value);
      if(isNaN(datos.rinde) || datos.rinde <= 0){ alert('El rinde tiene que ser mayor que cero.'); return; }
    }
    t.disabled = true; t.textContent = 'Creando\u2026';
    google.script.run
      .withSuccessHandler(function(res){
        if(!res || !res.ok){
          t.disabled = false; t.textContent = 'Crear la ficha';
          alert('No se creo: ' + ((res && res.error) || 'sin respuesta'));
          return;
        }
        alert('Listo. Se creo la pestaña "' + res.resultado.pestana + '".' +
              (res.resultado.filaResumen ? '\nRESUMEN CMV, fila ' + res.resultado.filaResumen + ', marcada por costear.' : ''));
        location.reload();
      })
      .withFailureHandler(function(e){ t.disabled = false; t.textContent = 'Crear la ficha'; alert('No se pudo crear: ' + e.message); })
      .webCrearFicha(AUTH, datos, area || 'COCINA');
    return;
  }

  // --- quitar una linea de la ficha
  if(t.classList.contains('qdel')){
    const fila = +t.dataset.f, r = R[+t.dataset.rid];
    const ln = r.ing.filter(function(x){ return x.f === fila; })[0];
    if(!confirm('Quitar "' + (ln ? ln.n : 'esta linea') + '" de ' + r.n + '?\n\nLa linea queda vacia y el costo del plato baja. Se puede volver a agregar despues.')) return;
    t.disabled = true;
    google.script.run
      .withSuccessHandler(function(res){
        if(!res || !res.ok){ t.disabled = false; alert('No se quito: ' + ((res && res.error) || 'sin respuesta')); return; }
        location.reload();
      })
      .withFailureHandler(function(e){ t.disabled = false; alert('No se pudo quitar: ' + e.message); })
      .webQuitarLinea(AUTH, r.n, fila, r.area);
    return;
  }

  // --- cambiar el proveedor de un insumo. NO toca el precio.
  if(t.id === 'np-prov-save'){
    const prod = t.dataset.prod;
    const prov = (document.getElementById('np-prov').value || '').trim();
    if(!prov){ alert('Escribi un proveedor.'); return; }
    t.disabled = true; t.textContent = 'Guardando…';
    google.script.run
      .withSuccessHandler(function(res){
        if(!res || !res.ok){
          t.disabled = false; t.textContent = 'Guardar';
          alert('No se guardo: ' + ((res && res.error) || 'sin respuesta'));
          return;
        }
        location.reload();
      })
      .withFailureHandler(function(e){ t.disabled = false; t.textContent = 'Guardar'; alert('No se pudo guardar: ' + e.message); })
      .webAsignarProveedor(AUTH, prod, prov, t.dataset.area);
    return;
  }

  // --- alta de insumo en el Banco.
  // El servidor contesta {ok:false, motivo:'posible duplicado', similares:[...]} cuando
  // encuentra parecidos. Eso NO es un error: es la pregunta. Se muestra y se reintenta
  // con confirmar=true. Si se tratara como error, el candado anti-duplicados seria un
  // muro en vez de un aviso, y el Banco ya tiene un "Perejil" y un "Prejil" que
  // demuestran lo caro que sale no preguntar.
  if(t.id === 'ni-add'){
    const val = id => (document.getElementById(id).value || '').trim();
    const datos = {
      producto: val('ni-prod'), categoria: val('ni-cat'),
      precioCompra: parseFloat(val('ni-pc')),
      unidadCompra: val('ni-uc'), unidadReceta: val('ni-ur'),
      contenido: val('ni-cont') ? parseFloat(val('ni-cont')) : null,
      proveedor: val('ni-prov')
    };
    if(!datos.producto){ alert('Falta el nombre del producto.'); return; }
    if(isNaN(datos.precioCompra) || datos.precioCompra <= 0){ alert('El precio de compra tiene que ser mayor que cero.'); return; }
    if(!datos.unidadCompra || !datos.unidadReceta){ alert('Faltan la unidad de compra y la de receta.'); return; }

    const mandar = function(confirmar){
      t.disabled = true; t.textContent = 'Creando…';
      google.script.run
        .withSuccessHandler(function(res){
          t.disabled = false; t.textContent = 'Crear';
          if(res && res.ok){ location.reload(); return; }
          if(res && res.motivo === 'posible duplicado'){
            const lista = res.similares.map(s => '  · ' + s.producto + '  (' + s.similitud + '% ' + s.motivo + ', Q' + s.precio + ' / ' + s.unidad + ')').join('\n');
            if(confirm('Ya hay algo parecido en el Banco:\n\n' + lista +
                       '\n\n¿Crear "' + datos.producto + '" igual?\n\nSi es el mismo producto, cancelá y cambiale el precio al que ya existe.')){
              mandar(true);
            }
            return;
          }
          if(res && res.requiereContenido){
            alert('Falta el contenido.\n\n' + (res.motivo || '') +
                  '\n\nUn envase (manojo, caja, frasco) necesita saber cuántas ' + datos.unidadReceta + ' trae.');
            return;
          }
          alert('No se creo: ' + ((res && res.motivo) || (res && res.error) || 'sin respuesta'));
        })
        .withFailureHandler(function(e){ t.disabled = false; t.textContent = 'Crear'; alert('No se pudo crear: ' + e.message); })
        .webCrearInsumo(AUTH, datos, confirmar, area || 'COCINA');
    };
    mandar(false);
    return;
  }

  // --- alta de proveedor. Mismo flujo de confirmacion que el insumo.
  if(t.id === 'npr-add'){
    const val = id => (document.getElementById(id).value || '').trim();
    const datos = { nombre: val('npr-nom'), nit: val('npr-nit'),
                    contacto: val('npr-con'), telefono: val('npr-tel') };
    if(!datos.nombre){ alert('Falta el nombre del proveedor.'); return; }

    const mandar = function(confirmar){
      t.disabled = true; t.textContent = 'Creando…';
      google.script.run
        .withSuccessHandler(function(res){
          t.disabled = false; t.textContent = 'Crear';
          if(res && res.ok){ location.reload(); return; }
          if(res && res.motivo === 'posible duplicado'){
            const lista = res.similares.map(s => '  · ' + s.nombre + '  (' + s.similitud + '%)').join('\n');
            if(confirm('Ya hay un proveedor parecido:\n\n' + lista +
                       '\n\n¿Crear "' + datos.nombre + '" igual?')){
              mandar(true);
            }
            return;
          }
          alert('No se creo: ' + ((res && res.motivo) || (res && res.error) || 'sin respuesta'));
        })
        .withFailureHandler(function(e){ t.disabled = false; t.textContent = 'Crear'; alert('No se pudo crear: ' + e.message); })
        .webCrearProveedor(AUTH, datos, confirmar);
    };
    mandar(false);
    return;
  }

  // --- agregar una linea. La unidad NO se pide: la pone el Banco.
  if(t.id === 'np-add'){
    const r = R[+t.dataset.rid];
    const prod = (document.getElementById('np-prod').value || '').trim();
    const cant = parseFloat(document.getElementById('np-cant').value);
    if(!prod){ alert('Elegi un producto del Banco de Datos.'); return; }
    if(isNaN(cant) || cant <= 0){ alert('La cantidad tiene que ser mayor que cero.'); return; }
    t.disabled = true; t.textContent = 'Agregando\u2026';
    google.script.run
      .withSuccessHandler(function(res){
        if(!res || !res.ok){
          t.disabled = false; t.textContent = 'Agregar';
          alert('No se agrego: ' + ((res && res.error) || 'sin respuesta'));
          return;
        }
        location.reload();
      })
      .withFailureHandler(function(e){ t.disabled = false; t.textContent = 'Agregar'; alert('No se pudo agregar: ' + e.message); })
      .webAgregarLinea(AUTH, r.n, prod, cant, '', r.area);   // unidad vacia: manda el Banco
    return;
  }

  // --- precio de carta
  if(t.id === 'np-menu-save'){
    const r = R[+t.dataset.rid];
    const v = parseFloat(document.getElementById('np-menu').value);
    if(isNaN(v) || v <= 0){ alert('El precio tiene que ser mayor que cero.'); return; }
    if(v === r.precio){ alert('Es el mismo precio que ya tenia.'); return; }
    const motivo = prompt('Por que cambia el precio? (queda en la bitacora, podes dejarlo vacio)', '');
    if(motivo === null) return;
    t.disabled = true; t.textContent = '\u00b7\u00b7\u00b7';
    google.script.run
      .withSuccessHandler(function(res){
        if(!res || !res.ok){ t.disabled = false; t.textContent = '\u2713'; alert('No se guardo: ' + ((res && res.error) || 'sin respuesta')); return; }
        location.reload();
      })
      .withFailureHandler(function(e){ t.disabled = false; t.textContent = '\u2713'; alert('No se pudo guardar: ' + e.message); })
      .webCambiarPrecioMenu(AUTH, r.n, v, motivo, r.area);
    return;
  }

  if(t.classList.contains('qsave')){
    const fila = +t.dataset.f, r = R[+t.dataset.rid];
    const inp = dr.querySelector('.qin[data-f="' + fila + '"]');
    const v = parseFloat(inp && inp.value);
    // El servidor exige cantidad > 0. Se avisa aca con el mismo criterio, para que la
    // persona no mande algo que va a volver rechazado.
    if(isNaN(v) || v <= 0){
      alert(v === 0
        ? 'La cantidad tiene que ser mayor que cero. Para sacar el ingrediente hay que quitar la linea, no ponerla en 0.'
        : 'Escribi una cantidad valida.');
      return;
    }
    t.disabled = true; t.textContent = '\u00b7\u00b7\u00b7';
    google.script.run
      .withSuccessHandler(function(res){
        if(!res || !res.ok){
          t.disabled = false; t.textContent = '\u2713';
          alert('No se guardo: ' + ((res && res.error) || 'sin respuesta del servidor'));
          return;
        }
        location.reload();
      })
      .withFailureHandler(function(e){
        t.disabled = false; t.textContent = '\u2713';
        alert('No se pudo guardar: ' + e.message);
      })
      .webEditarCantidad(AUTH, r.n, fila, v, r.area);   // r.n es el nombre de la pestana
    return;
  }
  if(t.id === 'simreset'){ sim.clear(); memo.clear(); cerrar(); pintar(); return; }
  if(t.dataset.i != null && t.dataset.i !== ''){ abrirInsumo(+t.dataset.i); return; }
});
let td;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(td); td = setTimeout(() => { q = e.target.value.trim(); pintar(); }, 120);
});

const porArea = a => R.filter(r => r.area===a && r.t==='plato');
document.getElementById('foot').textContent =
  `Cocina: ${porArea('COCINA').length} fichas de plato, ${porArea('COCINA').filter(r=>cmvAhora(r)!=null).length} con CMV, meta 30%. ` +
  `Barra: ${porArea('BARRA').length} cócteles y bebidas, meta 20%. ` +
  `${R.length - porArea('COCINA').length - porArea('BARRA').length} pre-elaborados · ${I.length} productos · ${P.length} proveedores. ` +
  `Fuente: ${D.meta.fuente}, leído el ${D.meta.fecha}.`;
pintar();

/* Que puede hacer quien entro. Va ACA ADENTRO y no en arrancar(), porque pintar()
   es local a iniciarApp(): desde afuera no se la puede llamar.
   Eso fue justamente el bug de la tarjeta "Nueva receta": la grilla se dibuja al
   arrancar, con PUEDE todavia vacio, y sin volver a pintar la tarjeta no aparecia
   nunca. Editar cantidades si funcionaba, porque ese panel se dibuja al abrir una
   ficha, o sea despues de que llego la respuesta.

   Si esto falla o tarda, PUEDE queda vacio y la pagina se comporta como antes:
   solo lectura. Nada de lo que ya funcionaba depende de que responda.

   OJO: esto es para la INTERFAZ. El candado de verdad esta en el servidor y se
   vuelve a verificar en cada operacion. Esconder un boton no protege nada. */
window.PUEDE = {};
google.script.run
  .withSuccessHandler(function(r){
    if(r && r.ok && r.resultado){
      window.PUEDE = r.resultado.puede || {};
      // Donde puede ESCRIBIR esta persona. Lo lee AREA_EDITABLE. Si el servidor no
      // lo manda —una version vieja—, queda undefined y AREA_EDITABLE devuelve
      // false: la pantalla se va a solo lectura en vez de ofrecer lo que no puede.
      window.PUEDE.areas = r.resultado.areas;
      window.YO = r.resultado;
      pintar();                       // <- sin esto, la grilla se queda en solo lectura
    }
  })
  .withFailureHandler(function(){ /* silencio: se queda en solo lectura */ })
  .webEstadoEdicion(AUTH);
}
</script>

<script>
/* Adapta el modelo de CosteoDatos.gs a la forma compacta que usa la vista.
   Lo importante: area y cmvObjetivo viajan por receta, y cada linea lleva su sub-receta. */
function adaptar(m){
  return {
    meta:{fuente:'hojas nativas del recetario', fecha:m.meta.generado.slice(0,10), areas:m.meta.areas},
    proveedores:m.proveedores,
    insumos:m.insumos.map(function(i){
      return {id:i.id, p:i.producto, c:i.categoria, pr:i.precio, u:i.unidad, pc:i.precioCompra,
              uc:i.unidadCompra, cv:i.conversion, prov:i.proveedor, area:i.area, sub:i.sub, usos:i.usos};
    }),
    recetas:m.recetas.map(function(r){
      return {id:r.id, n:r.nombre, t:r.tipo, cat:r.categoria, area:r.area, obj:r.cmvObjetivo,
              precio:r.precio, costo:r.costo, costoUnit:r.costoUnit, unidadCosto:r.unidadCosto,
              cmv:r.cmv==null?null:Math.round(r.cmv*10)/10, merma:r.merma,
              rinde:r.rinde, rindeTexto:r.rindeTexto, nota:r.nota, sug:r.sugerido, est:r.estado, base:r.base,
              ing:r.ingredientes.map(function(g){
                return {i:g.insumo, r:g.receta, n:g.nombre, q:g.cantidad, u:g.unidad, t:g.total, f:g.fila};
              })};
    })
  };
}
function arrancar(m){
  window.__DATA__ = adaptar(m);
  document.getElementById('cargando').remove();
  iniciarApp();
}
function fallar(e){
  document.getElementById('cargando').innerHTML =
    '<p style="color:var(--alto)">No se pudo leer el recetario.</p><p style="font-size:13px">' +
    (e && e.message ? e.message : e) + '</p>';
}
/* LAS DOS LLAMADAS SALEN JUNTAS, no una despues de la otra.
   getCosteoData tarda lo suyo (es el recetario entero) y getProfitOS tambien, y
   hasta ahora la segunda no arrancaba hasta que la primera volvia: el usuario
   esperaba la SUMA. El tablero no necesita nada del recetario, asi que se pide en
   paralelo y lo que se espera es la mas lenta de las dos.

   El resultado se guarda y no se pinta: pintar() necesita __DATA__, que todavia
   puede no haber llegado. Cuando iniciarApp arranca, pedirProfitOS lo encuentra ya
   servido en el cache y no vuelve a pedirlo. */
window.__POS_CACHE__ = {};
window.__POSCARGANDO__ = 13;
google.script.run
  .withSuccessHandler(function(r){
    window.__POSCARGANDO__ = null;
    window.__POS_CACHE__[13] = r;
    if(window.__profitListo) window.__profitListo(13);
  })
  .withFailureHandler(function(e){
    window.__POSCARGANDO__ = null;
    var err = {ok:false, error:(e && e.message) || 'No se pudo leer'};
    window.__POS_CACHE__[13] = {tablero:err, menu:err};
    if(window.__profitListo) window.__profitListo(13);
  })
  .getProfitOS(AUTH, 13);

google.script.run.withSuccessHandler(arrancar).withFailureHandler(fallar).getCosteoData(AUTH);
</script>
