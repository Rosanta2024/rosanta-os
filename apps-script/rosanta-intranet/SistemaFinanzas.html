<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <?!= include('Estilos') ?>
  <?!= include('Logo') ?>
  <style>
    /* MODULOS EN EL LATERAL, HERRAMIENTAS ARRIBA (Juanma, 27-sep-2026, regla para toda la
       intranet; el lateral es el mismo .sm-side del Sistema de Marketing). La pagina sigue
       siendo una columna de alto fijo (.sf); lo que cambia es que debajo de las
       herramientas va una FILA: lateral + contenido. */
    .sf-tabs { padding-left: calc(208px + 0.5rem); }
    /* Rotulos de los dos grupos (Juanma, 28-sep-2026): el lateral es lo que se sigue
       CADA SEMANA y lleva a una accion; arriba va el analisis del AÑO. Los nombres
       "Modulos" y "Herramientas" no decian eso. */
    .sf-rotulo { align-self: center; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: #8a8377; padding: 0 0.8rem 0 0.4rem; white-space: nowrap; }
    .sf-cuerpo { flex: 1; min-height: 0; display: flex; }
    .sf-cuerpo .sf-main { flex: 1; min-width: 0; height: 100%; }
    @media (max-width: 700px) {
      .sf-tabs { padding-left: 0.5rem; }
      .sf-cuerpo { flex-direction: column; }
      .sf-cuerpo .sm-side { flex: none; }
      .sf-cuerpo .sf-main { height: auto; flex: 1; }
    }
  </style>
</head>
<body class="sf">
  <header class="app">
    <div class="marca">
      <span class="logo" role="img" aria-label="Rosanta"></span>
      <span class="sec">Finanzas &amp; Data</span>
    </div>
    <div class="quien">
      <span><?= usuario.nombre || usuario.email ?></span>
      <a class="volver" href="<?= urlBase ?><?= authToken ? '?u=' + authToken : '' ?>">← Panel principal</a>
    </div>
  </header>

  <!--
    Mismo patron que SistemaMarketing —cambiar de vista en el CLIENTE, montando
    un iframe por vista la primera vez que se abre y alternando cual esta
    visible, asi cada una conserva su scroll y sus filtros al ir y volver—
    (27-sep-2026, Juanma: los modulos en el lateral y las herramientas arriba, igual
    en toda la intranet). Del 22 al 27-sep todo estuvo arriba (decision de
    Juanma). El lateral tenia dos problemas, los dos en el telefono: escondia
    "Escenarios" y "Caja" fuera de pantalla, y dejaba el iframe sin altura. El
    detalle del arreglo esta en el bloque .sf-* de Estilos.html.

    Las seis viven en ESTE proyecto, o sea que siempre se dejan embeber: no hace
    falta el aviso de X-Frame-Options ni el temporizador de 6 s que Marketing
    necesita para la Consola y Reseñas, que son proyectos aparte.
  -->
  <nav class="sf-tabs" aria-label="Análisis del año">
    <span class="sf-rotulo">El año</span>
    <button type="button" class="sf-tab" data-sub="dre">DRE</button>
    <button type="button" class="sf-tab" data-sub="gasto">El gasto</button>
    <button type="button" class="sf-tab" data-sub="comparativo">Mes a mes</button>
    <button type="button" class="sf-tab" data-sub="escenarios">Escenarios</button>
  </nav>
  <div class="sf-cuerpo">
    <nav class="sm-side" aria-label="Seguimiento de cada semana">
      <span class="rotulo">Cada semana</span>
      <button type="button" class="sm-item" data-sub="semana">Pulso</button>
      <button type="button" class="sm-item" data-sub="reporte">Reporte semanal</button>
      <button type="button" class="sm-item" data-sub="caja">Caja</button>
      <button type="button" class="sm-item" data-sub="metas">Metas</button>
    </nav>
    <main class="sf-main" id="sfMain"></main>
  </div>

<script>
(function () {
  // Cada URL lleva el embed y el token. El &embed=1 es lo que esconde el boton
  // "Panel principal" de la vista de adentro: ahi adentro ese boton se saltaba la
  // barra de pestañas y sacaba al usuario de Finanzas de un clic.
  var T = <?!= JSON.stringify(authToken ? '&u=' + authToken : '') ?>;
  var B = <?!= JSON.stringify(urlBase) ?>;
  var URLS = {
    semana:      B + '?page=finanzas-semana&embed=1' + T,
    // el reporte semanal repartido (27-sep-2026): aca van venta, ritmo, P&L, equilibrio
    // y acciones; food cost y platos viven en Profit OS › Cocina / Barra y Sala
    reporte:     B + '?page=reporte-semanal&embed=1&secciones=1,2,3,7,8' + T,
    metas:       B + '?page=metas&embed=1' + T,
    caja:        B + '?page=caja&embed=1' + T,
    dre:         B + '?page=dre&embed=1' + T,
    gasto:       B + '?page=finanzas-gasto&embed=1' + T,
    comparativo: B + '?page=comparativo&embed=1' + T,
    escenarios:  B + '?page=escenarios&embed=1' + T
  };
  var main = document.getElementById('sfMain');
  var frames = {};

  function montar(sub) {
    if (frames[sub]) return frames[sub];
    var f = document.createElement('iframe');
    f.title = sub;
    f.style.display = 'none';
    f.src = URLS[sub];
    main.appendChild(f);
    frames[sub] = f;
    return f;
  }

  function mostrar(sub) {
    if (!URLS.hasOwnProperty(sub)) sub = 'semana';
    document.querySelectorAll('[data-sub]').forEach(function (b) {
      var act = b.dataset.sub === sub;
      b.classList.toggle('act', act);
      // En el telefono la barra se desliza: si la pestaña activa quedo fuera de
      // la parte visible, se trae. Es lo que el lateral viejo no hacia.
      if (act && b.scrollIntoView) {
        b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    });
    Object.keys(frames).forEach(function (k) { frames[k].style.display = 'none'; });
    montar(sub).style.display = 'block';
  }

  document.querySelectorAll('[data-sub]').forEach(function (b) {
    b.addEventListener('click', function () { mostrar(b.dataset.sub); });
  });

  mostrar(<?!= JSON.stringify(sub) ?>);
})();
</script>
</body>
</html>
