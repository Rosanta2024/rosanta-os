<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <?!= include('Estilos') ?>
  <?!= include('Logo') ?>
</head>
<body>
  <header class="app">
    <div class="marca">
      <span class="logo" role="img" aria-label="Rosanta"></span>
      <span class="sec">Finanzas &amp; Data</span>
    </div>
    <div class="quien">
      <span><?= usuario.nombre || usuario.email ?></span>
      <a class="volver" href="<?= urlBase ?><?= authToken ? '?u=' + authToken : '' ?>">← Panel principal</a>
    </div>
  </header>

  <!--
    Mismo patron que SistemaMarketing, y por la misma razon: el lateral cambia de
    vista en el CLIENTE, sin recargar. Navegar a ?page=X&sub=Y perdia el query
    string y terminaba cayendo en el Panel principal. Aca se monta un iframe por
    vista la primera vez que se abre y se alterna cual esta visible, asi cada una
    conserva su scroll y sus filtros al ir y volver.

    Las tres viven en ESTE proyecto, o sea que siempre se dejan embeber: no hace
    falta el aviso de X-Frame-Options ni el temporizador de 6 s que Marketing
    necesita para la Consola y Reseñas, que son proyectos aparte.
  -->
  <div class="sm">
    <nav class="sm-side">
      <span class="rotulo">Finanzas</span>
      <button type="button" class="sm-item" data-sub="semana">La semana</button>
      <button type="button" class="sm-item" data-sub="metas">Metas de la semana</button>
      <button type="button" class="sm-item" data-sub="comparativo">2026 contra 2025</button>
      <button type="button" class="sm-item" data-sub="escenarios">Escenarios</button>
    </nav>
    <main class="sm-main" id="sfMain"></main>
  </div>

<script>
(function () {
  // Cada URL lleva el embed y el token. El &embed=1 es lo que esconde el boton
  // "Panel principal" de la vista de adentro: ahi adentro ese boton se saltaba el
  // lateral y sacaba al usuario de Finanzas de un clic.
  var T = <?!= JSON.stringify(authToken ? '&u=' + authToken : '') ?>;
  var B = <?!= JSON.stringify(urlBase) ?>;
  var URLS = {
    semana:      B + '?page=finanzas-semana&embed=1' + T,
    metas:       B + '?page=metas&embed=1' + T,
    comparativo: B + '?page=comparativo&embed=1' + T,
    escenarios:  B + '?page=escenarios&embed=1' + T
  };
  var main = document.getElementById('sfMain');
  var frames = {};

  function montar(sub) {
    if (frames[sub]) return frames[sub];
    var f = document.createElement('iframe');
    f.title = sub;
    f.style.display = 'none';
    f.src = URLS[sub];
    main.appendChild(f);
    frames[sub] = f;
    return f;
  }

  function mostrar(sub) {
    if (!URLS.hasOwnProperty(sub)) sub = 'semana';
    document.querySelectorAll('.sm-item').forEach(function (b) {
      b.classList.toggle('act', b.dataset.sub === sub);
    });
    Object.keys(frames).forEach(function (k) { frames[k].style.display = 'none'; });
    montar(sub).style.display = 'block';
  }

  document.querySelectorAll('.sm-item').forEach(function (b) {
    b.addEventListener('click', function () { mostrar(b.dataset.sub); });
  });

  mostrar(<?!= JSON.stringify(sub) ?>);
})();
</script>
</body>
</html>
