<style>
  /* Compras en efectivo y con debito (14-oct-2026). Usa los estilos .pg de Pagos. */
  .ce-scroll { overflow-x: auto; }
  .ce-ok { color: #2E6B3F; }
  .ce-mal { color: #A33A2A; }
  .ce-prop { border-top: 1px solid rgba(26,26,26,0.08); padding-top: 0.6rem; margin-top: 0.6rem; }
  .ce-metodo { display: flex; gap: 0.4rem; width: 100%; }
  .ce-metodo button[aria-pressed="true"] { background: var(--vb); color: #fff; border-color: var(--vb); }
  .ce-foto { width: 100%; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
</style>
<script>
/* Compras en efectivo y con debito (14-oct-2026, ComprasEfectivo.js). Parcial crudo:
   PF_COMPRAS(host, AUTH). El token va PRIMERO en cada llamada.
   Tres cosas: pedir un retiro (lugar y cantidad), registrar cada compra (a mano o con la foto
   del recibo) y ver el cuadre: lo retirado contra lo registrado y los cargos de debito sin
   registro. Las compras quedan en el registro de Pagos. */
window.PF_COMPRAS = function (HOST, AUTH) {
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function q(n) { return (n < 0 ? '−' : '') + 'Q' + Math.abs(Number(n || 0)).toLocaleString('es-GT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function ddmm(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : ''; }
  var D = null, FORM = 'compra', METODO = 'efectivo', PRE = {}, LEIDO = null, OCUPADO = false;

  function cargar() {
    HOST.innerHTML = '<div class="pg-vacio">Leyendo los retiros, la tarjeta de débito y lo registrado…</div>';
    google.script.run.withSuccessHandler(function (r) { D = r; pintar(); })
      .withFailureHandler(function (e) { HOST.innerHTML = '<p class="pg-err">' + esc(e && e.message || e) + '</p>'; })
      .getComprasEfectivo(AUTH);
  }

  function pintar() {
    var R = D.resumen;
    var h = '<div class="pg"><p class="pg-intro">Toda compra pagada en <b>efectivo</b> o con la <b>tarjeta de débito</b> se registra acá, el mismo día: ' +
      'a mano o con la foto del recibo. Antes de ir al cajero, pedí el retiro con el lugar y la cantidad. ' +
      'El banco confirma solo cada retiro y cada cargo de la tarjeta.</p>' +
      '<div class="pg-res"><div><b>' + q(R.retirado) + '</b><span>retirado desde el ' + esc(ddmm(D.desde)) + '</span></div>' +
      '<div><b>' + q(R.registrado) + '</b><span>compras en efectivo registradas</span></div>' +
      '<div><b class="' + (R.por_justificar > 0.01 ? 'ce-mal' : 'ce-ok') + '">' + q(R.por_justificar) + '</b><span>efectivo por justificar</span></div>' +
      '<div><b class="' + (R.debito_sin_registro ? 'ce-mal' : 'ce-ok') + '">' + R.debito_sin_registro + '</b><span>cargos de débito sin registrar' + (R.debito_sin_registro ? ' (' + q(R.q_debito_sin_registro) + ')' : '') + '</span></div></div>' +
      '<div class="pg-tabs"><button type="button" class="pg-b' + (FORM === 'compra' ? ' pri' : '') + '" data-f="compra">Registrar compra</button>' +
      '<button type="button" class="pg-b' + (FORM === 'retiro' ? ' pri' : '') + '" data-f="retiro">Pedir retiro</button>' +
      '<span class="pg-sp"></span><button type="button" class="pg-b" data-acc="recargar">Actualizar</button></div>' +
      '<div id="ce-form">' + (FORM === 'retiro' ? formRetiro() : formCompra()) + '</div>' +
      tablaRetiros() + tablaDebito() + tablaRegistradas() +
      '<p class="pg-nota" style="margin-top:1rem">Actualizado ' + esc(D.gen) + '. Banco cargado hasta el ' + esc(ddmm(D.banco_ult)) + '. ' +
      'Lo de antes del ' + esc(ddmm(D.desde)) + ' quedó cerrado en el cuadre del 14-oct-2026.</p></div>';
    HOST.innerHTML = h;
    pintarLeido();
  }

  function campo(nombre, html) { return '<label>' + nombre + ' ' + html + '</label>'; }

  function formRetiro() {
    return '<section class="pg-prov"><h3>Pedir retiro</h3><div class="pg-mas">' +
      '<p class="pg-nota" style="width:100%">Anotalo antes de ir al cajero. Cuando llegue el banco, el retiro se casa solo con esta solicitud.</p>' +
      campo('Fecha', '<input type="date" data-v="fecha" value="' + esc(D.hoy) + '">') +
      campo('Cajero', '<input type="text" data-v="lugar" list="ce-lugares" placeholder="ej. ATM 095 Agencia Recolección" style="min-width:16rem">') +
      '<datalist id="ce-lugares">' + D.lugares.map(function (l) { return '<option value="' + esc(l) + '">'; }).join('') + '</datalist>' +
      campo('Cantidad', '<input type="number" step="0.01" min="0" data-v="monto">') +
      campo('Para qué', '<input type="text" data-v="nota" placeholder="ej. mercado del martes" style="min-width:12rem">') +
      '</div><div class="pg-formas" style="margin-top:0.6rem"><button type="button" data-guardar="retiro">Guardar solicitud</button></div><div class="pg-err" data-err></div></section>';
  }

  function formCompra() {
    var p = PRE, conF = !!p.llave;
    // con un proveedor de la lista elegido, solo sus facturas
    var pv = (D.proveedores || []).filter(function (x) { return x.nit && x.n === p.proveedor; })[0];
    var facts = pv ? D.facturas.filter(function (f) { return pv.nit.split('|').indexOf(f.nit) !== -1 || f.llave === p.llave; }) : D.facturas;
    var opFact = '<option value="">' + (pv ? 'Sin factura (' + facts.length + ' facturas abiertas de este proveedor)' : 'Sin factura') + '</option>' + facts.map(function (f) {
      return '<option value="' + esc(f.llave) + '"' + (f.llave === p.llave ? ' selected' : '') + '>' + esc(f.proveedor) + ' · ' + esc(f.dte) + ' · ' + esc(ddmm(f.fecha)) + ' · ' + q(f.saldo) + '</option>';
    }).join('');
    var areas = D.areas.length > 1 ? campo('Área', '<select data-v="area">' + D.areas.map(function (a) { return '<option' + (a === p.area ? ' selected' : '') + '>' + a + '</option>'; }).join('') + '</select>') : '';
    return '<section class="pg-prov"><h3>Registrar compra</h3><div class="pg-mas">' +
      '<div class="ce-metodo"><button type="button" class="pg-b" data-metodo="efectivo" aria-pressed="' + (METODO === 'efectivo') + '">Efectivo</button>' +
      '<button type="button" class="pg-b" data-metodo="debito" aria-pressed="' + (METODO === 'debito') + '">Tarjeta de débito</button></div>' +
      '<div class="ce-foto"><input type="file" id="ce-arch" accept="image/*" multiple> <button type="button" class="pg-b" data-acc="leer">Leer foto</button>' +
      '<span class="pg-nota">Foto del recibo, la factura, el voucher o la captura del chat. La intranet llena los datos; vos revisás.</span></div>' +
      campo('Fecha', '<input type="date" data-v="fecha" value="' + esc(p.fecha || D.hoy) + '">') +
      campo('Factura', '<select data-v="llave" style="max-width:22rem">' + opFact + '</select>') +
      campo('Proveedor', '<input type="text" data-v="prov" list="ce-provs" value="' + esc(p.proveedor || '') + '" placeholder="ej. Doña Mina"' + (conF ? ' disabled' : '') + '>') +
      '<datalist id="ce-provs">' + (D.proveedores || []).map(function (x) { return '<option value="' + esc(x.n) + '">'; }).join('') + '</datalist>' +
      campo('Qué se compró', '<input type="text" data-v="detalle" value="' + esc(p.detalle || '') + '" placeholder="ej. 10 lb tomate, 5 lb cebolla" style="min-width:16rem">') +
      campo('Monto', '<input type="number" step="0.01" min="0" data-v="monto" value="' + esc(p.monto || '') + '">') + areas +
      (p.archivo_url ? '<p class="pg-nota" style="width:100%">La foto ya quedó guardada y se adjunta a este registro.</p>' : '') +
      '<p class="pg-nota" style="width:100%">Si la compra tiene factura del FEL, elegila en <b>Factura</b>: así se paga esa factura y no queda doble. Si todavía no aparece, registrala sin factura.</p>' +
      '</div><div class="pg-formas" style="margin-top:0.6rem"><button type="button" data-guardar="compra">Guardar compra</button>' +
      (Object.keys(PRE).length ? '<button type="button" data-acc="limpiar" style="background:#8a8780">Limpiar</button>' : '') +
      '</div><div class="pg-err" data-err></div><div id="ce-leido"></div></section>';
  }

  function tablaRetiros() {
    var filas = D.retiros.slice().reverse().map(function (r) {
      var est = r.origen === 'solicitud' ? '<span class="pg-est pend">Falta cargar el banco</span>' :
        (r.solicitud ? '<span class="pg-est banco">En el banco</span>' : '<span class="pg-est mas">Sin solicitud</span>');
      return '<tr><td>' + esc(ddmm(r.fecha)) + '<div class="pg-nota">' + esc(r.lugar) + (r.por ? ' · ' + esc(r.por) : '') + '</div></td><td class="n">' + q(r.q) + '</td>' +
        '<td class="n ' + (r.ok ? 'ce-ok' : 'ce-mal') + '">' + q(r.justificado) + '</td><td>' + est + '</td></tr>';
    }).join('');
    var perdidas = D.solicitudes.filter(function (s) { return s.estado === 'No aparece en el banco'; });
    var mias = D.solicitudes.filter(function (s) { return s.estado === 'Falta cargar el banco' && (D.rol === 'dueno' || s.por === D.nombre); });
    return '<section class="pg-prov"><header><h3>Retiros de cajero</h3><span class="pg-nota">Lo justificado sale de las compras en efectivo, en orden.</span></header>' +
      (filas ? '<div class="ce-scroll"><table><tr><th>Fecha y cajero</th><th class="n">Retirado</th><th class="n">Justificado</th><th>Estado</th></tr>' + filas + '</table></div>'
             : '<p class="pg-nota">Todavía no hay retiros desde el ' + esc(ddmm(D.desde)) + '.</p>') +
      (perdidas.length ? '<p class="pg-err">' + perdidas.length + ' solicitud(es) que el banco no trae: ' + perdidas.map(function (s) { return ddmm(s.fecha) + ' ' + q(s.q); }).join(', ') + '. ¿Se cancelaron? Anulalas.</p>' : '') +
      (mias.concat(perdidas).length ? '<div class="pg-formas">' + mias.concat(perdidas).map(function (s) {
        return '<button type="button" data-anular-sol="' + esc(s.id) + '" style="background:#8a8780">Anular solicitud ' + esc(ddmm(s.fecha)) + ' ' + q(s.q) + '</button>'; }).join('') + '</div>' : '') +
      '</section>';
  }

  function tablaDebito() {
    if (!D.cargos_debito.length) return '';
    var filas = D.cargos_debito.slice().reverse().map(function (c, i) {
      return '<tr><td>' + esc(ddmm(c.fecha)) + '<div class="pg-nota">' + esc(c.glosa) + '</div></td><td class="n">' + q(c.q) + '</td><td>' +
        (c.casado ? '<span class="ce-ok">' + esc(c.casado) + '</span>' : '<button type="button" class="pg-b" data-deb="' + (D.cargos_debito.length - 1 - i) + '">Registrar</button>') + '</td></tr>';
    }).join('');
    return '<section class="pg-prov"><header><h3>Tarjeta de débito (del banco)</h3><span class="pg-nota">Cada cargo necesita su factura o su compra registrada.</span></header>' +
      '<div class="ce-scroll"><table><tr><th>Fecha y comercio</th><th class="n">Monto</th><th>Registro</th></tr>' + filas + '</table></div></section>';
  }

  function tablaRegistradas() {
    if (!D.registradas.length) return '<section class="pg-prov"><h3>Compras registradas</h3><p class="pg-nota">Todavía no hay compras registradas desde el ' + esc(ddmm(D.desde)) + '.</p></section>';
    var filas = D.registradas.map(function (m) {
      var url = /recibo: (\S+)/.exec(m.detalle), det = m.detalle.replace(/\s*·?\s*recibo: \S+/, '');
      var puede = D.rol === 'dueno' || m.por === D.nombre;
      return '<tr><td>' + esc(ddmm(m.fecha)) + '<div class="pg-nota">' + esc(m.metodo) + '</div></td><td>' + esc(m.proveedor) + (m.factura ? ' <span class="pg-nota">· factura ' + esc(m.factura) + '</span>' : '') +
        '<div class="pg-nota">' + esc(det) + (url ? ' · <a href="' + esc(url[1]) + '" target="_blank" rel="noopener">recibo</a>' : '') + ' · ' + esc(m.por) + '</div></td><td class="n">' + q(m.q) + '</td>' +
        '<td>' + (puede ? '<button type="button" class="pg-b" data-anular="' + esc(m.id) + '">Anular</button>' : '') + '</td></tr>';
    }).join('');
    return '<section class="pg-prov"><h3>Compras registradas</h3><div class="ce-scroll"><table><tr><th>Fecha</th><th>Proveedor y qué</th><th class="n">Monto</th><th></th></tr>' + filas + '</table></div></section>';
  }

  /* ---- la foto ---- */
  function aBase64(file) {
    return new Promise(function (ok, mal) {
      var fr = new FileReader();
      fr.onerror = function () { mal(new Error('No pude leer ' + file.name)); };
      // las fotos del telefono pesan varios MB: se achican a 1600 px en JPEG antes de subir
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          ok({ nombre: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', datos: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
        };
        img.onerror = function () { mal(new Error('No pude abrir la imagen ' + file.name)); };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function leerFoto(b) {
    var files = [].slice.call((HOST.querySelector('#ce-arch') || {}).files || []), err = HOST.querySelector('#ce-form [data-err]');
    if (!files.length) { err.textContent = 'Elegí una foto o captura.'; return; }
    err.textContent = ''; b.disabled = true; b.textContent = 'Leyendo… (puede tardar un minuto)';
    Promise.all(files.map(aBase64)).then(function (arch) {
      google.script.run
        .withSuccessHandler(function (r) {
          LEIDO = r;
          if (r.compras.length === 1) { usarLeida(0); return; }
          b.disabled = false; b.textContent = 'Leer foto'; pintarLeido();
        })
        .withFailureHandler(function (e) { b.disabled = false; b.textContent = 'Leer foto'; err.textContent = e && e.message || e; })
        .leerComprobanteCompra(AUTH, arch);
    }, function (e) { b.disabled = false; b.textContent = 'Leer foto'; err.textContent = e.message; });
  }
  function pintarLeido() {
    var el = HOST.querySelector('#ce-leido');
    if (!el || !LEIDO) return;
    if (!LEIDO.compras.length) { el.innerHTML = '<p class="pg-err">No encontré compras en la foto. Registrala a mano.</p>'; return; }
    el.innerHTML = '<div class="ce-prop"><p class="pg-nota">Encontré ' + LEIDO.compras.length + ' compras. Elegí una para llenar el registro; después volvés por la siguiente.</p>' +
      LEIDO.compras.map(function (c, i) {
        return '<div style="margin:0.3rem 0"><button type="button" class="pg-b" data-usar="' + i + '">Usar</button> ' + esc(c.fecha ? ddmm(c.fecha) + ' · ' : '') +
          esc(c.proveedor || 'sin proveedor') + ' · ' + q(c.total) + ' · ' + esc(c.detalle) + (c.factura_txt ? ' · <b>factura ' + esc(c.factura_txt) + '</b>' : '') +
          (c.nota ? ' <span class="pg-nota">(' + esc(c.nota) + ')</span>' : '') + '</div>';
      }).join('') + '</div>';
  }
  function usarLeida(i) {
    var c = LEIDO.compras[i];
    PRE = { fecha: c.fecha || D.hoy, proveedor: c.proveedor, detalle: c.detalle, monto: c.total || '', llave: c.llave || '', archivo_url: LEIDO.archivo_url };
    if (c.metodo === 'efectivo' || c.metodo === 'debito') METODO = c.metodo;
    LEIDO.compras.splice(i, 1);
    if (!LEIDO.compras.length) LEIDO = null;
    FORM = 'compra'; pintar();
  }

  /* ---- guardar ---- */
  function val(sec, k) { var el = sec.querySelector('[data-v="' + k + '"]'); return el ? el.value : ''; }
  function guardar(b) {
    if (OCUPADO) return;
    var sec = b.closest('section'), err = sec.querySelector('[data-err]');
    err.textContent = '';
    var listo = function (r) { OCUPADO = false; D = r; pintar(); };
    var falla = function (e) { OCUPADO = false; b.disabled = false; b.textContent = 'Guardar'; err.textContent = e && e.message || e; };
    if (b.getAttribute('data-guardar') === 'retiro') {
      OCUPADO = true; b.disabled = true; b.textContent = 'Guardando…';
      google.script.run.withSuccessHandler(function (r) { FORM = 'compra'; listo(r); }).withFailureHandler(falla)
        .solicitarRetiro(AUTH, val(sec, 'fecha'), val(sec, 'lugar'), val(sec, 'monto'), val(sec, 'nota'));
      return;
    }
    var c = { fecha: val(sec, 'fecha'), metodo: METODO, llave: val(sec, 'llave'), proveedor: val(sec, 'prov'), detalle: val(sec, 'detalle'),
              monto: val(sec, 'monto'), area: val(sec, 'area') || D.areas[0], archivo_url: PRE.archivo_url || '' };
    var files = [].slice.call((sec.querySelector('#ce-arch') || {}).files || []);
    OCUPADO = true; b.disabled = true; b.textContent = 'Guardando…';
    var mandar = function () {
      google.script.run.withSuccessHandler(function (r) { PRE = {}; listo(r); }).withFailureHandler(falla).registrarCompraEfectivo(AUTH, c);
    };
    // una foto elegida y no leida tambien queda como respaldo
    if (!c.archivo_url && files.length) aBase64(files[0]).then(function (a) { c.archivo = a; mandar(); }, falla);
    else mandar();
  }

  HOST.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b || !HOST.contains(b) || OCUPADO) return;
    if (b.hasAttribute('data-f')) { FORM = b.getAttribute('data-f'); pintar(); return; }
    if (b.hasAttribute('data-metodo')) { METODO = b.getAttribute('data-metodo'); guardarBorrador(); pintar(); return; }
    if (b.hasAttribute('data-guardar')) { guardar(b); return; }
    if (b.hasAttribute('data-usar')) { usarLeida(Number(b.getAttribute('data-usar'))); return; }
    if (b.hasAttribute('data-deb')) {
      var c = D.cargos_debito[Number(b.getAttribute('data-deb'))];
      PRE = { fecha: c.fecha, proveedor: c.glosa, monto: c.q }; METODO = 'debito'; FORM = 'compra'; pintar();
      HOST.querySelector('#ce-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if (b.hasAttribute('data-anular') || b.hasAttribute('data-anular-sol')) {
      var sol = b.hasAttribute('data-anular-sol'), id = b.getAttribute(sol ? 'data-anular-sol' : 'data-anular');
      if (!confirm(sol ? '¿Anular esta solicitud de retiro?' : '¿Anular esta compra? Queda marcada como anulada en Pagos.')) return;
      OCUPADO = true; b.disabled = true;
      var run = google.script.run.withSuccessHandler(function (r) { OCUPADO = false; D = r; pintar(); })
        .withFailureHandler(function (e) { OCUPADO = false; b.disabled = false; alert(e && e.message || e); });
      if (sol) run.anularSolicitudRetiro(AUTH, id); else run.anularCompraEfectivo(AUTH, id);
      return;
    }
    var acc = b.getAttribute('data-acc');
    if (acc === 'recargar') cargar();
    if (acc === 'leer') leerFoto(b);
    if (acc === 'limpiar') { PRE = {}; LEIDO = null; pintar(); }
  });
  // lo escrito no se pierde al cambiar entre efectivo y debito
  function guardarBorrador() {
    var sec = HOST.querySelector('#ce-form section');
    if (!sec || FORM !== 'compra') return;
    PRE = Object.assign({}, PRE, { fecha: val(sec, 'fecha'), llave: val(sec, 'llave'), proveedor: val(sec, 'prov'), detalle: val(sec, 'detalle'), monto: val(sec, 'monto'), area: val(sec, 'area') });
  }
  // elegir una factura llena el proveedor y el saldo; elegir un proveedor filtra sus facturas
  HOST.addEventListener('change', function (ev) {
    if (ev.target.getAttribute('data-v') === 'prov') { guardarBorrador(); pintar(); return; }
    if (ev.target.getAttribute('data-v') !== 'llave') return;
    guardarBorrador();
    var f = D.facturas.filter(function (x) { return x.llave === PRE.llave; })[0];
    if (f) { PRE.proveedor = f.proveedor; PRE.monto = f.saldo; }
    pintar();
  });
  cargar();
};
</script>
