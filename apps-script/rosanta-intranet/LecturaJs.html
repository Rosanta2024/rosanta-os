<script>
/* Lectura de un pilar (27-sep-2026, Sistema de Medicion). Pinta el molde del reporte
   semanal: 1 pregunta y numero · 2 ruta · 3 que lo mueve · 4 con que no contamos ·
   5 que hacemos esta semana. NO llama al servidor: la pagina que lo usa trae los datos
   (getTableroPilar o getLecturaPilar) y, si deja escribir acciones, pasa las funciones
   en opts.guardar(pilar, accion, dueno, fecha, listo) y opts.marcar(fila, estado, texto, listo). */
window.LECTURA = (function () {
  var COL = { verde: '#2E6B3F', amarillo: '#C89A3C', rojo: '#A33A2A', gris: '#8a8780' };
  function esc(x) { return String(x === null || x === undefined ? '' : x).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pill(z, t) { return '<span class="lx-pill ' + esc(z || 'gris') + '">' + esc(t || ({ verde: 'en meta', amarillo: 'cerca', rojo: 'fuera', gris: 'sin dato' })[z || 'gris']) + '</span>'; }
  function fmt(v, u) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    if (u === 'Q') return 'Q' + Math.round(v).toLocaleString('es-GT');
    if (u === '%') return (Math.round(v * 10) / 10) + '%';
    return String(Math.round(v * 10) / 10);
  }
  function grafico(S) {
    var P = (S.puntos || []).filter(function (p) { return p.v !== null && p.v !== undefined && !isNaN(p.v); });
    if (P.length < 2) return '<p class="lx-como">Todavía no hay semanas suficientes para dibujar la ruta.</p>';
    var W = 640, H = 200, L = 58, R = 16, T = 18, B = 30;
    var vals = P.map(function (p) { return p.v; }); if (S.meta !== null && S.meta !== undefined) vals.push(S.meta);
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), pad = (mx - mn) * 0.15 || Math.abs(mx) * 0.1 || 1;
    mn -= pad; mx += pad; if (mn < 0 && Math.min.apply(null, vals) >= 0) mn = 0;
    var x = function (i) { return L + i * (W - L - R) / (P.length - 1); }, y = function (v) { return T + (mx - v) / (mx - mn) * (H - T - B); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(S.titulo) + '">';
    [0, 0.5, 1].forEach(function (f) { var v = mn + (mx - mn) * f; s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="rgba(26,26,26,0.08)"/>' +
      '<text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#8a8780" font-family="Lato,Arial">' + fmt(v, S.unidad) + '</text>'; });
    if (S.meta !== null && S.meta !== undefined) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(S.meta) + '" y2="' + y(S.meta) + '" stroke="#A33A2A" stroke-width="1.5" stroke-dasharray="6 4"/>' +
           '<text x="' + (W - R) + '" y="' + (y(S.meta) - 6) + '" text-anchor="end" font-size="11" fill="#A33A2A" font-family="Lato,Arial" font-weight="700">meta ' + fmt(S.meta, S.unidad) + '</text>';
    }
    var d = P.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
    s += '<path d="' + d + ' L' + x(P.length - 1) + ' ' + (H - B) + ' L' + L + ' ' + (H - B) + ' Z" fill="#4E6D5A" fill-opacity="0.08"/>';
    s += '<path d="' + d + '" fill="none" stroke="#4E6D5A" stroke-width="2.2"/>';
    P.forEach(function (p, i) {
      var bien = S.meta === null || S.meta === undefined ? true : (S.sentido === 'menor' ? p.v <= S.meta : p.v >= S.meta);
      s += '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="' + (i === P.length - 1 ? 5 : 3.2) + '" fill="' + (bien ? '#2E6B3F' : '#A33A2A') + '"/>' +
           '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" fill="#8a8780" font-family="Lato,Arial">' + esc(p.et) + '</text>';
    });
    var u = P[P.length - 1];
    s += '<text x="' + x(P.length - 1) + '" y="' + (y(u.v) - 10) + '" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a" font-family="Lato,Arial">' + fmt(u.v, S.unidad) + '</text>';
    return s + '</svg>';
  }
  /* el viernes que viene (o el de la semana siguiente si hoy ya es viernes o fin de semana) */
  function hoyIso() {
    var d = new Date(), dia = d.getDay(), suma = (5 - dia + 7) % 7 || 7;
    d.setDate(d.getDate() + suma);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function acciones(el, L, opts) {
    var A = L.acciones || [];
    var h = A.length ? '<ul class="lx-acc">' + A.map(function (a, i) {
      return '<li class="' + esc(a.estado) + '"><span><span class="t">' + esc(a.accion) + '</span><span class="o"> · ' + esc(a.dueno) + ' · ' +
        (a.atrasada ? '<b class="at">atrasada, ' + esc(a.fecha) + '</b>' : esc(a.fecha)) + (a.estado === 'sugerida' ? ' · <b style="color:#5b56a6">' + (a.escrito_por === 'Reporte semanal' ? 'propuesta del reporte semanal' : 'sugerida por el vigía') + '</b>' : (a.estado !== 'pendiente' ? ' · ' + esc(a.estado) : '')) + '</span></span>' +
        '<span>' + (L.puede_escribir && opts.marcar ? (a.estado === 'sugerida'
          ? '<button type="button" data-i="' + i + '" data-e="pendiente">Aprobar</button><button type="button" data-i="' + i + '" data-e="descartada">Descartar</button>'
          : a.estado === 'pendiente'
          ? '<button type="button" data-i="' + i + '" data-e="hecha">Hecha</button><button type="button" data-i="' + i + '" data-e="descartada">Descartar</button>'
          : '<button type="button" data-i="' + i + '" data-e="pendiente">Reabrir</button>') : '') + '</span></li>';
    }).join('') + '</ul>' : '<p class="lx-como">No hay acciones anotadas para esta semana.' + (L.puede_escribir ? ' Se anotan en la reunión del lunes: máximo 5, cada una con dueño y fecha.' : ' Se anotan en la reunión del lunes.') + '</p>';
    if (L.puede_escribir && opts.guardar) {
      var id = 'lx-' + L.pilar;
      h += '<div class="lx-form"><input type="text" id="' + id + '-t" placeholder="Acción concreta (una conducta, no un deseo)">' +
        '<select id="' + id + '-d">' + (L.equipo || []).map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('') + '</select>' +
        '<input type="date" id="' + id + '-f" value="' + hoyIso() + '">' +
        '<button type="button" class="p" id="' + id + '-b">Anotar</button></div><div class="lx-err" id="' + id + '-e"></div>';
    }
    el.innerHTML = h;
    el.querySelectorAll('button[data-i]').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = A[Number(b.getAttribute('data-i'))]; b.disabled = true;
        opts.marcar(a.fila, b.getAttribute('data-e'), a.accion, function (nuevas, err) {
          if (err) { b.disabled = false; alert(err); return; } L.acciones = nuevas; acciones(el, L, opts); });
      });
    });
    var bt = document.getElementById('lx-' + L.pilar + '-b');
    if (bt) bt.addEventListener('click', function () {
      var t = document.getElementById('lx-' + L.pilar + '-t').value, d = document.getElementById('lx-' + L.pilar + '-d').value,
          f = document.getElementById('lx-' + L.pilar + '-f').value, e = document.getElementById('lx-' + L.pilar + '-e');
      bt.disabled = true; e.textContent = '';
      opts.guardar(L.pilar, t, d, f, function (nuevas, err) {
        bt.disabled = false; if (err) { e.textContent = err; return; } L.acciones = nuevas; acciones(el, L, opts); });
    });
  }
  function pintar(el, L, opts) {
    opts = opts || {};
    if (!L) { el.innerHTML = ''; return; }
    var h = '<div class="lx">';
    h += '<section class="lx-sec"><h2><span class="n">1</span>La pregunta</h2><p class="lx-q">' + esc(L.pregunta) + '</p><p class="lx-r">' + esc(L.respuesta) + '</p>' +
      '<div class="lx-nums"><div class="lx-num"><b style="color:' + (COL[L.numero.zona] || '#1a1a1a') + '">' + esc(L.numero.valor) + '</b><span>' + esc(L.numero.etiqueta) + '</span><span class="m">' + esc(L.numero.meta) + ' ' + pill(L.numero.zona) + '</span></div>' +
      (L.extras || []).map(function (x) { return '<div class="lx-num chico"><b style="color:' + (COL[x.zona] || '#1a1a1a') + '">' + esc(x.valor) + '</b><span>' + esc(x.etiqueta) + '</span></div>'; }).join('') +
      '</div><div class="lx-dueno">Dueño del número: ' + esc(L.dueno) + '</div></section>';
    if (L.serie) h += '<section class="lx-sec lx-chart"><h2><span class="n">2</span>' + esc(L.serie.titulo) + '</h2>' + grafico(L.serie) + '</section>';
    h += '<section class="lx-sec"><h2><span class="n">' + (L.serie ? 3 : 2) + '</span>Qué lo mueve</h2><div class="lx-scroll"><table class="lx-tabla"><tr><th>Palanca</th><th>Dueño</th><th>Hoy</th><th>Meta</th><th></th></tr>' +
      (L.palancas || []).map(function (p) { return '<tr><td>' + esc(p.nombre) + (p.nota ? '<span class="nota">' + esc(p.nota) + '</span>' : '') + '</td><td>' + esc(p.dueno) + '</td><td class="n">' + esc(p.hoy) + '</td><td class="n">' + esc(p.meta) + '</td><td>' + pill(p.zona) + '</td></tr>'; }).join('') +
      '</table></div></section>';
    h += '<section class="lx-sec"><h2><span class="n">' + (L.serie ? 4 : 3) + '</span>Con qué no contamos</h2>' +
      ((L.faltantes || []).length ? '<ul class="lx-falta">' + L.faltantes.map(function (f) { return '<li><i style="background:' + (COL[f.zona] || '#8a8780') + '"></i><span>' + esc(f.texto) + '</span></li>'; }).join('') + '</ul>'
        : '<p class="lx-ok">Los datos de este pilar están completos.</p>') + '</section>';
    h += '<section class="lx-sec"><h2><span class="n">' + (L.serie ? 5 : 4) + '</span>Qué hacemos esta semana</h2><div id="lx-acc-' + esc(L.pilar) + '"></div></section>';
    h += '<details class="lx-como"><summary>Cómo se calcula</summary><p>' + esc(L.como || '') + '</p>' + (opts.detalle || '') + '</details>';
    h += '</div>';
    el.innerHTML = h;
    acciones(document.getElementById('lx-acc-' + L.pilar), L, opts);
  }
  return { pintar: pintar };
})();
</script>
