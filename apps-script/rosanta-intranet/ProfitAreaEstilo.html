<style>
  /* Pestañas de area de Profit OS (27-sep-2026): Cocina y Barra y Sala. Estilo de Sala

  .pf-area { --verde-bosque: #4E6D5A; --blanco: #fff; --negro: #1a1a1a; --lila: #AEAAE2; color: #1a1a1a; }
