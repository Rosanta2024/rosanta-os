<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Pruebas · Rosanta Intranet</title>
  <?!= paletaCss_() ?>
  <style>
    :root{
      --verde:var(--rosanta-verde); --tierra:var(--texto-suave); --crema:var(--fondo);
      --cobre:var(--rosanta-verde-medio); --marron:var(--texto);
 --falla:var(--mal); --aviso:var(--alerta-relleno); --saltada:var(--texto-suave);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--crema);color:var(--marron);
         font:15px/1.55 var(--rosanta-font-body);margin:0 auto;padding:1.5rem 1.25rem 4rem}
    header{display:flex;align-items:baseline;justify-content:space-between;
           gap:1rem;flex-wrap:wrap;border-bottom:2px solid var(--verde);padding-bottom:.75rem}
    h1{font-size:1.4rem;margin:0;color:var(--verde);font-weight:normal;letter-spacing:.01em}
    .sub{font-size:.82rem;color:var(--tierra)}
    button{font:inherit;font-size:.9rem;background:var(--verde);color:var(--crema);
           border:0;border-radius:3px;padding:.5rem 1.1rem;cursor:pointer}
    button:hover{background:var(--rosanta-verde)}
    button[disabled]{background:var(--saltada);cursor:default}

    .resumen{margin:1.25rem 0;padding:1rem 1.15rem;border-radius:4px;
             border-left:5px solid var(--saltada);background:var(--superficie)}
    .resumen.sana{border-left-color:var(--ok)}
    .resumen.mal{border-left-color:var(--falla)}
    .resumen h2{margin:0 0 .3rem;font-size:1.15rem;font-weight:normal}
    .resumen.sana h2{color:var(--ok)}
    .resumen.mal h2{color:var(--falla)}
    .conteo{font-size:.85rem;color:var(--tierra)}

    .grupo{margin-top:1.6rem}
    .grupo h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;
              color:var(--tierra);margin:0 0 .5rem;font-weight:normal; font-family:var(--rosanta-font-label)}
    .fila{display:flex;gap:.75rem;align-items:baseline;padding:.5rem .75rem;
          border-bottom:1px solid var(--linea);background:var(--superficie)}
    .fila:first-of-type{border-radius:4px 4px 0 0}
    .fila:last-of-type{border-bottom:0;border-radius:0 0 4px 4px}
    .marca{flex:0 0 4.6rem;font:600 .7rem/1.5 ui-monospace,Menlo,monospace;
           letter-spacing:.06em;text-align:center;border-radius:2px;padding:.1rem 0;color:var(--rosanta-blanco)}
    .OK .marca{background:var(--ok)}
    .FALLA .marca{background:var(--falla)}
    .AVISO .marca{background:var(--aviso)}
    .SALTADA .marca{background:var(--saltada)}
    .cuerpo{flex:1 1 auto;min-width:0}
    .nombre{font-size:.94rem}
    .FALLA .nombre{font-weight:bold;color:var(--falla)}
    .cifra{font:.8rem/1.5 ui-monospace,Menlo,monospace;color:var(--tierra)}
    .FALLA .cifra{color:var(--falla)}
    .detalle{font-size:.8rem;color:var(--saltada);margin-top:.15rem;
             word-break:break-word;overflow-wrap:anywhere}
    .vacio{padding:2.5rem 0;text-align:center;color:var(--tierra)}
    .nota{margin-top:2.5rem;font-size:.8rem;color:var(--saltada);
          border-top:1px solid var(--linea);padding-top:.9rem}
  </style>
</head>
<body data-auth="<?= authToken ?>" data-grupos="<?= grupos ?>" data-carriles="<?= carriles ?>">
  <div class="wrap">
    <header>
      <div>
        <h1>Pruebas de la intranet</h1>
        <div class="sub">Ninguna de estas pruebas escribe nada. Solo leen y comparan.</div>
      </div>
      <button id="correr">Correr de nuevo</button>
    </header>

    <div id="salida"><p class="vacio">Corriendo las pruebas…</p></div>

    <p class="nota">Los numeros que se esperan viven en <code>PRUEBAS_CFG</code>, arriba de
    <code>Pruebas.gs</code>. Se cambian a proposito cuando hay una decision tomada,
    nunca para que algo deje de salir en rojo.</p>
  </div>

<script>
  var AUTH = document.body.dataset.auth || '';
  // 14-oct-2026: &grupos=... corre solo esos grupos (PARCIAL). Sin eso, la bateria completa en
  // carriles que corren a la vez (PRUEBAS_CARRILES_ en Pruebas.js), cada uno con sus 6 minutos.
  var GRUPOS = (document.body.dataset.grupos || '').trim();
  var CARRILES = Number(document.body.dataset.carriles || 0);
  var boton = document.getElementById('correr');
  var salida = document.getElementById('salida');

  function esc(t){
    return String(t == null ? '' : t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function pintar(res){
    boton.disabled = false;
    boton.textContent = 'Correr de nuevo';

    // Una parcial NO dice "Intranet sana": no sirve para publicar (14-oct-2026).
    var titulo = res.parcial
      ? 'CORRIDA PARCIAL · ' + res.parcial + (res.fallas ? ' · ' + res.fallas + (res.fallas === 1 ? ' falla' : ' fallas') : ' · sin fallas')
      : (res.sana ? 'Intranet sana' : 'Hay ' + res.fallas + (res.fallas === 1 ? ' falla' : ' fallas'));
    var h = '<div class="resumen ' + (res.sana && !res.parcial ? 'sana' : 'mal') + '">' +
      '<h2>' + esc(titulo) + '</h2>' +
      '<div class="conteo">' + res.ok + ' OK · ' + res.fallas + ' fallas · ' +
      res.avisos + ' avisos · ' + res.saltadas + ' saltadas · ' +
      (res.ms/1000).toFixed(1) + ' s' + (res.carriles ? ' · ' + res.carriles : '') + '</div>' +
      (res.parcial ? '<div class="conteo">Sirve mientras se trabaja. Antes de publicar, la batería completa (sin &amp;grupos=).</div>' : '') +
      '</div>';

    // LO QUE HAY QUE MIRAR, ARRIBA (11-oct-2026). Con 180 filas, las fallas quedaban
    // perdidas entre los OK y habia que bajar toda la pagina para encontrarlas.
    var atencion = [];
    res.grupos.forEach(function(g){
      g.pruebas.forEach(function(p){
        if (p.estado === 'FALLA' || p.estado === 'AVISO') atencion.push({g: g.nombre, p: p});
      });
    });
    var grupos = res.grupos.slice();
    if (atencion.length) {
      grupos.unshift({nombre: 'Para mirar primero · ' + atencion.length,
        pruebas: atencion.sort(function(a, b){ return (a.p.estado === 'FALLA' ? 0 : 1) - (b.p.estado === 'FALLA' ? 0 : 1); })
          .map(function(x){
            // corto: el detalle completo sigue abajo, en su grupo
            var d = String(x.p.detalle || '');
            return Object.assign({}, x.p, {nombre: x.g.replace(/^\d+\.\s*/, '') + ' › ' + x.p.nombre,
                                           detalle: d.length > 110 ? d.slice(0, 110) + '…' : d});
          })});
    }

    grupos.forEach(function(g){
      h += '<div class="grupo"><h3>' + esc(g.nombre) + (g.ms ? ' · ' + Math.round(g.ms / 1000) + ' s' : '') + '</h3>';
      g.pruebas.forEach(function(p){
        var cifra = '';
        // Ojo: google.script.run convierte los null en undefined al serializar,
        // asi que la comparacion va con != y no con !==. Con !== se pintaba
        // "esperado" seguido de nada en toda fila que no compara numeros.
        if (p.esperado != null && p.leido !== p.esperado) {
          cifra = 'leido ' + esc(p.leido) + ', esperado ' + esc(p.esperado);
        } else if (p.leido != null) {
          cifra = esc(p.leido);
        }
        h += '<div class="fila ' + p.estado + '">' +
             '<span class="marca">' + p.estado + '</span>' +
             '<span class="cuerpo"><span class="nombre">' + esc(p.nombre) + '</span>' +
             (cifra ? ' <span class="cifra">' + cifra + '</span>' : '') +
             (p.detalle ? '<div class="detalle">' + esc(p.detalle) + '</div>' : '') +
             '</span></div>';
      });
      h += '</div>';
    });
    salida.innerHTML = h;
  }

  function fallar(err){
    boton.disabled = false;
    boton.textContent = 'Reintentar';
    salida.innerHTML = '<div class="resumen mal"><h2>No se pudieron correr</h2>' +
      '<div class="conteo">' + esc(err && err.message ? err.message : err) + '</div></div>';
  }

  /* Junta los carriles en un solo resultado, con los grupos en el orden de siempre. */
  function unir(partes, ms){
    var orden = (partes[0] && partes[0].orden) || [];
    var res = { grupos: [], ok: 0, fallas: 0, avisos: 0, saltadas: 0, ms: ms,
                carriles: partes.length + ' carriles a la vez (' + partes.map(function(p){ return Math.round(p.ms/1000) + ' s'; }).join(' · ') + ')' };
    partes.forEach(function(p){
      res.grupos = res.grupos.concat(p.grupos);
      ['ok','fallas','avisos','saltadas'].forEach(function(k){ res[k] += p[k] || 0; });
    });
    res.grupos.sort(function(a, b){ return orden.indexOf(a.clave) - orden.indexOf(b.clave); });
    res.sana = res.fallas === 0;
    return res;
  }

  function correr(){
    boton.disabled = true;
    boton.textContent = 'Corriendo…';
    var inicio = Date.now();
    if (GRUPOS || !CARRILES) {
      salida.innerHTML = '<p class="vacio">Corriendo ' + (GRUPOS ? 'solo: ' + esc(GRUPOS) : 'la batería') + '…</p>';
      google.script.run.withSuccessHandler(pintar).withFailureHandler(fallar)
        .correrPruebasWeb(AUTH, GRUPOS ? { grupos: GRUPOS } : null);
      return;
    }
    var partes = [], faltan = CARRILES, error = null;
    salida.innerHTML = '<p class="vacio">Corriendo la batería completa en ' + CARRILES + ' carriles a la vez… 0 de ' + CARRILES + ' listos.</p>';
    function listo(){
      faltan--;
      if (faltan > 0) {
        salida.innerHTML = '<p class="vacio">Corriendo la batería completa en ' + CARRILES + ' carriles a la vez… ' + (CARRILES - faltan) + ' de ' + CARRILES + ' listos.</p>';
        return;
      }
      // Si un carril no termino, la bateria NO esta completa: se dice, no se pinta a medias.
      if (error) { fallar(error); return; }
      pintar(unir(partes, Date.now() - inicio));
    }
    for (var i = 0; i < CARRILES; i++) {
      (function(n){
        google.script.run
          .withSuccessHandler(function(r){ partes[n] = r; listo(); })
          .withFailureHandler(function(e){ error = error || ('El carril ' + (n + 1) + ' no terminó: ' + (e && e.message ? e.message : e)); listo(); })
          .correrPruebasWeb(AUTH, { carril: n });
      })(i);
    }
  }

  boton.addEventListener('click', correr);
  correr();
</script>
</body>
</html>
