<style>
  /* Pagos a proveedores (p213, 29-sep-2026). Herramienta de Profit OS. Parcial crudo. */

  .pg-intro { font-size: 0.9rem; color: #52514e; line-height: 1.5; max-width: 52rem; }

  .pg-tabs button, .pg-b { font: inherit; font-size: 0.82rem; border: 1px solid rgba(78,109,90,0.35); background: #fff; color: var(--vb);
    border-radius: 999px; padding: 0.35rem 0.9rem; cursor: pointer; }
  .pg-tabs button[aria-pressed="true"] { background: var(--vb); color: #fff; border-color: var(--vb); }

  .pg-res b { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .pg-res span { font-size: 0.74rem; color: #52514e; }
  .pg-prov { background: #fff; border-radius: 18px; padding: 0.9rem 1.1rem; box-shadow: 0 2px 10px rgba(26,26,26,0.06); margin-top: 0.9rem; }
  .pg-prov header { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; align-items: baseline; justify-content: space-between; }
  .pg-prov header h3 { margin: 0; font-size: 1.05rem; }
  .pg-area { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8780; }
  .pg-prov table { width: 100%; border-collapse: collapse; font-size: 0.86rem; margin-top: 0.4rem; }
  .pg-prov td, .pg-prov th { padding: 0.45rem 0.3rem; border-bottom: 1px solid rgba(26,26,26,0.08); text-align: left; vertical-align: middle; }
  .pg-prov th, .pg-t th { font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8780; font-weight: 600; }
  .pg .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pg-est { display: inline-block; font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.15rem 0.5rem; border-radius: 999px; background: #F2EEEB; color: #52514e; white-space: nowrap; }
  .pg-est.pend { background: #FBF3E2; color: #8a6420; }
  .pg-est.abon { background: #ECEBFA; color: #4b4790; }
  .pg-est.banco { background: #E7EFEA; color: #3d5a48; }
  .pg-est.ok { background: #E3F0E7; color: #2E6B3F; }
  .pg-est.mas { background: #F6E4DF; color: #A33A2A; }
  .pg-panel { background: #F7F5F2; border-radius: 12px; padding: 0.7rem 0.8rem; margin: 0.3rem 0 0.4rem; }
  .pg-formas { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.3rem 0; }
  .pg-formas button { font: inherit; font-size: 0.86rem; background: var(--vb); color: #fff; border: 0; border-radius: 10px; padding: 0.55rem 0.9rem; cursor: pointer; }
  .pg-formas button:disabled { opacity: 0.5; }
  .pg-mas { font-size: 0.8rem; margin-top: 0.4rem; display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; align-items: center; }
  .pg input[type=text], .pg input[type=number], .pg input[type=date], .pg select { font: inherit; font-size: 0.85rem; padding: 0.3rem 0.45rem; border: 1px solid rgba(26,26,26,0.2); border-radius: 8px; background: #fff; }

  .pg-barra { position: sticky; bottom: 0.6rem; z-index: 5; background: #1a1a1a; color: #fff; border-radius: 14px; padding: 0.7rem 0.9rem; margin-top: 1rem; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
  .pg-barra .pg-formas button { background: #fff; color: #1a1a1a; }

  .pg-t td, .pg-t th { padding: 0.5rem 0.45rem; border-bottom: 1px solid rgba(26,26,26,0.08); text-align: left; }
  .pg-scroll { overflow-x: auto; margin-top: 0.9rem; border-radius: 18px; box-shadow: 0 2px 10px rgba(26,26,26,0.06); }
  .pg-x { font: inherit; font-size: 0.72rem; background: none; border: 0; color: #A33A2A; cursor: pointer; text-decoration: underline; padding: 0; }
  .pg-grupo { font-family: 'Playfair Display', Georgia, serif; font-size: 1.1rem; margin: 1.4rem 0 0; padding-bottom: 0.3rem; border-bottom: 2px solid var(--vb); display: flex; justify-content: space-between; }
  .pg-grupo span { font-family: inherit; font-size: 0.9rem; }
  .pg-vacio { padding: 2rem 0; text-align: center; color: #52514e; }
  /* Una factura por linea, con las columnas del Excel. En el telefono se acomoda en dos
     renglones: DTE y cantidad arriba, estatus y el boton abajo. */
  .pg-l { display: grid; grid-template-columns: 1.6rem 1fr 5.5rem 6.5rem 8.5rem 8.5rem 4.8rem; gap: 0.2rem 0.5rem; align-items: center;
    padding: 0.45rem 0.1rem; border-bottom: 1px solid rgba(26,26,26,0.08); font-size: 0.86rem; }
  .pg-l.cab { font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8780; font-weight: 600; padding-top: 0.2rem; }
  .pg-l .m { display: none; font-size: 0.74rem; color: #8a8780; }
  .pg-lp { grid-column: 1 / -1; }
  @media (max-width: 640px) {
    .pg-hide-m, .pg-l .d { display: none; }
    .pg-l { grid-template-columns: 1.6rem 1fr auto; grid-template-areas: "c dte cant" "c est acc"; }
    .pg-l.cab { display: none; }
    .pg-l .c { grid-area: c; } .pg-l .dte { grid-area: dte; } .pg-l .cant { grid-area: cant; } .pg-l .est { grid-area: est; } .pg-l .acc { grid-area: acc; text-align: right; }
    .pg-l .m { display: block; }
    .pg-prov { padding: 0.8rem 0.7rem; }
  }
</style>
<script>
/* Pagos a proveedores (p213, 29-sep-2026). Reemplaza a COMPRAS_2026 desde el 5-oct-2026.
   Parcial crudo: PF_PAGOS(host, AUTH). El token va PRIMERO en cada llamada al servidor.
   Mismas columnas que el Excel: AREA · PROVEEDOR · DTE · FECHA DE PAGAR · FECHA PAGADO ·
   CANTIDAD A PAGAR · ESTATUS DE PAGO. */
/* MODO (13-oct-2026, Juanma: "los chicos no entenderán"): sin modo es Pagos, solo lo del dia a dia.
   'admin:equipo' | 'admin:banco' | 'admin:balance' | 'admin:iva' son las pestañas del grupo
   Administración de la barra lateral: una sola pestaña cada una, sin fila de pestañas. */
window.PF_PAGOS = function (HOST, AUTH, MODO) {
  var ADMIN = /^admin:/.test(MODO || '') ? MODO.slice(6) : null, AGR = null, IVAAGR = null;
  function esc(x) { return String(x === null || x === undefined ? '' : x).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function q(n) { return 'Q' + Number(n || 0).toLocaleString('es-GT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function ddmm(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : ''; }
  function hoy() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  var D = null, D0 = null, TAB = ADMIN || 'pagar', ABIERTA = null, SEL = {}, OCUPADO = false, BAL = null;
  /* EL BUSCADOR de arriba (13-oct-2026): D0 es lo que mando el servidor y D lo que se ve,
     filtrado por proveedor, DTE, razon social o detalle. Todo lo de la pantalla lee D. */
  function sinAcento(x) { return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  function filtrar(d) {
    var b = sinAcento(window.PF_BUSCA || '').trim();
    if (!d || !b) return d;
    var ok = function () { return sinAcento([].slice.call(arguments).join(' ')).indexOf(b) !== -1; };
    var f = Object.assign({}, d);
    f.facturas = (d.facturas || []).filter(function (x) { return ok(x.proveedor, x.razon, x.dte, x.nit); });
    f.cuadre = (d.cuadre || []).filter(function (x) { return ok(x.proveedor, x.nit); });
    f.mercado = (d.mercado || []).filter(function (x) { return ok(x.proveedor, x.detalle, x.dte); });
    f.para_iva = (d.para_iva || []).filter(function (x) { return ok(x.proveedor, x.dte, x.marco); });
    f.posibles = (d.posibles || []).filter(function (x) { return ok(x.pago.glosa, x.pago.banco) || x.opciones.some(function (o) { return o.facturas.some(function (y) { return ok(y.proveedor, y.dte); }); }); });
    f.banco_dudosos = (d.banco_dudosos || []).filter(function (x) { return ok(x.glosa, x.banco); });
    f.banco_sueltos = (d.banco_sueltos || []).filter(function (x) { return ok(x.glosa, x.banco); });
    f.por_devolver = (d.por_devolver || []).map(function (x) { return Object.assign({}, x, { movs: x.movs.filter(function (m) { return ok(m.proveedor, m.dte, m.detalle); }) }); });
    f.filtro = window.PF_BUSCA;
    return f;
  }
  function chipFiltro() {
    return D.filtro ? '<p class="pg-nota" style="background:#ECEBFA;border-radius:10px;padding:0.4rem 0.7rem">Mostrando solo lo que coincide con «<b>' + esc(D.filtro) + '</b>». ' +
      '<button type="button" class="pg-x" data-quitarfiltro="1" style="color:#4b4790">quitar filtro</button></p>' : '';
  }
  window.addEventListener('pf-buscar', function () { if (D0) { D = filtrar(D0); pintar(); } });
  var CLASE = { 'Pendiente': 'pend', 'Abonada': 'abon', 'Banco por confirmar': 'banco', 'Pagada': 'ok', 'Pagada de más': 'mas' };
  function estado(e) { return '<span class="pg-est ' + (CLASE[e] || '') + '">' + esc(e === 'Banco por confirmar' ? 'Por confirmar con el banco' : e) + '</span>'; }

  function cargar() {
    HOST.innerHTML = '<div class="pg-vacio">Leyendo las facturas del FEL y los pagos…</div>';
    google.script.run.withSuccessHandler(function (r) { D0 = r; D = filtrar(r); pintar(); })
      .withFailureHandler(function (e) { HOST.innerHTML = '<p class="pg-err">' + esc(e && e.message || e) + '</p>'; })
      .getPagosProveedores(AUTH);
  }
  /* "marcada Banco BI el 06/10, falta que el banco la confirme" */
  function marcaTxt(f) {
    var mk = (f.pagos || []).filter(function (p) { return p.estatus === 'Banco'; }).pop();
    var med = mk && /^\[([^\]]+)\]/.exec(mk.detalle || '');
    return (f.saldo > 0.01 ? q(f.por_confirmar) + ' ' : '') + 'pagada por ' + nom(med ? med[1] : 'Banco') + (mk && mk.fecha ? ' el ' + ddmm(mk.fecha) : '') + ', falta que el banco la registre';
  }
  /* "Banco" se ve como "Transferencia" (Juanma, 13-oct-2026). Por dentro sigue siendo "Banco":
     asi quedan bien los pagos ya guardados y las llaves de los pagos confirmados. */
  function nom(x) { return String(x || '').replace(/^Banco confirmado$/, 'Transferencia confirmada').replace(/^Banco(?= |$)/, 'Transferencia'); }
  function porProveedor(lista) {
    var g = {}, orden = [];
    lista.forEach(function (f) { if (!g[f.nit]) { g[f.nit] = []; orden.push(f.nit); } g[f.nit].push(f); });
    return orden.map(function (n) { return g[n]; });
  }
  function favorDe(nit) { var c = (D.cuadre || []).filter(function (x) { return x.nit === nit; })[0]; return c ? c.favor : 0; }

  function pintar() {
    // Por pagar: lo que falta, y lo marcado "Banco" que el banco todavia no confirma (13-oct-2026)
    var abiertas = D.facturas.filter(function (f) { return f.saldo > 0.01 || f.estado === 'Banco por confirmar'; });
    var pendQ = abiertas.reduce(function (a, f) { return a + f.saldo; }, 0);
    var vence = abiertas.filter(function (f) { return f.fecha_pagar && f.fecha_pagar <= hoy(); }).length;
    if (ADMIN) return pintarAdmin();
    var h = '<div class="pg">' +
      '<h2>Pagos a proveedores</h2><p class="pg-intro">Las facturas llegan solas del FEL con la carga de los lunes. Cuando pagues, tocá <b>Pagar</b> y elegí cómo. ' +
      'Lo que no trae factura se anota en <b>+ Compra de mercado</b>. Entran las facturas desde el ' + esc(ddmm(D.desde)) + ': las de antes del 28/09 que COMPRAS_2026 da por pagadas ya cuentan como pagadas. ' +
      'Las pagadas por <b>Transferencia</b> se confirman solas cuando el banco registra el pago (se carga el estado de cuenta)' + (D.banco_ult ? ' (hoy llega hasta el ' + esc(ddmm(D.banco_ult)) + ')' : '') + '.</p>' +
      '<div class="pg-res"><div><b>' + abiertas.length + '</b><span>facturas por pagar</span></div><div><b>' + q(pendQ) + '</b><span>cantidad a pagar</span></div>' +
      '<div><b>' + vence + '</b><span>con fecha de pagar hasta hoy</span></div><div><b>' + esc(D.areas.filter(function (a) { return a !== 'ADMIN'; }).join(' y ').toLowerCase()) + (D.rol === 'dueno' ? ' y admin' : '') + '</b><span>áreas</span></div></div>' +
      '<div class="pg-tabs">' +
      ['pagar:Por pagar', 'pagadas:Pagadas', 'cuadre:Cuadre por proveedor', 'mercado:Sin factura']
        // Posibles pagos (13-oct-2026): cargos del banco o de la tarjeta con el monto de una factura. Solo el dueño.
        .concat(D.posibles && D.posibles.length ? ['posibles:Posibles pagos (' + D.posibles.length + ')'] : []).map(function (t) {
        var k = t.split(':'); return '<button type="button" data-tab="' + k[0] + '" aria-pressed="' + (TAB === k[0]) + '">' + k[1] + '</button>';
      }).join('') + '<span class="pg-sp"></span>' + (D.rol === 'dueno' ? '<button type="button" class="pg-b" data-acc="anterior">+ Factura anterior</button> ' : '') + '<button type="button" class="pg-b pri" data-acc="mercado">+ Compra de mercado</button> <button type="button" class="pg-b" data-acc="recargar">Actualizar</button></div>' +
      chipFiltro() + '<div id="pg-merc"></div><div id="pg-cuerpo">' + cuerpo(abiertas) + '</div><div id="pg-sel"></div>' +
      (D.aviso_correo ? '<p class="pg-err">' + esc(D.aviso_correo) + '</p>' : '') +
      '<p class="pg-nota" style="margin-top:1rem">Actualizado ' + esc(D.gen) + '. Las facturas <b>por correo</b> son las que SAT avisó y todavía no entran al FEL del lunes.</p></div>';
    HOST.innerHTML = h;
    pintarSeleccion();
  }

  /* Administración: una pestaña de la barra lateral, con el mismo cuerpo de siempre. */
  function pintarAdmin() {
    var T = { equipo: ['Por devolver', 'Lo que cada quien pagó de su bolsa y Rosanta le devuelve. Es de todos: cada quien agrega lo suyo y todos ven lo de todos.'],
              banco: ['Banco sin casar', 'Pagos del banco que no se casaron solos con una factura.'],
              balance: ['Balance del año', 'Lo facturado contra lo pagado, por proveedor.'],
              iva: ['Para reducir IVA', 'Facturas a nombre de CORSAGA que solo sirven para el crédito fiscal. Es de todos: cada quien marca las suyas y todos ven quién marcó cada una.'] }[ADMIN] || ['Administración', ''];
    HOST.innerHTML = '<div class="pg"><h2>' + T[0] + '</h2><p class="pg-intro">' + T[1] + '</p>' +
      '<div class="pg-tabs"><span class="pg-sp"></span><button type="button" class="pg-b" data-acc="recargar">Actualizar</button></div>' +
      chipFiltro() + '<div id="pg-merc"></div><div id="pg-cuerpo">' + cuerpo([]) + '</div><div id="pg-sel"></div>' +
      '<p class="pg-nota" style="margin-top:1rem">Actualizado ' + esc(D.gen) + '.</p></div>';
  }


  function cuerpo(abiertas) {
    if (TAB === 'pagar') {
      if (!abiertas.length) return '<div class="pg-vacio">No hay facturas por pagar. ✓</div>';
      var grupoAnt = '';
      return porProveedor(abiertas).map(function (g) {
        var cab = '';
        if (g[0].grupo !== grupoAnt) {
          grupoAnt = g[0].grupo;
          var totG = abiertas.filter(function (f) { return f.grupo === grupoAnt; }).reduce(function (a, f) { return a + f.saldo; }, 0);
          cab = '<h3 class="pg-grupo">' + esc(grupoAnt) + '<span>' + q(totG) + '</span></h3>';
        }
        return cab + (function () {
        var f0 = g[0], tot = g.reduce(function (a, f) { return a + f.saldo; }, 0), fav = favorDe(f0.nit);
        return '<section class="pg-prov"><header><div><span class="pg-area">' + esc(f0.grupo) + '</span><h3>' + esc(f0.proveedor) + '</h3></div>' +
          '<div class="n"><b>' + q(tot) + '</b>' + (fav > 0.01 ? ' · <span class="pg-est ok">' + q(fav) + ' a favor</span>' : '') + '</div></header>' +
          '<div class="pg-l cab"><span></span><span>DTE</span><span>Fecha</span><span>Fecha de pagar</span><span class="n">Cantidad a pagar</span><span>Estatus de pago</span><span></span></div>' +
          g.map(function (f) {
            var fila = '<div class="pg-l"><span class="c"><input type="checkbox" data-sel="' + esc(f.llave) + '"' + (SEL[f.llave] ? ' checked' : '') + ' aria-label="Elegir"></span>' +
              '<span class="dte">' + esc(f.dte) + (f.anterior ? ' <span class="pg-est abon" title="Traída de COMPRAS_2026">anterior</span>' : '') + (f.por_correo ? ' <span class="pg-est abon" title="Avisada por SAT al correo. Entra al FEL del maestro con la carga del lunes.">por correo</span>' : '') + '<span class="m">' + esc(ddmm(f.fecha)) + (f.fecha_pagar ? ' · pagar ' + esc(ddmm(f.fecha_pagar)) : '') + '</span></span>' +
              '<span class="d">' + esc(ddmm(f.fecha)) + '</span><span class="d">' + esc(ddmm(f.fecha_pagar)) + '</span>' +
              '<span class="n cant">' + q(f.saldo > 0.01 ? f.saldo : f.por_confirmar) + (f.saldo > 0.01 && f.pagado > 0.01 ? '<span class="pg-nota" style="display:block">de ' + q(f.total) + ' · abonado ' + q(f.pagado) + '</span>' : '') +
                '</span>' +
              '<span class="est">' + estado(f.estado) + '</span>' +
              // ya marcada y sin saldo: no se paga de nuevo, se VE la marca (y se puede anular)
              '<span class="acc"><button type="button" class="pg-b" data-abrir="' + esc(f.llave) + '">' + (ABIERTA === f.llave ? 'Cerrar' : f.saldo > 0.01 ? 'Pagar' : 'Ver') + '</button></span>' +
              // el aviso de la marca en su propio renglon (antes se montaba sobre el boton)
              (f.por_confirmar > 0.01 ? '<span class="pg-lp pg-nota" style="text-align:right">' + esc(marcaTxt(f)) + '</span>' : '') + '</div>';
            if (ABIERTA === f.llave) fila += '<div class="pg-lp">' + (f.saldo > 0.01 ? panelPago([f]) : panelMarcada(f)) + '</div>';
            return fila;
          }).join('') + '</section>';
        })();
      }).join('');
    }
    if (TAB === 'pagadas') {
      // "Traida de antes" / "Pagado antes" no son pagos: es como entro la factura desde
      // COMPRAS_2026. No se listan aca ni se pueden anular (anularla sacaba la factura de
      // la lista: paso con Doorways el 29-sep-2026).
      var esPago = function (p) { return !/antes/i.test(p.estatus); };
      var pag = D.facturas.filter(function (f) { return f.pagos.some(esPago); }).slice().reverse();
      if (!pag.length) return '<div class="pg-vacio">Todavía no hay pagos anotados.</div>';
      return '<div class="pg-scroll"><table class="pg-t"><tr><th>Área</th><th>Proveedor</th><th>DTE</th><th>Fecha pagado</th><th class="n">Cantidad pagada</th><th>Estatus de pago</th><th></th></tr>' +
        pag.map(function (f) {
          return f.pagos.filter(esPago).map(function (p) {
            return '<tr><td>' + esc(f.grupo) + '</td><td>' + esc(f.proveedor) + '</td><td>' + esc(f.dte) + '</td><td>' + esc(ddmm(p.fecha)) + '</td>' +
              '<td class="n">' + q(p.q) + '</td><td>' + esc(nom(p.estatus)) + (/confirmad/i.test(p.estatus) && p.por ? ' · <b>' + esc(nom(p.por)) + '</b>' : '') +
                (p.fecha_marca && p.fecha_marca !== p.fecha ? '<div class="pg-nota">pagado el ' + esc(ddmm(p.fecha_marca)) + ' · el banco lo registró el ' + esc(ddmm(p.fecha)) + '</div>' : '') +
                (p.estatus === 'Banco' ? ' ' + estado(f.estado) : '') + (p.detalle ? '<div class="pg-nota">' + esc(p.detalle) + '</div>' : '') + '</td>' +
              '<td>' + (p.id ? '<button type="button" class="pg-x" data-anular="' + esc(p.id) + '">anular</button>' : '') + '</td></tr>';
          }).join('');
        }).join('') + '</table></div>';
    }
    if (TAB === 'cuadre') {
      if (!D.cuadre.length) return '<div class="pg-vacio">Sin facturas todavía.</div>';
      return '<div class="pg-scroll"><table class="pg-t"><tr><th>Proveedor</th><th>Área</th><th class="n">Facturas</th><th class="n">Facturado</th><th class="n">Pagado</th><th class="n">Pendiente</th>' +
        '<th class="n">Banco por confirmar</th><th class="n">Abonadas</th><th class="n">A favor</th><th class="n">Pagado de más</th><th></th></tr>' +

    if (IVAAGR.prov) h += '<div style="width:100%">' + L.filter(function (f) { return f.proveedor === IVAAGR.prov; }).map(function (f) {
        return '<label style="display:block;padding:0.2rem 0"><input type="radio" name="ivaf" data-ivallave="' + esc(f.llave) + '"> DTE ' + esc(f.dte) + ' · ' + esc(ddmm(f.fecha)) + ' · ' + q(f.total) + '</label>';
      }).join('') + '</div><label>Nota <input type="text" data-f="inota" placeholder="ej. compra personal a nombre de CORSAGA"></label>';
    if (!provs.length) h += '<span class="pg-nota">No hay facturas por pagar sin pagos en tu área.</span>';
    return h + '<button type="button" class="pg-b pri" data-ivamarcar="1">Marcar para reducir IVA</button> <button type="button" class="pg-b" data-ivacerrar="1">Cancelar</button></div><div class="pg-err" data-err></div></div>';
  }
  function repintarCuerpo() { var c = HOST.querySelector('#pg-cuerpo'); if (c) c.innerHTML = cuerpo([]); }

  function pintarSeleccion() {
    var box = HOST.querySelector('#pg-sel'); if (!box) return;
    var ks = Object.keys(SEL).filter(function (k) { return SEL[k]; });
    var fs = D.facturas.filter(function (f) { return ks.indexOf(f.llave) !== -1 && f.saldo > 0.01; });
    if (TAB !== 'pagar' || fs.length < 2) { box.innerHTML = ''; return; }
    var nits = {}; fs.forEach(function (f) { nits[f.nit] = 1; });
    box.innerHTML = '<div class="pg-barra">' + (Object.keys(nits).length > 1
      ? 'Elegiste facturas de ' + Object.keys(nits).length + ' proveedores. Un pago junta facturas de un solo proveedor.'
      : panelPago(fs)) + '</div>';
  }

  /* hacer(r) recibe el google.script.run ya armado y llama a la funcion por su nombre
     literal, con AUTH primero: la bateria revisa cada llamada y su guarda. */
  function llamar(hacer, panel) {
    if (OCUPADO) return;
    OCUPADO = true;
    var err = panel && panel.querySelector('[data-err]');
    if (panel) panel.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    if (err) err.textContent = 'Guardando…';
    hacer(google.script.run.withSuccessHandler(function (d) { OCUPADO = false; D0 = d; D = filtrar(d); ABIERTA = null; SEL = {}; AGR = null; IVAAGR = null; pintar(); })
      .withFailureHandler(function (e) {
        OCUPADO = false;
        if (panel) panel.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
        if (err) err.textContent = String(e && e.message || e); else alert(String(e && e.message || e));
      }));
  }
  function valor(panel, k) { var el = panel.querySelector('[data-f="' + k + '"]'); return el ? el.value : ''; }

  function formMercado() {
    var box = HOST.querySelector('#pg-merc');
    if (box.innerHTML) { box.innerHTML = ''; return; }
    var areas = D.areas.filter(function (a) { return a !== 'ADMIN'; });
    box.innerHTML = '<section class="pg-prov" data-panel="mercado"><h3>Compra de mercado sin factura</h3>' +
      '<p class="pg-nota">Si se pagó con un retiro de cajero, elegí <b>Retiro de cajero</b>: cuando entre el banco, Compras en efectivo la ofrece como detalle de ese retiro.</p>' +
      '<div class="pg-mas"><label>Fecha <input type="date" data-f="fecha" value="' + hoy() + '"></label>' +
      '<label>Proveedor <input type="text" data-f="prov" list="pg-provs" placeholder="elegí o escribí"></label>' +
      '<datalist id="pg-provs">' + (D.proveedores_mercado || []).map(function (p) { return '<option value="' + esc(p) + '">'; }).join('') + '</datalist>' +
      '<label>Qué se compró <input type="text" data-f="det" placeholder="ej. limones, menta, hielo" style="min-width:14rem"></label>' +
      '<label>Cantidad <input type="number" step="0.01" min="0" data-f="monto"></label>' +
      (areas.length > 1 ? '<label>Área <select data-f="area">' + areas.map(function (a) { return '<option>' + a + '</option>'; }).join('') + '</select></label>' : '') +
      '</div><div class="pg-nota" style="margin-top:0.5rem">¿Cómo se pagó?</div><div class="pg-formas">' +
      D.formas_mercado.map(function (x) { return '<button type="button" data-merc="' + esc(x) + '">' + esc(x) + '</button>'; }).join('') + '</div><div class="pg-err" data-err></div></section>';
  }

  /* Una factura de antes del arranque que sigue sin pagar (solo el dueño). */
  function formAnterior() {
    var box = HOST.querySelector('#pg-merc');
    if (box.innerHTML) { box.innerHTML = ''; return; }
    box.innerHTML = '<section class="pg-prov" data-panel="anterior"><h3>Traer una factura anterior</h3>' +
      '<p class="pg-nota">Para una factura de antes del ' + esc(ddmm(D.desde)) + ' que sigue sin pagar. Si ya se abonó una parte, escribí solo lo que falta.</p>' +
      '<div class="pg-mas"><label>DTE <input type="text" data-f="dte" placeholder="número de la factura"></label>' +
      '<label>Falta pagar <input type="number" step="0.01" min="0" data-f="saldo" placeholder="vacío = toda"></label>' +
      '<label>NIT <input type="text" data-f="nit" placeholder="solo si se repite el número"></label>' +
      '<label>Nota <input type="text" data-f="det" placeholder="ej. venía de la semana 19"></label>' +
      '<button type="button" class="pg-b pri" data-traer="1">Traer</button></div><div class="pg-err" data-err></div></section>';
  }

  HOST.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b || !D) return;
    var panel = b.closest('[data-panel]');
    if (b.dataset.quitarfiltro) { var qi = document.getElementById('q'); if (qi) { qi.value = ''; qi.dispatchEvent(new Event('input')); } else { window.PF_BUSCA = ''; D = filtrar(D0); pintar(); } return; }
    if (b.dataset.tab) { TAB = b.dataset.tab; ABIERTA = null; pintar(); return; }
    if (b.dataset.agregar) {
      AGR = { nombre: b.dataset.agregar }; repintarCuerpo();
      google.script.run.withSuccessHandler(function (l) { if (AGR) { AGR.lista = l; repintarCuerpo(); } })
        .withFailureHandler(function (e) { if (AGR) { AGR.lista = []; AGR.error = String(e && e.message || e); repintarCuerpo(); } })
        .getFacturasParaDevolver(AUTH);
      return;
    }
    if (b.dataset.agrcerrar) { AGR = null; repintarCuerpo(); return; }
    if (b.dataset.confpos) {
      var ij = b.dataset.confpos.split(':'), PX = D.posibles[+ij[0]], OX = PX && PX.opciones[+ij[1]];
      if (!OX) return;
      if (!confirm('¿El cargo de ' + q(PX.pago.q) + ' del ' + ddmm(PX.pago.fecha) + ' (' + nom(PX.pago.banco) + ') es ' + (OX.abono ? 'un abono a ' : OX.fraccionado ? 'el pago (en ' + PX.pagos.length + ' cargos) de ' : 'el pago de ') + OX.facturas.map(function (f) { return f.proveedor + ' ' + f.dte; }).join(', ') + '?')) return;
      var pl = PX.pago.llave, ks2 = OX.llaves;
      llamar(function (r) { r.confirmarPosiblePago(AUTH, pl, ks2); }, panel);
      return;
    }
    if (b.dataset.ivaagr) { IVAAGR = {}; repintarCuerpo(); return; }
    if (b.dataset.ivacerrar) { IVAAGR = null; repintarCuerpo(); return; }
    if (b.dataset.ivamarcar && panel) {
      var rI = panel.querySelector('[data-ivallave]:checked');
      if (!rI) { panel.querySelector('[data-err]').textContent = 'Elegí la factura.'; return; }
      var kI = rI.dataset.ivallave, nI = valor(panel, 'inota');
      if (!confirm('¿Esta factura es ajena a la operación y solo sirve para reducir el IVA?\n\nSale de Pagos y del DRE. Se puede devolver desde esta misma lista.')) return;
      llamar(function (r) { r.marcarFacturaParaIva(AUTH, kI, nI); }, panel);
      return;
    }
    if (b.dataset.agrfact && panel) {
      var aks = []; panel.querySelectorAll('[data-allave]').forEach(function (c) { if (c.checked) aks.push(c.dataset.allave); });
      if (!aks.length) { panel.querySelector('[data-err]').textContent = 'Elegí la factura.'; return; }
      var an = b.dataset.agrfact, am = valor(panel, 'amonto'), af = valor(panel, 'afecha') || hoy(), ano = valor(panel, 'anota');
      llamar(function (r) { r.agregarFacturaDeSuBolsa(AUTH, an, aks, af, am === '' ? null : Number(am), ano); }, panel);
      return;
    }
    if (b.dataset.agrmerc && panel) {
      var mn = b.dataset.agrmerc, mf2 = valor(panel, 'mfecha') || hoy(), mp2 = valor(panel, 'mprov'), md2 = valor(panel, 'mdet'), mq2 = Number(valor(panel, 'mmonto'));
      llamar(function (r) { r.agregarCompraDeSuBolsa(AUTH, mn, mf2, mp2, md2, mq2); }, panel);
      return;
    }
    if (b.dataset.acc === 'recargar') { BAL = null; cargar(); return; }
    if (b.dataset.acc === 'balrecalc') {
      BAL = null; HOST.querySelector('#pg-cuerpo').innerHTML = '<div class="pg-vacio">Recalculando…</div>';
      google.script.run.withSuccessHandler(function (r) { BAL = r; pintar(); })
        .withFailureHandler(function (e) { BAL = { error: String(e && e.message || e) }; pintar(); })
        .getBalanceProveedores(AUTH, true);
      return;
    }
    if (b.dataset.acc === 'mercado') { formMercado(); return; }
    if (b.dataset.acc === 'anterior') { formAnterior(); return; }
    if (b.dataset.traer && panel) {
      var dte = valor(panel, 'dte'), sal = valor(panel, 'saldo'), nitA = valor(panel, 'nit'), detA = valor(panel, 'det');
      llamar(function (r) { r.traerFacturaAnterior(AUTH, dte, sal === '' ? null : Number(sal), nitA, detA); }, panel); return;
    }
    if (b.dataset.abrir) { ABIERTA = ABIERTA === b.dataset.abrir ? null : b.dataset.abrir; pintar(); return; }
    if (b.dataset.forma && panel) {
      var ks = panel.dataset.panel.split(','), m = valor(panel, 'monto');
      var forma = b.dataset.forma, fecha = valor(panel, 'fecha') || hoy(), favor = Number(valor(panel, 'favor')) || 0, nota = valor(panel, 'nota'), medio = valor(panel, 'medio');
      // Banco pide la cuenta y Tarjeta la tarjeta: con eso el banco confirma el pago solo
      if (forma === 'Banco' && (D.medios_banco || []).indexOf(medio) === -1) { panel.querySelector('[data-err]').textContent = 'Elegí de qué cuenta salió la transferencia (' + (D.medios_banco || []).map(nom).join(' o ') + ').'; return; }
      if (forma === 'Tarjeta' && (D.medios_tarjeta || []).indexOf(medio) === -1) { panel.querySelector('[data-err]').textContent = 'Elegí con qué tarjeta se pagó.'; return; }
      if (forma !== 'Banco' && forma !== 'Tarjeta') medio = '';
      llamar(function (r) { r.registrarPagoFacturas(AUTH, ks, forma, fecha, m === '' ? null : Number(m), favor, nota, medio); }, panel);
      return;
    }
    if (b.dataset.programar && panel) {
      if (!valor(panel, 'fpagar')) { panel.querySelector('[data-err]').textContent = 'Elegí la fecha de pagar.'; return; }
      var llave = b.dataset.programar, fp = valor(panel, 'fpagar');
      llamar(function (r) { r.programarPagoFactura(AUTH, llave, fp); }, panel); return;
    }
    if (b.dataset.merc && panel) {
      var mf = valor(panel, 'fecha'), mp = valor(panel, 'prov'), md = valor(panel, 'det'), mq = Number(valor(panel, 'monto')),
          ma = valor(panel, 'area') || D.areas[0], mforma = b.dataset.merc;
      llamar(function (r) { r.registrarCompraMercado(AUTH, mf, mp, md, mq, ma, mforma); }, panel);
      return;
    }
    if (b.dataset.iva && panel) {
      if (!confirm('¿La factura ' + b.dataset.iva.split('|')[1] + ' es ajena al giro y solo sirve para reducir el IVA?\n\nSale de Pagos y del DRE, y en el maestro pasa a FACTURA_AJENA. Se puede devolver desde la pestaña Para reducir IVA.')) return;
      var kIva = b.dataset.iva, nIva = valor(panel, 'nota');
      llamar(function (r) { r.marcarFacturaParaIva(AUTH, kIva, nIva); }, panel); return;
    }
    if (b.dataset.devolver && panel) {
      var quien = b.dataset.devolver, dq = Number(valor(panel, 'monto')), dfe = valor(panel, 'fecha') || hoy(), dno = valor(panel, 'nota');
      if (!(dq > 0)) { panel.querySelector('[data-err]').textContent = 'Escribí cuánto le devolviste.'; return; }
      if (!confirm('¿Registrar que le devolviste ' + q(dq) + ' a ' + quien + '?')) return;
      llamar(function (r) { r.registrarDevolucionEquipo(AUTH, quien, dq, dfe, dno); }, panel); return;
    }
    if (b.dataset.ivadev) {
      if (!confirm('¿Devolver esta factura a su categoría de siempre? Vuelve a Pagos y al DRE.')) return;
      var kDev = b.dataset.ivadev;
      llamar(function (r) { r.devolverFacturaParaIva(AUTH, kDev); }); return;
    }
    if (b.dataset.anular) { if (confirm('¿Anular este movimiento? Queda en la hoja marcado ANULADO.')) { var id = b.dataset.anular; llamar(function (r) { r.anularMovimientoPago(AUTH, id); }); } return; }
    if (b.dataset.favor) {
      var monto = prompt('¿Cuánto tiene Rosanta a favor con este proveedor? (Q)'); if (!monto) return;
      var det = prompt('¿De dónde sale? (ej. nota de crédito, pagamos de más la semana 38)'); if (!det) return;
      var nit = b.dataset.favor;
      llamar(function (r) { r.registrarSaldoFavor(AUTH, nit, Number(monto), det); });
    }
  });
  HOST.addEventListener('change', function (ev) {
    var c = ev.target;
    if (c.dataset && c.dataset.f === 'aprov' && AGR) { AGR.prov = c.value; repintarCuerpo(); return; }
    if (c.dataset && c.dataset.f === 'iprov' && IVAAGR) { IVAAGR.prov = c.value; repintarCuerpo(); return; }
    if (!c.dataset || !c.dataset.sel) return;
    SEL[c.dataset.sel] = c.checked; pintarSeleccion();
  });
  cargar();
};
</script>
