<style>

  .pg { color: var(--texto); --vb: var(--rosanta-verde); --lila: var(--rosanta-lila); }
  .pg h2, .pg h3 { font-family: var(--rosanta-font-title); }
  .pg-intro { font-size: 0.9rem; color: var(--texto-2); line-height: 1.5; max-width: 52rem; }
  .pg-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 1rem 0; align-items: center; }
  .pg-tabs button, .pg-b { font: inherit; font-size: 0.82rem; border: 1px solid rgba(78,109,90,0.35); background: var(--superficie); color: var(--vb);
    border-radius: 999px; padding: 0.35rem 0.9rem; cursor: pointer; }
  .pg-tabs button[aria-pressed="true"] { background: var(--vb); color: var(--rosanta-blanco); border-color: var(--vb); }
  .pg-b.pri { background: var(--vb); color: var(--rosanta-blanco); border-color: var(--vb); }
  .pg-b:disabled { opacity: 0.5; cursor: default; }
  .pg-tabs .pg-sp { flex: 1; }
  .pg-res { display: flex; flex-wrap: wrap; gap: 0.6rem 1.8rem; background: var(--superficie); border: 2px solid var(--lila); border-radius: 18px; padding: 0.9rem 1.2rem; }
  .pg-res div { display: flex; flex-direction: column; }
  .pg-res b { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .pg-res span { font-size: 0.74rem; color: var(--texto-2); }
  .pg-prov { background: var(--superficie); border-radius: 18px; padding: 0.9rem 1.1rem; box-shadow: 0 2px 10px rgba(26,26,26,0.06); margin-top: 0.9rem; }
  .pg-prov header { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; align-items: baseline; justify-content: space-between; }
  .pg-prov header h3 { margin: 0; font-size: 1.05rem; }
  .pg-area { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto-suave); font-family:var(--rosanta-font-label)}
  .pg-prov table { width: 100%; border-collapse: collapse; font-size: 0.86rem; margin-top: 0.4rem; }
  .pg-prov td, .pg-prov th { padding: 0.45rem 0.3rem; border-bottom: 1px solid rgba(26,26,26,0.08); text-align: left; vertical-align: middle; }
  .pg-prov th, .pg-t th { font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto-suave); font-weight: 600; font-family:var(--rosanta-font-label)}
  .pg .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pg-est { display: inline-block; font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.15rem 0.5rem; border-radius: 999px; background: var(--fondo); color: var(--texto-2); white-space: nowrap; font-family:var(--rosanta-font-label)}
  .pg-est.pend { background: var(--alerta-tint); color: var(--alerta); }
  .pg-est.abon { background: var(--rosanta-lila-tint); color: var(--lila-texto); }
  .pg-est.banco { background: var(--ok-tint); color: var(--rosanta-verde); }
  .pg-est.ok { background: var(--ok-tint); color: var(--ok); }
  .pg-est.mas { background: var(--mal-tint); color: var(--mal); }
  .pg-panel { background: var(--fondo); border-radius: 12px; padding: 0.7rem 0.8rem; margin: 0.3rem 0 0.4rem; }
  .pg-formas { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.3rem 0; }
  .pg-formas button { font: inherit; font-size: 0.86rem; background: var(--vb); color: var(--rosanta-blanco); border: 0; border-radius: 10px; padding: 0.55rem 0.9rem; cursor: pointer; }
  .pg-formas button:disabled { opacity: 0.5; }
  /* Elegir y despues Guardar (14-oct-2026, Juanma: "se pueden cometer errores de selección"):
     la forma elegida queda marcada; las otras, en blanco. */
  .pg-formas button[data-elegir] { background: var(--superficie); color: var(--vb); border: 1px solid rgba(78,109,90,0.45); }
  .pg-formas button[data-elegir][aria-pressed="true"] { background: var(--vb); color: var(--rosanta-blanco); border-color: var(--vb); }
  .pg-formas button[data-elegir][aria-pressed="true"]::before { content: '✓ '; }
  .pg-medio { margin: 0.4rem 0; }
  .pg-medio select { font-size: 0.95rem !important; padding: 0.45rem 0.6rem !important; border: 2px solid var(--lila) !important; }
  .pg-medio select.falta { border-color: var(--mal) !important; }
  .pg-resumen { margin-top: 0.6rem; font-size: 0.86rem; background: var(--superficie); border-radius: 10px; padding: 0.5rem 0.7rem; border: 1px dashed rgba(78,109,90,0.45); }
  .pg-acciones { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
  .pg-acciones .pg-b { font-size: 0.9rem; padding: 0.5rem 1.2rem; }
  .pg-hist td { background: var(--superficie); }
  .pg-varias { margin-top: 0.6rem; background: var(--rosanta-lila-tint); border-radius: 12px; padding: 0.6rem 0.8rem; display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: space-between; align-items: center; }
  .pg-varias > .pg-panel { width: 100%; margin: 0; }
  .pg-hist table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  .pg-hist th, .pg-hist td td { padding: 0.35rem 0.4rem; }
  .pg-mas { font-size: 0.8rem; margin-top: 0.4rem; display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; align-items: center; }
  .pg input[type=text], .pg input[type=number], .pg input[type=date], .pg select { font: inherit; font-size: 0.85rem; padding: 0.3rem 0.45rem; border: 1px solid rgba(26,26,26,0.2); border-radius: 8px; background: var(--superficie); }
  .pg input[type=number] { width: 7rem; }
  .pg-err { color: var(--mal); font-size: 0.82rem; margin-top: 0.3rem; }
  .pg-nota { font-size: 0.8rem; color: var(--texto-2); line-height: 1.5; }
  .pg-t { width: 100%; border-collapse: collapse; font-size: 0.86rem; background: var(--superficie); border-radius: 18px; overflow: hidden; }
  .pg-t td, .pg-t th { padding: 0.5rem 0.45rem; border-bottom: 1px solid rgba(26,26,26,0.08); text-align: left; }
  .pg-scroll { overflow-x: auto; margin-top: 0.9rem; border-radius: 18px; box-shadow: 0 2px 10px rgba(26,26,26,0.06); }
  .pg-x { font: inherit; font-size: 0.72rem; background: none; border: 0; color: var(--mal); cursor: pointer; text-decoration: underline; padding: 0; }
  .pg-grupo { font-family: var(--rosanta-font-title); font-size: 1.1rem; margin: 1.4rem 0 0; padding-bottom: 0.3rem; border-bottom: 2px solid var(--vb); display: flex; justify-content: space-between; }
  .pg-grupo span { font-family: inherit; font-size: 0.9rem; }
  .pg-vacio { padding: 2rem 0; text-align: center; color: var(--texto-2); }
  /* Una factura por linea, con las columnas del Excel. En el telefono se acomoda en dos
     renglones: DTE y cantidad arriba, estatus y el boton abajo. */
  .pg-l { display: grid; grid-template-columns: 1.6rem 1fr 5.5rem 6.5rem 8.5rem 8.5rem 4.8rem; gap: 0.2rem 0.5rem; align-items: center;
    padding: 0.45rem 0.1rem; border-bottom: 1px solid rgba(26,26,26,0.08); font-size: 0.86rem; }
  .pg-l.cab { font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto-suave); font-weight: 600; padding-top: 0.2rem; font-family:var(--rosanta-font-label)}
  .pg-l .m { display: none; font-size: 0.74rem; color: var(--texto-suave); }
  .pg-lp { grid-column: 1 / -1; }
  @media (max-width: 640px) {
    .pg-hide-m, .pg-l .d { display: none; }
    .pg-l { grid-template-columns: 1.6rem 1fr auto; grid-template-areas: "c dte cant" "c est acc"; }
    .pg-l.cab { display: none; }
    .pg-l .c { grid-area: c; } .pg-l .dte { grid-area: dte; } .pg-l .cant { grid-area: cant; } .pg-l .est { grid-area: est; } .pg-l .acc { grid-area: acc; text-align: right; }
    .pg-l .m { display: block; }
    .pg-prov { padding: 0.8rem 0.7rem; }
  }
</style>
<script>
/* Pagos a proveedores (p213, 29-sep-2026). Reemplaza a COMPRAS_2026 desde el 5-oct-2026.
   Parcial crudo: PF_PAGOS(host, AUTH). El token va PRIMERO en cada llamada al servidor.
   Mismas columnas que el Excel: AREA · PROVEEDOR · DTE · FECHA DE PAGAR · FECHA PAGADO ·
   CANTIDAD A PAGAR · ESTATUS DE PAGO. */
/* MODO (13-oct-2026, Juanma: "los chicos no entenderán"): sin modo es Pagos, solo lo del dia a dia.
   'admin:equipo' | 'admin:banco' | 'admin:balance' | 'admin:iva' son las pestañas del grupo
   Administración de la barra lateral: una sola pestaña cada una, sin fila de pestañas. */
window.PF_PAGOS = function (HOST, AUTH, MODO) {
  var ADMIN = /^admin:/.test(MODO || '') ? MODO.slice(6) : null, AGR = null, IVAAGR = null;
  function esc(x) { return String(x === null || x === undefined ? '' : x).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function q(n) { return 'Q' + Number(n || 0).toLocaleString('es-GT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function ddmm(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : ''; }
  function hoy() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  var D = null, D0 = null, TAB = ADMIN || 'pagar', ABIERTA = null, SEL = {}, OCUPADO = false, BAL = null, HIST = null;
  /* EL BUSCADOR de arriba (13-oct-2026): D0 es lo que mando el servidor y D lo que se ve,
     filtrado por proveedor, DTE, razon social o detalle. Todo lo de la pantalla lee D. */
  function sinAcento(x) { return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  function filtrar(d) {
    var b = sinAcento(window.PF_BUSCA || '').trim();
    if (!d || !b) return d;
    var ok = function () { return sinAcento([].slice.call(arguments).join(' ')).indexOf(b) !== -1; };
    var f = Object.assign({}, d);
    f.facturas = (d.facturas || []).filter(function (x) { return ok(x.proveedor, x.razon, x.dte, x.nit); });
    f.cuadre = (d.cuadre || []).filter(function (x) { return ok(x.proveedor, x.nit); });
    f.mercado = (d.mercado || []).filter(function (x) { return ok(x.proveedor, x.detalle, x.dte); });
    f.para_iva = (d.para_iva || []).filter(function (x) { return ok(x.proveedor, x.dte, x.marco); });
    f.posibles = (d.posibles || []).filter(function (x) { return ok(x.pago.glosa, x.pago.banco) || x.opciones.some(function (o) { return o.facturas.some(function (y) { return ok(y.proveedor, y.dte); }); }); });
    f.banco_dudosos = (d.banco_dudosos || []).filter(function (x) { return ok(x.glosa, x.banco); });
    f.banco_sueltos = (d.banco_sueltos || []).filter(function (x) { return ok(x.glosa, x.banco); });
    f.por_devolver = (d.por_devolver || []).map(function (x) { return Object.assign({}, x, { movs: x.movs.filter(function (m) { return ok(m.proveedor, m.dte, m.detalle); }) }); });
    f.filtro = window.PF_BUSCA;
    return f;
  }
  function chipFiltro() {
    return D.filtro ? '<p class="pg-nota" style="background:var(--rosanta-lila-tint);border-radius:10px;padding:0.4rem 0.7rem">Mostrando solo lo que coincide con «<b>' + esc(D.filtro) + '</b>». ' +
      '<button type="button" class="pg-x" data-quitarfiltro="1" style="color:var(--lila-texto)">quitar filtro</button></p>' : '';
  }
  window.addEventListener('pf-buscar', function () { if (D0) { D = filtrar(D0); pintar(); } });
  window.addEventListener('pf-ir', function () { if (D && !ADMIN && window.PF_IR && window.PF_IR.vista === 'pagos') pintar(); });
  var CLASE = { 'Pendiente': 'pend', 'Abonada': 'abon', 'Banco por confirmar': 'banco', 'Pagada': 'ok', 'Pagada de más': 'mas' };
  function estado(e) { return '<span class="pg-est ' + (CLASE[e] || '') + '">' + esc(e === 'Banco por confirmar' ? 'Pagada · falta que el banco la registre' : e) + '</span>'; }

  function cargar() {
    HOST.innerHTML = '<div class="pg-vacio">Leyendo las facturas y los pagos…</div>';
    google.script.run.withSuccessHandler(function (r) { D0 = r; D = filtrar(r); pintar(); })
      .withFailureHandler(function (e) { HOST.innerHTML = '<p class="pg-err">' + esc(PF_ERROR(e)) + '</p>'; })
      .getPagosProveedores(AUTH);
  }
  /* "marcada Banco BI el 06/10, falta que el banco la confirme" */
  function marcaTxt(f) {
    var mk = (f.pagos || []).filter(function (p) { return p.estatus === 'Banco'; }).pop();
    var med = mk && /^\[([^\]]+)\]/.exec(mk.detalle || '');
    return (f.saldo > 0.01 ? q(f.por_confirmar) + ' ' : '') + 'pagada por ' + nom(med ? med[1] : 'Banco') + (mk && mk.fecha ? ' el ' + ddmm(mk.fecha) : '') + ', falta que el banco la registre';
  }
  /* "Banco" se ve como "Transferencia" (Juanma, 13-oct-2026). Por dentro sigue siendo "Banco":
     asi quedan bien los pagos ya guardados y las llaves de los pagos confirmados. */
  function nom(x) { return String(x || '').replace(/^Banco confirmado$/, 'Transferencia confirmada').replace(/^Banco(?= |$)/, 'Transferencia'); }
  function porProveedor(lista) {
    var g = {}, orden = [];
    lista.forEach(function (f) { if (!g[f.nit]) { g[f.nit] = []; orden.push(f.nit); } g[f.nit].push(f); });
    return orden.map(function (n) { return g[n]; });
  }
  function favorDe(nit) { var c = (D.cuadre || []).filter(function (x) { return x.nit === nit; })[0]; return c ? c.favor : 0; }

  function pintar() {
    // el punto exacto desde Hoy (14-oct-2026): 'pagar' o 'posibles'
    var ir = !ADMIN && window.PF_TOMAR_IR && window.PF_TOMAR_IR('pagos');
    if (ir) { TAB = ir; ABIERTA = null; }
    // Por pagar: lo que falta, y lo marcado "Banco" que el banco todavia no confirma (13-oct-2026)
    var abiertas = D.facturas.filter(function (f) { return f.saldo > 0.01 || f.estado === 'Banco por confirmar'; });
    var pendQ = abiertas.reduce(function (a, f) { return a + f.saldo; }, 0);
    var vence = abiertas.filter(function (f) { return f.fecha_pagar && f.fecha_pagar <= hoy(); }).length;
    if (ADMIN) return pintarAdmin();
    var h = '<div class="pg">' +
      // Una linea de que hacer y la guia de donde va cada pago (14-oct-2026); el resto, en "¿Cómo funciona?"
      '<h2>Pagos a proveedores</h2><p class="pg-intro">Cuando pagues una factura, tocá <b>Pagar</b>, elegí cómo y tocá <b>Guardar pago</b>.</p>' + window.PF_DONDE('pagos') +
      '<details class="pg-nota" style="margin:0.3rem 0 0.8rem"><summary style="cursor:pointer">¿Cómo funciona?</summary>Las facturas llegan solas: SAT avisa cada factura al correo el mismo día, y el lunes entra la carga completa. ' +
      'Entran desde el ' + esc(ddmm(D.desde)) + '; las de antes del 28/09 que ya estaban pagadas cuentan como pagadas. ' +
      'Las pagadas por <b>Transferencia</b> o <b>Tarjeta</b> se confirman solas cuando se carga el estado de cuenta del banco' + (D.banco_ult ? ' (hoy llega hasta el ' + esc(ddmm(D.banco_ult)) + ')' : '') + '.</details>' +
      '<div class="pg-res"><div><b>' + abiertas.length + '</b><span>facturas por pagar</span></div><div><b>' + q(pendQ) + '</b><span>cantidad a pagar</span></div>' +
      '<div><b>' + vence + '</b><span>con fecha de pagar hasta hoy</span></div><div><b>' + esc(D.areas.filter(function (a) { return a !== 'ADMIN'; }).join(' y ').toLowerCase()) + (D.rol === 'dueno' ? ' y admin' : '') + '</b><span>áreas</span></div></div>' +
      '<div class="pg-tabs">' +
      ['pagar:Por pagar', 'pagadas:Pagadas', 'cuadre:Cuadre por proveedor', 'mercado:Sin factura']
        // Posibles pagos (13-oct-2026): cargos del banco o de la tarjeta con el monto de una factura. Solo el dueño.
        .concat(D.posibles && D.posibles.length ? ['posibles:Posibles pagos (' + D.posibles.length + ')'] : []).map(function (t) {
        var k = t.split(':'); return '<button type="button" data-tab="' + k[0] + '" aria-pressed="' + (TAB === k[0]) + '">' + k[1] + '</button>';
      }).join('') + '<span class="pg-sp"></span>' + (D.rol === 'dueno' ? '<button type="button" class="pg-b" data-acc="anterior">+ Factura anterior</button> ' : '') + '<button type="button" class="pg-b pri" data-acc="mercado">+ Compra de mercado</button> <button type="button" class="pg-b" data-acc="recargar">Actualizar</button></div>' +
      chipFiltro() + '<div id="pg-merc"></div><div id="pg-cuerpo">' + cuerpo(abiertas) + '</div>' +
      (D.aviso_correo ? '<p class="pg-err">' + esc(D.aviso_correo) + '</p>' : '') +
      '<p class="pg-nota" style="margin-top:1rem">Actualizado ' + esc(D.gen) + '. Las facturas <b>por correo</b> son las que SAT avisó y todavía no entran en la carga del lunes.</p></div>';
    HOST.innerHTML = h;
  }

  /* Administración: una pestaña de la barra lateral, con el mismo cuerpo de siempre. */
  function pintarAdmin() {
    var T = { equipo: ['Por devolver', 'Lo que cada quien pagó de su bolsa y Rosanta le devuelve. Es de todos: cada quien agrega lo suyo y todos ven lo de todos.'],
              banco: ['Banco por revisar', 'Pagos del banco que no se pudieron unir solos con una factura.'],
              balance: ['Balance del año', 'Lo facturado contra lo pagado, por proveedor.'],
              iva: ['Para reducir IVA', 'Facturas a nombre de CORSAGA que solo sirven para el crédito fiscal. Es de todos: cada quien marca las suyas y todos ven quién marcó cada una.'] }[ADMIN] || ['Administración', ''];
    HOST.innerHTML = '<div class="pg"><h2>' + T[0] + '</h2><p class="pg-intro">' + T[1] + '</p>' +
      '<div class="pg-tabs"><span class="pg-sp"></span><button type="button" class="pg-b" data-acc="recargar">Actualizar</button></div>' +
      chipFiltro() + '<div id="pg-merc"></div><div id="pg-cuerpo">' + cuerpo([]) + '</div>' +
      '<p class="pg-nota" style="margin-top:1rem">Actualizado ' + esc(D.gen) + '.</p></div>';
  }


  function cuerpo(abiertas) {
    if (TAB === 'pagar') {
      if (!abiertas.length) return '<div class="pg-vacio">No hay facturas por pagar. ✓</div>';
      var grupoAnt = '';
      return porProveedor(abiertas).map(function (g) {
        var cab = '';
        if (g[0].grupo !== grupoAnt) {
          grupoAnt = g[0].grupo;
          var totG = abiertas.filter(function (f) { return f.grupo === grupoAnt; }).reduce(function (a, f) { return a + f.saldo; }, 0);
          cab = '<h3 class="pg-grupo">' + esc(grupoAnt) + '<span>' + q(totG) + '</span></h3>';
        }
        return cab + (function () {
        var f0 = g[0], tot = g.reduce(function (a, f) { return a + f.saldo; }, 0), fav = favorDe(f0.nit);
        // Varias a la vez (14-oct-2026, Juanma: "no hay botón para cerrarlas todas juntas"): el
        // boton vive en la tarjeta del proveedor. Antes salia en una barra al pie de toda la lista.
        var pagables = g.filter(function (f) { return f.saldo > 0.01; }), elegidas = pagables.filter(function (f) { return SEL[f.llave]; });
        var todas = pagables.length > 1 && elegidas.length === pagables.length, abiertaSel = ABIERTA === 'sel:' + f0.nit && elegidas.length > 1;
        return '<section class="pg-prov" data-nit="' + esc(f0.nit) + '"><header><div><span class="pg-area">' + esc(f0.grupo) + '</span><h3>' + esc(f0.proveedor) + '</h3>' +
          '<button type="button" class="pg-x" style="color:var(--vb)" data-hist="' + esc(f0.nit) + '">ver historial de facturas y pagos</button></div>' +
          '<div class="n"><b>' + q(tot) + '</b>' + (fav > 0.01 ? ' · <span class="pg-est ok">' + q(fav) + ' a favor</span>' : '') + '</div></header>' +
          '<div class="pg-l cab"><span>' + (pagables.length > 1 ? '<input type="checkbox" data-selprov="' + esc(f0.nit) + '"' + (todas ? ' checked' : '') + ' aria-label="Elegir todas" title="Elegir todas">' : '') + '</span><span>DTE</span><span>Fecha</span><span>Fecha de pagar</span><span class="n">Cantidad a pagar</span><span>Estatus de pago</span><span></span></div>' +
          g.map(function (f) {
            var fila = '<div class="pg-l"><span class="c"><input type="checkbox" data-sel="' + esc(f.llave) + '"' + (SEL[f.llave] ? ' checked' : '') + ' aria-label="Elegir"></span>' +
              '<span class="dte">' + esc(f.dte) + (f.anterior ? ' <span class="pg-est abon" title="Traída del Excel de compras de antes">anterior</span>' : '') + (f.por_correo ? ' <span class="pg-est abon" title="Avisada por SAT al correo. Entra al FEL del maestro con la carga del lunes.">por correo</span>' : '') + '<span class="m">' + esc(ddmm(f.fecha)) + (f.fecha_pagar ? ' · pagar ' + esc(ddmm(f.fecha_pagar)) : '') + '</span></span>' +
              '<span class="d">' + esc(ddmm(f.fecha)) + '</span><span class="d">' + esc(ddmm(f.fecha_pagar)) + '</span>' +
              '<span class="n cant">' + q(f.saldo > 0.01 ? f.saldo : f.por_confirmar) + (f.saldo > 0.01 && f.pagado > 0.01 ? '<span class="pg-nota" style="display:block">de ' + q(f.total) + ' · abonado ' + q(f.pagado) + '</span>' : '') +
                '</span>' +

  function aplicarCambios(c) {

      return;
    }
    if (b.dataset.agrcerrar) { AGR = null; repintarCuerpo(); return; }
    if (b.dataset.confpos) {
      var ij = b.dataset.confpos.split(':'), PX = D.posibles[+ij[0]], OX = PX && PX.opciones[+ij[1]];
      if (!OX) return;
      if (!confirm('¿El cargo de ' + q(PX.pago.q) + ' del ' + ddmm(PX.pago.fecha) + ' (' + nom(PX.pago.banco) + ') es ' + (OX.abono ? 'un abono a ' : OX.fraccionado ? 'el pago (en ' + PX.pagos.length + ' cargos) de ' : 'el pago de ') + OX.facturas.map(function (f) { return f.proveedor + ' ' + f.dte; }).join(', ') + '?')) return;
      var pl = PX.pago.llave, ks2 = OX.llaves;
      llamar(function (r) { r.confirmarPosiblePago(AUTH, pl, ks2); }, panel, 'Confirmando el pago con el banco…');
      return;
    }
    if (b.dataset.descpos) {
      var PD2 = D.posibles[+b.dataset.descpos];
      if (!PD2) return;
      if (!confirm('¿El cargo de ' + q(PD2.pago.q) + ' del ' + ddmm(PD2.pago.fecha) + ' (' + PD2.pago.glosa + ') NO es el pago de ninguna de estas facturas?\n\nSale de Posibles pagos y no vuelve a ofrecerse. Se puede deshacer abajo, en "Marcados No pertenece".')) return;
      var plD = PD2.pago.llave;
      llamar(function (r) { r.descartarPosiblePago(AUTH, plD); }, panel, 'Guardando…');
      return;
    }
    if (b.dataset.ivaagr) { IVAAGR = {}; repintarCuerpo(); return; }
    if (b.dataset.ivacerrar) { IVAAGR = null; repintarCuerpo(); return; }
    if (b.dataset.ivamarcar && panel) {
      var rI = panel.querySelector('[data-ivallave]:checked');
      if (!rI) { panel.querySelector('[data-err]').textContent = 'Elegí la factura.'; return; }
      var kI = rI.dataset.ivallave, nI = valor(panel, 'inota');
      if (!confirm('¿Esta factura es ajena a la operación y solo sirve para reducir el IVA?\n\nSale de Pagos y del DRE. Se puede devolver desde esta misma lista.')) return;
      llamar(function (r) { r.marcarFacturaParaIva(AUTH, kI, nI); }, panel, 'Marcando la factura…');
      return;
    }
    if (b.dataset.agrfact && panel) {
      var aks = []; panel.querySelectorAll('[data-allave]').forEach(function (c) { if (c.checked) aks.push(c.dataset.allave); });
      if (!aks.length) { panel.querySelector('[data-err]').textContent = 'Elegí la factura.'; return; }
      var an = b.dataset.agrfact, am = valor(panel, 'amonto'), af = valor(panel, 'afecha') || hoy(), ano = valor(panel, 'anota');
      llamar(function (r) { r.agregarFacturaDeSuBolsa(AUTH, an, aks, af, am === '' ? null : Number(am), ano); }, panel, 'Guardando en Por devolver…');
      return;
    }
    if (b.dataset.agrmerc && panel) {
      var mn = b.dataset.agrmerc, mf2 = valor(panel, 'mfecha') || hoy(), mp2 = valor(panel, 'mprov'), md2 = valor(panel, 'mdet'), mq2 = Number(valor(panel, 'mmonto'));
      llamar(function (r) { r.agregarCompraDeSuBolsa(AUTH, mn, mf2, mp2, md2, mq2); }, panel, 'Guardando en Por devolver…');
      return;
    }
    if (b.dataset.acc === 'recargar') { BAL = null; cargar(); return; }
    if (b.dataset.acc === 'balrecalc') {
      BAL = null; HOST.querySelector('#pg-cuerpo').innerHTML = '<div class="pg-vacio">Recalculando…</div>';
      google.script.run.withSuccessHandler(function (r) { BAL = r; pintar(); })
        .withFailureHandler(function (e) { BAL = { error: PF_ERROR(e) }; pintar(); })
        .getBalanceProveedores(AUTH, true);
      return;
    }
    if (b.dataset.acc === 'mercado') { formMercado(); return; }
    if (b.dataset.acc === 'anterior') { formAnterior(); return; }
    if (b.dataset.traer && panel) {
      var dte = valor(panel, 'dte'), sal = valor(panel, 'saldo'), nitA = valor(panel, 'nit'), detA = valor(panel, 'det');
      llamar(function (r) { r.traerFacturaAnterior(AUTH, dte, sal === '' ? null : Number(sal), nitA, detA); }, panel, 'Trayendo la factura…'); return;
    }
    if (b.dataset.todasprov) { D.facturas.forEach(function (f) { if (f.nit === b.dataset.todasprov && f.saldo > 0.01) SEL[f.llave] = true; }); pintar(); return; }
    if (b.dataset.quitarsel) { D.facturas.forEach(function (f) { if (f.nit === b.dataset.quitarsel) delete SEL[f.llave]; }); if (ABIERTA === 'sel:' + b.dataset.quitarsel) ABIERTA = null; pintar(); return; }
    if (b.dataset.abrir) { ABIERTA = ABIERTA === b.dataset.abrir ? null : b.dataset.abrir; pintar(); return; }
    // Elegir la forma no guarda nada: marca la forma y, si hace falta, pide la cuenta o la tarjeta
    if (b.dataset.elegir && panel) { elegirForma(panel, b.dataset.elegir); panel.querySelector('[data-err]').textContent = ''; return; }
    if (b.dataset.cancelar && panel) {
      if (panel.dataset.panel === 'mercado') { HOST.querySelector('#pg-merc').innerHTML = ''; return; }
      ABIERTA = null; pintar(); return;
    }
    if (b.dataset.guardar && panel) {
      var L = leerPanel(panel), errG = panel.querySelector('[data-err]');
      if (L.falta) { errG.textContent = L.falta; return; }
      if (panel.dataset.panel === 'mercado') {
        var mf = valor(panel, 'fecha'), mp = valor(panel, 'prov'), md = valor(panel, 'det'), mq = Number(valor(panel, 'monto')),
            ma = valor(panel, 'area') || D.areas[0];
        if (!(mq > 0)) { errG.textContent = 'Escribí la cantidad.'; return; }
        llamar(function (r) { r.registrarCompraMercado(AUTH, mf, mp, md, mq, ma, L.forma, L.medio); }, panel, 'Guardando la compra…');
        return;
      }
      var ks = panel.dataset.panel.split(','), m = valor(panel, 'monto');
      var fecha = valor(panel, 'fecha') || hoy(), favor = Number(valor(panel, 'favor')) || 0, nota = valor(panel, 'nota');
      llamar(function (r) { r.registrarPagoFacturas(AUTH, ks, L.forma, fecha, m === '' ? null : Number(m), favor, nota, L.medio); }, panel, 'Guardando el pago…');
      return;
    }
    if (b.dataset.programar && panel) {
      if (!valor(panel, 'fpagar')) { panel.querySelector('[data-err]').textContent = 'Elegí la fecha de pagar.'; return; }
      var llave = b.dataset.programar, fp = valor(panel, 'fpagar');
      llamar(function (r) { r.programarPagoFactura(AUTH, llave, fp); }, panel, 'Guardando la fecha de pago…'); return;
    }
    if (b.dataset.iva && panel) {
      if (!confirm('¿La factura ' + b.dataset.iva.split('|')[1] + ' es ajena al giro y solo sirve para reducir el IVA?\n\nSale de Pagos y del DRE, y en el maestro pasa a FACTURA_AJENA. Se puede devolver desde la pestaña Para reducir IVA.')) return;
      var kIva = b.dataset.iva, nIva = valor(panel, 'nota');
      llamar(function (r) { r.marcarFacturaParaIva(AUTH, kIva, nIva); }, panel, 'Marcando la factura…'); return;
    }
    if (b.dataset.devolver && panel) {
      var quien = b.dataset.devolver, dq = Number(valor(panel, 'monto')), dfe = valor(panel, 'fecha') || hoy(), dno = valor(panel, 'nota');
      if (!(dq > 0)) { panel.querySelector('[data-err]').textContent = 'Escribí cuánto le devolviste.'; return; }
      if (!confirm('¿Registrar que le devolviste ' + q(dq) + ' a ' + quien + '?')) return;
      llamar(function (r) { r.registrarDevolucionEquipo(AUTH, quien, dq, dfe, dno); }, panel, 'Guardando la devolución…'); return;
    }
    if (b.dataset.ivadev) {
      if (!confirm('¿Devolver esta factura a su categoría de siempre? Vuelve a Pagos y al DRE.')) return;
      var kDev = b.dataset.ivadev;
      llamar(function (r) { r.devolverFacturaParaIva(AUTH, kDev); }, null, 'Devolviendo la factura…'); return;
    }
    if (b.dataset.anular) { if (confirm('¿Anular este movimiento? Queda en la hoja marcado ANULADO.')) { var id = b.dataset.anular; llamar(function (r) { r.anularMovimientoPago(AUTH, id); }, null, 'Anulando…'); } return; }
    if (b.dataset.favor) {
      var monto = prompt('¿Cuánto tiene Rosanta a favor con este proveedor? (Q)'); if (!monto) return;
      var det = prompt('¿De dónde sale? (ej. nota de crédito, pagamos de más la semana 38)'); if (!det) return;
      var nit = b.dataset.favor;
      llamar(function (r) { r.registrarSaldoFavor(AUTH, nit, Number(monto), det); }, null, 'Guardando el saldo a favor…');
    }
  });
  // el resumen de lo que se va a guardar se pone al dia con cada cambio del panel
  HOST.addEventListener('input', function (ev) {
    var pn = ev.target.closest && ev.target.closest('[data-panel]');
    if (pn && pn.querySelector('[data-resumen]')) actualizarPanel(pn);
  });
  HOST.addEventListener('change', function (ev) {
    var c = ev.target;
    var pn = c.closest && c.closest('[data-panel]');
    if (pn && pn.querySelector('[data-resumen]')) { actualizarPanel(pn); if (c.dataset && c.dataset.f === 'medio') return; }
    if (c.dataset && c.dataset.f === 'aprov' && AGR) { AGR.prov = c.value; repintarCuerpo(); return; }
    if (c.dataset && c.dataset.f === 'iprov' && IVAAGR) { IVAAGR.prov = c.value; repintarCuerpo(); return; }
    if (c.dataset && c.dataset.selprov) {
      D.facturas.forEach(function (f) { if (f.nit === c.dataset.selprov && f.saldo > 0.01) SEL[f.llave] = c.checked; });
      pintar(); return;
    }
    if (!c.dataset || !c.dataset.sel) return;
    SEL[c.dataset.sel] = c.checked; pintar();
  });
  cargar();
};
</script>
