<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <?!= include('Estilos') ?>
  <?!= include('Logo') ?>
  <style>
    /* Reporte semanal de operacion, en vivo. Pilar 3. Las 8 secciones y el orden son
       los del formato cerrado con Juanma el 23-sep-2026 (S38). Solo lectura salvo las
       acciones de la semana, que se escriben en REPORTE_ACCIONES. */
    main.rep { max-width: 1080px; }
    .rp-barra { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; }
    .rp-sub { font-size: 0.9rem; opacity: 0.75; margin-top: 0.3rem; line-height: 1.5; }
    .rp-controles { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
    .rp-controles select { font-family: 'Lato', Arial, sans-serif; font-size: 0.9rem; padding: 0.35rem 0.5rem;
      border: 1px solid rgba(26,26,26,0.18); border-radius: 8px; background: #fff; }
    .rp-boton { background: transparent; color: var(--verde-bosque); border: 1px solid rgba(78,109,90,0.35);
      border-radius: 999px; padding: 0.45rem 1rem; font-size: 0.82rem; cursor: pointer; font-family: 'Lato', Arial, sans-serif; }
    .rp-boton:hover { background: rgba(78,109,90,0.07); }
    .rp-boton.lleno { background: var(--verde-bosque); color: var(--blanco); border-color: var(--verde-bosque); }
    section.rp { margin-top: 2.2rem; page-break-inside: avoid; }
    section.rp > h2 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    .rp-nota { font-size: 0.82rem; opacity: 0.78; line-height: 1.55; max-width: 84ch; margin: 0.3rem 0 0.9rem; }
    .rp-kpis { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .rp-kpi { background: var(--blanco); border-radius: 16px; padding: 0.9rem 1.05rem; box-shadow: 0 2px 10px rgba(26,26,26,0.06); border-left: 5px solid #c9c6c0; }
    .rp-kpi.verde { border-left-color: #2E6B3F; } .rp-kpi.amarillo { border-left-color: #C89A3C; } .rp-kpi.rojo { border-left-color: #A33A2A; }
    .rp-kpi .et { font-size: 0.76rem; color: #52514e; }
    .rp-kpi .val { font-family: 'Lato', Arial, sans-serif; font-weight: 700; font-size: 1.55rem; line-height: 1.15; margin: 0.3rem 0 0.15rem; }
    .rp-kpi .det { font-size: 0.78rem; color: #52514e; line-height: 1.45; }
    .rp-tabla { overflow-x: auto; margin-top: 0.6rem; }
    table.rp { width: 100%; border-collapse: collapse; background: var(--blanco); border-radius: 14px; overflow: hidden; font-size: 0.84rem; }
    table.rp th { background: var(--verde-bosque); color: var(--blanco); font-weight: 600; text-align: right; padding: 0.5rem 0.7rem; white-space: nowrap; }
    table.rp td { padding: 0.45rem 0.7rem; text-align: right; border-bottom: 1px solid rgba(26,26,26,0.06); font-variant-numeric: tabular-nums; white-space: nowrap; }
    table.rp th:first-child, table.rp td:first-child { text-align: left; }
    table.rp td.txt { text-align: left; white-space: normal; }
    table.rp tr.total td { font-weight: 700; border-top: 2px solid rgba(26,26,26,0.2); }
    table.rp tr.act td { background: rgba(87,167,127,0.10); }
    td.neg, .neg { color: #A33A2A; } td.pos, .pos { color: #2E6B3F; }
    .rp-barras { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; align-items: end; height: 190px; padding: 0.6rem 0.4rem 0; position: relative; background: var(--blanco); border-radius: 16px; box-shadow: 0 2px 10px rgba(26,26,26,0.06); }
    .rp-barra { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 0.74rem; color: #52514e; text-align: center; }
    .rp-barra i { display: block; width: 62%; background: var(--verde-bosque); border-radius: 6px 6px 0 0; }
    .rp-barra.act i { background: #A33A2A; }
    .rp-barra b { color: var(--negro); margin-top: 0.25rem; }
    .rp-pe { position: absolute; left: 0; right: 0; border-top: 2px dashed #A33A2A; pointer-events: none; }
    .rp-pe span { position: absolute; right: 0.4rem; top: -1.05rem; font-size: 0.7rem; color: #A33A2A; }
    .rp-dos { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .rp-form { background: var(--blanco); border-radius: 16px; padding: 1rem 1.1rem; box-shadow: 0 2px 10px rgba(26,26,26,0.06); margin-top: 0.9rem; }
    .rp-form label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: #52514e; margin-top: 0.6rem; }
    .rp-form input, .rp-form textarea, .rp-form select { width: 100%; font-family: 'Lato', Arial, sans-serif; font-size: 0.9rem; padding: 0.45rem 0.55rem; border: 1px solid rgba(26,26,26,0.18); border-radius: 8px; background: #fff; }
    .rp-form textarea { min-height: 4rem; }
    .rp-form .fila { display: grid; gap: 0.8rem; grid-template-columns: 2fr 1fr; }
    .rp-aviso { background: #FBF3E2; border-radius: 12px; padding: 0.7rem 1rem; font-size: 0.84rem; line-height: 1.5; margin: 0.6rem 0; }
    .rp-error { background: #F6E4DF; border-radius: 14px; padding: 0.9rem 1.1rem; font-size: 0.88rem; line-height: 1.5; margin-top: 0.8rem; }
    .rp-cargando { padding: 3rem 0; text-align: center; opacity: 0.6; }
    .rp-pie { font-size: 0.74rem; color: #8a8780; margin-top: 2rem; line-height: 1.5; }
    .rp-chip { display: inline-block; font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: rgba(78,109,90,0.12); color: var(--verde-bosque); margin-left: 0.4rem; vertical-align: middle; }
    @media print {
      header.app, .rp-controles, .rp-form, .no-print { display: none !important; }
      body { background: #fff; }
      main.rep { max-width: none; padding: 0; }
      section.rp { margin-top: 1.2rem; }
      .rp-kpi, table.rp, .rp-barras { box-shadow: none; }
    }
  </style>
</head>
<body>
  <? if (mostrarVolver) { ?>
  <header class="app">
    <div class="marca">
      <span class="logo" role="img" aria-label="Rosanta"></span>
      <span class="sec">Reporte semanal</span>
    </div>
    <div class="quien">
      <span><?= usuario.nombre || usuario.email ?></span>
      <a class="volver" href="<?= urlBase ?><?= authToken ? '?u=' + authToken : '' ?>">Panel principal</a>
    </div>
  </header>
  <? } ?>

  <main class="rep">
    <div class="rp-barra">
      <div>
        <h1>Reporte semanal de operación</h1>
        <p class="rp-sub" id="sub">Revisión con jefes de departamento · cargando…</p>
      </div>
      <div class="rp-controles no-print">
        <select id="sel-semana" title="Semana"></select>
        <button class="rp-boton" id="btn-actualizar" type="button">Actualizar</button>
        <button class="rp-boton lleno" id="btn-imprimir" type="button">Imprimir / PDF</button>
      </div>
    </div>

    <div id="cargando" class="rp-cargando">Leyendo el maestro, las reservas y las ventas por plato…</div>
    <div id="error" class="rp-error" hidden></div>
    <div id="todo" hidden></div>

    <p class="rp-pie">Rosanta · CORSAGA, S.A. · <span id="fuentes"></span></p>
  </main>

<script>
(function () {
  /* El token va como PRIMER argumento en TODA llamada a google.script.run. */
  var AUTH = '<?= authToken ?>';
  var D = null, CLAVE = 0;

  function q(n, dec) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return 'Q' + Number(n).toLocaleString('es-GT', { maximumFractionDigits: dec === undefined ? 0 : dec, minimumFractionDigits: dec === undefined ? 0 : dec });
  }
  function pct(n, dec) { return (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(dec === undefined ? 1 : dec) + '%'; }
  function num(n) { return (n === null || n === undefined) ? '—' : Number(n).toLocaleString('es-GT'); }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function signo(n) { return n > 0 ? '+' : ''; }
  function kpi(cls, et, val, det) {
    return '<div class="rp-kpi ' + (cls || '') + '"><div class="et">' + esc(et) + '</div><div class="val">' + val + '</div><div class="det">' + (det || '') + '</div></div>';
  }
  function zonaCosto(real, meta) {
    if (real === null || real === undefined) return '';
    return real <= meta ? 'verde' : (real <= meta + 3 ? 'amarillo' : 'rojo');
  }

  function pintar(d) {
    D = d; CLAVE = d.semana.clave;
    document.getElementById('sub').textContent = 'Revisión con jefes de departamento · Semana ' + d.semana.w + ' de ' + d.semana.anio +
      ' · ' + d.semana.ini + ' al ' + d.semana.fin + (d.semana.corta ? ' · semana corta' : '') + ' · calculado ' + d.gen;
    document.getElementById('fuentes').textContent = 'Fuentes: ' + d.fuentes;
    var sel = document.getElementById('sel-semana');
    sel.innerHTML = d.semanas.map(function (s) {
      return '<option value="' + s.clave + '"' + (s.clave === d.semana.clave ? ' selected' : '') + '>S' + s.w + ' · ' + esc(s.ini) + ' al ' + esc(s.fin) + '</option>';
    }).join('');

    var k = d.kpis, pe = d.equilibrio, h = '';
    if (d.notas && d.notas.length) h += '<div class="rp-aviso no-print">' + d.notas.map(esc).join('<br>') + '</div>';

    // ---- 1. la semana
    h += '<section class="rp"><h2>1 · La semana</h2><div class="rp-kpis">' +
      kpi('', 'Ventas', q(k.ventas), num(k.tickets) + ' tickets · ' + num(k.com) + ' comensales' + (k.ventas_dif_pct !== null ? ' · ' + signo(k.ventas_dif_pct) + pct(k.ventas_dif_pct) + ' vs semana anterior' : '')) +
      kpi(k.gasto_pct > 100 ? 'rojo' : '', 'Gasto total', q(k.gasto), pct(k.gasto_pct) + ' sobre ventas') +
      kpi(k.resultado >= 0 ? 'verde' : 'rojo', 'Resultado del período', q(k.resultado), pct(k.resultado_pct) + ' sobre ventas') +
      kpi(k.ticket_dif_pct === null ? '' : (k.ticket_dif_pct >= 0 ? 'verde' : 'rojo'), 'Ticket promedio por comensal', q(k.ticket), k.ticket_ant !== null ? signo(k.ticket_dif_pct) + pct(k.ticket_dif_pct) + ' contra Q' + num(k.ticket_ant) + ' la semana anterior' : '') +
      '</div></section>';

    // ---- 2. cuatro semanas
    var tope = Math.max.apply(null, d.cuatro.map(function (x) { return x.ventas; }).concat([pe ? pe.pe_semana : 0, 1]));
    h += '<section class="rp"><h2>2 · Cuatro semanas: ventas, comensales y ticket</h2>' +
      '<p class="rp-nota">La semana en curso en rojo. La línea punteada es el punto de equilibrio semanal' + (pe ? ' (' + q(pe.pe_semana) + ')' : '') + '.</p>' +
      '<div class="rp-barras">' +
      (pe ? '<div class="rp-pe" style="bottom:' + (pe.pe_semana / tope * 150 + 40) + 'px"><span>equilibrio ' + q(pe.pe_semana) + '</span></div>' : '') +
      d.cuatro.map(function (x) {
        return '<div class="rp-barra' + (x.actual ? ' act' : '') + '"><b>' + q(x.ventas) + '</b><i style="height:' + Math.max(x.ventas / tope * 150, 3) + 'px"></i>' +
          '<span>S' + x.w + '<br>' + num(x.com) + ' com · ' + q(x.tp) + '</span></div>';
      }).join('') + '</div>';
    if (pe) {
      h += '<div class="rp-kpis" style="margin-top:0.9rem">' +
        kpi('', 'Punto de equilibrio semanal', q(pe.pe_semana), 'fijos ' + q(pe.fijo_semana) + ' por semana ÷ margen ' + pct(pe.mc) + ' · ' + esc(pe.base)) +
        kpi(pe.venta_pct >= 100 ? 'verde' : 'rojo', 'Venta de la semana', pct(pe.venta_pct), 'del equilibrio') +
        kpi(pe.brecha >= 0 ? 'verde' : 'rojo', 'Brecha al equilibrio', (pe.brecha >= 0 ? '+' : '−') + q(Math.abs(pe.brecha)), pe.brecha >= 0 ? 'por encima' : 'faltaron para llegar') +
        kpi(pe.semanas_sobre === pe.de ? 'verde' : (pe.semanas_sobre ? 'amarillo' : 'rojo'), 'Semanas sobre equilibrio', pe.semanas_sobre + ' de ' + pe.de, 'últimas ' + pe.de) +
        '</div>';
    }
    h += '</section>';

    // ---- 3. ritmo de la semana
    h += '<section class="rp"><h2>3 · Ritmo de la semana</h2>' +
      '<p class="rp-nota">Venta y comensales por día, comensales que vinieron con reserva y el equilibrio diario (semanal ÷ 7' + (pe ? ' = ' + q(pe.pe_dia) : '') + ').</p>' +
      '<div class="rp-tabla"><table class="rp"><thead><tr><th>Día</th><th>Venta</th><th>Comensales</th><th>Con reserva</th><th>Walk-ins</th><th>Tickets</th><th>Equilibrio diario</th></tr></thead><tbody>' +
      d.dias.map(function (x) {
        return '<tr><td>' + esc(x.dia) + '</td><td class="' + (x.sobre_equilibrio === false ? 'neg' : (x.sobre_equilibrio ? 'pos' : '')) + '">' + q(x.ventas) + '</td><td>' + num(x.com) + '</td>' +
          '<td' + (x.reservas_superan ? ' class="neg"' : '') + '>' + (d.reservas.error ? '—' : num(x.personas) + (x.reservas_superan ? ' *' : '')) + '</td>' +
          '<td>' + (x.walkins === null ? '—' : num(x.walkins)) + '</td><td>' + num(x.tickets) + '</td>' +
          '<td>' + (x.sobre_equilibrio === null ? '—' : (x.sobre_equilibrio ? '✓ sobre' : '✗ bajo')) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      (d.dias.some(function (x) { return x.reservas_superan; }) ? '<p class="rp-nota">* Las personas reservadas superan a los comensales del POS ese día: alguien reservó y no quedó en el POS, o la reserva se contó dos veces.</p>' : '') +
      '</section>';

    // ---- 4. comensales y reservas
    var r = d.reservas;
    h += '<section class="rp"><h2>4 · Comensales y reservas</h2>';
    if (r.error) {
      h += '<div class="rp-error">No se pudieron leer las reservas: ' + esc(r.error) + '</div>';
    } else {
      var estados = Object.keys(r.con_estado || {}).map(function (k) { return esc(k) + ' ' + r.con_estado[k]; }).join(' · ');
      h += '<p class="rp-nota">Estados en la pestaña reservas esta semana: ' + (estados || 'ninguno') + '. Cuentan como canceladas CANCEL, DECLIN y NO SHOW; como sin cerrar, RESERVED.</p>' +
        '<div class="rp-kpis">' +
        kpi('', 'Reservas de la semana', num(r.validas), num(r.personas) + ' personas · ' + num(r.total) + ' recibidas') +
        kpi(r.canceladas_pct > 20 ? 'rojo' : (r.canceladas ? 'amarillo' : 'verde'), 'Canceladas', num(r.canceladas), pct(r.canceladas_pct) + ' · ' + num(r.personas_canceladas) + ' personas perdidas') +
        kpi('', 'Walk-ins', r.walkins === null ? '—' : num(r.walkins), pct(r.walkins_pct) + ' de los comensales') +
        kpi(r.sin_cerrar ? 'amarillo' : 'verde', 'Reservas sin cerrar', num(r.sin_cerrar), 'siguen en RESERVED: el estado sin cerrar rompe el seguimiento post-visita') +
        '</div>' +
        '<div class="rp-tabla"><table class="rp"><thead><tr><th>Día</th><th>Reservas</th><th>Personas</th><th>Comensales POS</th><th>Walk-ins</th><th>Canceladas</th></tr></thead><tbody>' +
        d.dias.map(function (x) {
          return '<tr><td>' + esc(x.dia) + '</td><td>' + num(x.reservas) + '</td><td' + (x.reservas_superan ? ' class="neg"' : '') + '>' + num(x.personas) + (x.reservas_superan ? ' *' : '') + '</td><td>' + num(x.com) + '</td><td>' + (x.walkins === null ? '—' : num(x.walkins)) + '</td><td>' + num(x.canceladas) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    h += '</section>';

    // ---- 5. food cost
    var fc = d.foodcost;
    h += '<section class="rp"><h2>5 · Food cost</h2>' +
      '<p class="rp-nota">Sobre venta sin IVA ni servicio, contra las metas de PARAMETROS: global ' + pct(fc.meta_global, 0) + ', cocina ' + pct(fc.cocina.meta, 0) + ', barra ' + pct(fc.barra.meta, 0) + '. ' + esc(fc.aviso_barra) + '</p>' +
      '<div class="rp-kpis">' +
      kpi(zonaCosto(fc.semana_pct, fc.meta_global), 'Food cost de la semana', pct(fc.semana_pct), 'móvil de 4 semanas: ' + pct(fc.movil4_pct)) +
      kpi(zonaCosto(fc.mes_pct, fc.meta_global), 'Food cost del mes a la fecha', pct(fc.mes_pct), esc(fc.mes_nombre) + (fc.mes ? ' · cocina ' + q(fc.mes.cocina) + ' · barra ' + q(fc.mes.barra) : '')) +
      kpi(fc.cocina.exceso > 0 ? 'rojo' : 'verde', 'Cocina: exceso sobre objetivo', (fc.cocina.exceso > 0 ? '+' : '') + q(fc.cocina.exceso), pct(fc.cocina.real_pct) + ' real contra ' + pct(fc.cocina.meta, 0)) +
      kpi(fc.barra.exceso > 0 ? 'rojo' : 'verde', 'Barra: exceso sobre objetivo', (fc.barra.exceso > 0 ? '+' : '') + q(fc.barra.exceso), pct(fc.barra.real_pct) + ' real contra ' + pct(fc.barra.meta, 0)) +
      '</div>' +
      '<div class="rp-tabla"><table class="rp"><thead><tr><th>Área</th><th>Venta del área</th><th>Costo real</th><th>Costo a objetivo</th><th>Exceso</th><th>Real %</th><th>Objetivo %</th><th>Desvío</th></tr></thead><tbody>' +
      [['Cocina', fc.cocina], ['Barra', fc.barra]].map(function (p) {
        var x = p[1];
        return '<tr><td>' + p[0] + '</td><td>' + q(x.venta) + '</td><td>' + q(x.costo) + '</td><td>' + q(x.a_meta) + '</td><td class="' + (x.exceso > 0 ? 'neg' : 'pos') + '">' + (x.exceso > 0 ? '+' : '') + q(x.exceso) + '</td><td>' + pct(x.real_pct) + '</td><td>' + pct(x.meta, 0) + '</td><td class="' + (x.desvio_pts > 0 ? 'neg' : 'pos') + '">' + (x.desvio_pts === null ? '—' : signo(x.desvio_pts) + x.desvio_pts + ' pp') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="rp-nota">Mix de ventas: cocina ' + pct(d.areas.mix_cocina) + ' · barra ' + pct(d.areas.mix_cocina === null ? null : 100 - d.areas.mix_cocina) + '. ' + esc(d.areas.nota) + '</p>' +
      '</section>';

    // ---- 6. cocina y barra
    function bloqueArea(nombre, a) {
      var tabla = a.top.length ? '<div class="rp-tabla"><table class="rp"><thead><tr><th>Producto</th><th>Unidades</th><th>Venta</th><th>% del área</th></tr></thead><tbody>' +
        a.top.map(function (p) { return '<tr' + (p.otros ? ' style="opacity:0.7"' : '') + '><td class="txt">' + esc(p.nombre) + '</td><td>' + num(p.uds) + '</td><td>' + q(p.venta) + '</td><td>' + pct(p.pct) + '</td></tr>'; }).join('') +
        '<tr class="total"><td>Total ' + nombre.toLowerCase() + '</td><td>' + num(a.uds) + '</td><td>' + q(a.venta) + '</td><td>100%</td></tr></tbody></table></div>'
        : '<div class="rp-aviso">Sin ventas por plato cargadas para esta semana.</div>';
      return '<div><h3 style="margin:0.6rem 0 0.4rem">' + nombre + '</h3><div class="rp-kpis">' +
        kpi('', 'Venta del área', q(a.venta), pct(a.venta_pct) + ' de la venta de la semana') +
        kpi('', 'Costo del área', q(a.costo), 'compra de la semana (motor de Finanzas)') +
        kpi(zonaCosto(a.costo_pct, nombre === 'Cocina' ? d.metas.food_cocina : d.metas.food_barra), 'Costo / venta', pct(a.costo_pct), 'objetivo ' + pct(nombre === 'Cocina' ? d.metas.food_cocina : d.metas.food_barra, 0)) +
        kpi(a.margen >= 0 ? 'verde' : 'rojo', 'Margen bruto', q(a.margen), pct(a.margen_pct) + ' del área') +
        '</div>' + tabla + '</div>';
    }
    h += '<section class="rp"><h2>6 · Cocina y Barra</h2>' + (d.areas.error ? '<div class="rp-error">' + esc(d.areas.error) + '</div>' : '') +
      '<div class="rp-dos">' + bloqueArea('Cocina', d.areas.cocina) + bloqueArea('Barra', d.areas.barra) + '</div></section>';

    // ---- 7. personal y P&L
    var pl = d.pl, pe2 = d.personal, pm = pe2.planilla_mes;
    h += '<section class="rp"><h2>7 · Personal y P&amp;L semanal</h2>' +
      '<div class="rp-kpis">' +
      kpi(pe2.prime < 60 ? 'verde' : (pe2.prime <= 65 ? 'amarillo' : 'rojo'), 'Prime cost', pct(pe2.prime), 'móvil de 4: ' + pct(pe2.prime_m4)) +
      kpi('', 'Nómina devengada de la semana', q(pe2.labor_semana), pct(pe2.labor_pct) + ' de la venta · planilla del mes ÷ 4.345') +
      kpi('', 'Sueldos fijos del mes', pm ? q(pm.fija) : '—', pm ? ('planilla ' + esc(pm.desde) + (pm.origen === 'estimada' ? ' (estimada)' : '')) : 'sin planilla') +
      kpi('', 'Personal extra del mes', pm ? q(pm.extra) : '—', pm ? ('cocina ' + q(pm.extra_cocina) + ' · barra y sala ' + q(pm.extra_barra) + ' · ' + num(pm.n_extra) + ' personas') : '') +
      '</div><p class="rp-nota">' + esc(pe2.nota) + '</p>' +
      '<div class="rp-tabla"><table class="rp"><thead><tr><th>Concepto</th><th>Monto</th><th>% del gasto</th><th>% de ventas</th></tr></thead><tbody>';
    function fila(nombre, monto, cls) {
      return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td class="txt">' + esc(nombre) + '</td><td>' + q(monto) + '</td><td>' + (pl.gasto ? pct(monto / pl.gasto * 100) : '—') + '</td><td>' + (pl.ventas ? pct(monto / pl.ventas * 100) : '—') + '</td></tr>';
    }
    h += fila('Mercadería cocina (alimentos, con y sin factura)', pl.cogs_cocina) + fila('Mercadería barra (bebidas, coctelería, licores)', pl.cogs_barra) + fila('COGS total', pl.cogs, 'total') +
      fila('Nómina devengada', pl.labor) +
      pl.secciones.map(function (s) { return fila(s.seccion, s.q); }).join('') +
      fila('GASTO TOTAL', pl.gasto, 'total') +
      '<tr class="total"><td class="txt">Resultado</td><td class="' + (pl.resultado >= 0 ? 'pos' : 'neg') + '">' + q(pl.resultado) + '</td><td></td><td>' + pct(pl.resultado_pct) + '</td></tr>' +
      '</tbody></table></div>' +
      '<p class="rp-nota">' + esc(pl.nota_nomina) + ' Marketing va incluido (' + q(pl.marketing) + '); sin marketing el resultado sería ' + q(pl.resultado_sin_marketing) + '.</p></section>';

    // ---- 8. equilibrio y acciones
    h += '<section class="rp"><h2>8 · Cómo se construye el equilibrio, y las acciones</h2>';
    if (pe) {
      h += '<div class="rp-dos"><div><div class="rp-tabla"><table class="rp"><thead><tr><th>Costos fijos (PRESUPUESTO)</th><th>Al mes</th></tr></thead><tbody>' +
        pe.fijos.map(function (f) { return '<tr><td class="txt">' + esc(f.seccion) + (f.del_mes ? ' <span class="rp-chip">del mes</span>' : '') + '</td><td>' + q(f.mensual) + '</td></tr>'; }).join('') +
        '<tr class="total"><td class="txt">Fijos del mes</td><td>' + q(pe.fijo_mes) + '</td></tr>' +
        '<tr class="total"><td class="txt">Fijos por semana (÷ 4.345)</td><td>' + q(pe.fijo_semana) + '</td></tr></tbody></table></div></div>' +
        '<div><div class="rp-tabla"><table class="rp"><thead><tr><th>Variables, % de la venta</th><th></th></tr></thead><tbody>' +
        pe.variables.map(function (x) { return '<tr><td class="txt">' + esc(x.seccion) + '</td><td>' + pct(x.pct) + '</td></tr>'; }).join('') +
        '<tr><td class="txt">Total variable</td><td>' + pct(pe.variables_pct) + '</td></tr>' +
        '<tr><td class="txt">Margen de contribución</td><td>' + pct(pe.mc) + '</td></tr>' +
        '<tr class="total"><td class="txt">Punto de equilibrio</td><td>' + q(pe.pe_semana) + ' / semana · ' + q(pe.pe_dia) + ' / día</td></tr></tbody></table></div>' +
        '<p class="rp-nota">' + esc(pe.nota) + (pe.motor ? ' Referencia del motor: ' + esc(pe.motor.mes) + ' fijo ' + q(pe.motor.fijo_mes) + ', margen ' + pct(pe.motor.mc) + ', equilibrio ' + q(pe.motor.pe_semana) + ' por semana.' : '') + '</p></div></div>';
    }
    h += '<h3 style="margin:1.2rem 0 0.3rem">Acciones de la semana</h3>';
    var ac = d.acciones;
    if (!ac.existe) h += '<div class="rp-aviso">La pestaña REPORTE_ACCIONES del Sheet de config todavía no existe: se crea sola al guardar la primera acción.</div>';
    h += '<div class="rp-tabla"><table class="rp"><thead><tr><th>Acción</th><th>Responsable</th><th>Por qué (el dato)</th><th class="no-print"></th></tr></thead><tbody id="acciones">' +
      (ac.lista.length ? ac.lista.map(filaAccion).join('') : '<tr><td class="txt" colspan="4" style="opacity:0.7">Sin acciones escritas para esta semana.</td></tr>') +
      '</tbody></table></div>' +
      '<div class="rp-form no-print"><div class="fila"><div><label>Acción</label><input id="ac-accion" placeholder="Qué se hace distinto la semana que viene"></div>' +
      '<div><label>Responsable</label><select id="ac-resp">' + d.departamentos.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select></div></div>' +
      '<label>Por qué</label><textarea id="ac-porque" placeholder="El dato que respalda la acción: el número, la semana, el desvío"></textarea>' +
      '<div style="margin-top:0.7rem;display:flex;gap:0.6rem;align-items:center"><button class="rp-boton lleno" id="ac-guardar" type="button">Guardar acción</button><span id="ac-msg" style="font-size:0.82rem;color:#52514e"></span></div></div>' +
      '</section>';

    document.getElementById('todo').innerHTML = h;
    document.getElementById('todo').hidden = false;
    document.getElementById('cargando').hidden = true;
    document.getElementById('ac-guardar').addEventListener('click', guardarAccion);
    document.querySelectorAll('.ac-borrar').forEach(function (b) { b.addEventListener('click', function () { borrarAccion(b.dataset.fila); }); });
  }

  function filaAccion(a) {
    return '<tr><td class="txt"><b>' + esc(a.accion) + '</b></td><td>' + esc(a.responsable) + '</td><td class="txt">' + esc(a.porque) + '</td>' +
      '<td class="no-print"><button class="rp-boton ac-borrar" data-fila="' + a.fila + '" type="button" title="Borrar">×</button></td></tr>';
  }

  function guardarAccion() {
    var msg = document.getElementById('ac-msg');
    msg.textContent = 'Guardando…';
    google.script.run
      .withSuccessHandler(function (ac) {
        msg.textContent = 'Guardada.';
        document.getElementById('ac-accion').value = ''; document.getElementById('ac-porque').value = '';
        document.getElementById('acciones').innerHTML = ac.lista.map(filaAccion).join('');
        document.querySelectorAll('.ac-borrar').forEach(function (b) { b.addEventListener('click', function () { borrarAccion(b.dataset.fila); }); });
      })
      .withFailureHandler(function (e) { msg.textContent = String(e && e.message || e); })
      .guardarAccionReporte(AUTH, { clave: CLAVE, accion: document.getElementById('ac-accion').value,
                                    responsable: document.getElementById('ac-resp').value, porque: document.getElementById('ac-porque').value });
  }
  function borrarAccion(fila) {
    if (!window.confirm('¿Borrar esta acción?')) return;
    google.script.run
      .withSuccessHandler(function (ac) {
        document.getElementById('acciones').innerHTML = ac.lista.length ? ac.lista.map(filaAccion).join('') : '<tr><td class="txt" colspan="4" style="opacity:0.7">Sin acciones escritas para esta semana.</td></tr>';
        document.querySelectorAll('.ac-borrar').forEach(function (b) { b.addEventListener('click', function () { borrarAccion(b.dataset.fila); }); });
      })
      .withFailureHandler(function (e) { window.alert(String(e && e.message || e)); })
      .borrarAccionReporte(AUTH, Number(fila));
  }

  function cargar(clave, forzar) {
    document.getElementById('cargando').hidden = false;
    document.getElementById('todo').hidden = true;
    document.getElementById('error').hidden = true;
    var run = google.script.run
      .withSuccessHandler(pintar)
      .withFailureHandler(function (e) {
        document.getElementById('cargando').hidden = true;
        var el = document.getElementById('error');
        el.textContent = String(e && e.message || e); el.hidden = false;
      });
    if (forzar) run.refrescarReporteSemanal(AUTH, clave || 0); else run.getReporteSemanal(AUTH, clave || 0);
  }

  document.getElementById('sel-semana').addEventListener('change', function () { cargar(Number(this.value), false); });
  document.getElementById('btn-actualizar').addEventListener('click', function () { cargar(CLAVE, true); });
  document.getElementById('btn-imprimir').addEventListener('click', function () { window.print(); });
  cargar(0, false);
})();
</script>
</body>
</html>
