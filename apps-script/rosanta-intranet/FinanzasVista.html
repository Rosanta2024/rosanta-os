<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <?!= include('Estilos') ?>
  <?!= include('Logo') ?>
  <?!= incluirCrudo_('LecturaEstilo') ?>
  <style>
    /* "Como vamos" · Pilar 3, Finance & Data OS.
       Es para decidir el lunes: la semana contra su meta, el mes contra el suyo,
       la caja. Solo lectura desde la limpieza del 28-sep-2026 (sin bloque RAA).

       Hasta el 22-sep-2026 esta pantalla se llamaba "La semana" y cinco de sus
       siete secciones eran del AÑO: abria con la venta acumulada de 2026 y once
       bloques de gasto contra la banda del sector, y lo de la semana estaba en
       la posicion 5 de 7. El analisis anual se fue a "El gasto"
       (FinanzasGastoVista) y el P&L mensual a "Mes a mes" (ComparativoVista). */
    main.fin { max-width: 1140px; }
    .fin-barra-sup { display: flex; align-items: baseline; justify-content: space-between;
      flex-wrap: wrap; gap: 0.75rem; }
    .fin-sub { font-size: 0.9rem; opacity: 0.75; margin-top: 0.3rem; }
    .fin-boton { background: transparent; color: var(--verde-bosque);
      border: 1px solid rgba(78,109,90,0.35); border-radius: 999px;
      padding: 0.45rem 1rem; font-size: 0.82rem; cursor: pointer;
      font-family: 'Lato', Arial, sans-serif; }
    .fin-boton:hover { background: rgba(78,109,90,0.07); }
    .fin-boton:disabled { opacity: 0.55; cursor: progress; }

    /* --- la cinta de KPIs: la semana, el mes y la caja ---
       Reemplaza a la cinta del año. minmax(150px,1fr) da 5 columnas en
       escritorio y 2 en un telefono de 375px, sin media query. */
    .fin-kpis { background: var(--verde-bosque); color: var(--blanco);
      border-radius: 20px; padding: 1.35rem 1.5rem; margin-top: 1.25rem;
      display: grid; gap: 1rem 1.25rem;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .fin-kpis .u { border-left: 1px solid rgba(255,255,255,0.18); padding-left: 1.1rem; }
    .fin-kpis .u:first-child { border-left: 0; padding-left: 0; }
    /* 0.85 y no 0.68: con el verde bosque vigente (#4E6D5A) el blanco al 68%
       daba 3.6:1 de contraste sobre 11px, y al 78% daba 4.2:1 sobre 12px. El
       minimo legible para texto chico es 4.5:1, que se alcanza desde 0.83. */
    .fin-kpis .t { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.09em;
      opacity: 0.85; }
    .fin-kpis .n { font-family: 'Playfair Display', Georgia, serif; font-size: 1.8rem;
      line-height: 1.15; margin-top: 0.15rem; }
    .fin-kpis .c { font-size: 0.76rem; opacity: 0.85; line-height: 1.4; margin-top: 0.25rem; }
    .fin-kpis .mal { color: #FFB4A2; }
    .fin-kpis .bien { color: #BFE8CE; }
    @media (max-width: 560px) {
      /* Dos columnas fijas, con la venta de la semana ocupando la fila entera:
         es el titular. auto-fit con minmax(150px) caia en UNA columna —por 4px—
         y la cinta se comia la pantalla entera del telefono, dejando "Que hay
         que responder" fuera de vista.
         El borde izquierdo se apaga: en 2 columnas queda colgando al medio. */
      .fin-kpis { padding: 1.1rem 1.15rem; gap: 1rem 1.1rem;
        grid-template-columns: 1fr 1fr; }
      .fin-kpis .u { border-left: 0; padding-left: 0; }
      .fin-kpis .n { font-size: 1.5rem; }
      .fin-kpis .u:first-child .n { font-size: 1.9rem; }
      .fin-kpis .c { font-size: 0.72rem; }
    }

    .fin-seccion { margin-top: 2.2rem; }
    .fin-seccion > h2 { font-size: 1.25rem; margin-bottom: 0.2rem; }
    .fin-nota { font-size: 0.84rem; opacity: 0.72; margin-bottom: 1rem; line-height: 1.55;
      max-width: 78ch; }
    /* Las notas largas de metodo estorban al que ya las leyo. Van plegadas. */
    .fin-ayuda { font-size: 0.82rem; opacity: 0.72; line-height: 1.55; max-width: 78ch;
      margin-bottom: 1rem; }
    .fin-ayuda summary { cursor: pointer; opacity: 0.85; }
    .fin-ayuda p { margin-top: 0.45rem; }

    /* --- tarjetas de semaforo --- */
    .fin-semaforos { display: grid; gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(228px, 1fr)); }
    .fin-card { background: var(--blanco); border-radius: 20px; padding: 1.2rem 1.35rem;
      box-shadow: 0 2px 10px rgba(26,26,26,0.06); border-top: 6px solid var(--verde-medio); }
    .fin-card.amarillo { border-top-color: #E0A93B; }
    .fin-card.rojo { border-top-color: #C4553B; }
    .fin-card.gris { border-top-color: #BDBDBD; }
    .fin-card h3 { font-size: 0.95rem; display: flex; align-items: center; gap: 0.45rem; }
    .punto { width: 9px; height: 9px; border-radius: 50%; background: var(--verde-medio);
      display: inline-block; flex: none; }
    .amarillo .punto { background: #E0A93B; }
    .rojo .punto { background: #C4553B; }
    .gris .punto { background: #BDBDBD; }
    .fin-valor { font-family: 'Playfair Display', Georgia, serif; font-size: 2.3rem;
      line-height: 1.1; margin: 0.5rem 0 0.15rem; }
    .fin-meta { font-size: 0.82rem; opacity: 0.7; }
    .fin-cruda { font-size: 0.76rem; opacity: 0.6; margin-top: 0.55rem;
      padding-top: 0.55rem; border-top: 1px solid rgba(26,26,26,0.08); }

    /* --- tablas --- */
    table.fin { width: 100%; border-collapse: collapse; background: var(--blanco);
      border-radius: 16px; overflow: hidden; box-shadow: 0 2px 10px rgba(26,26,26,0.06);
      font-size: 0.86rem; }
    table.fin th, table.fin td { padding: 0.55rem 0.7rem; text-align: right;
      border-bottom: 1px solid rgba(26,26,26,0.06); white-space: nowrap; }
    table.fin th { background: var(--verde-bosque); color: var(--blanco); font-weight: 600;
      font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.05em; }
    table.fin th:first-child, table.fin td:first-child { text-align: left; }
    table.fin tr:last-child td { border-bottom: 0; }
    table.fin tr.actual td { background: rgba(87,167,127,0.09); font-weight: 700; }
    table.fin tr.total td { background: rgba(78,109,90,0.07); font-weight: 700; }
    .tabla-scroll { overflow-x: auto; }
    td.v { color: #2E7D52; } td.a { color: #A97514; } td.r { color: #C4553B; }
    /* Columnas de detalle: se esconden en el telefono, donde 9 columnas con
       nowrap obligaban a arrastrar la tabla a ciegas. El boton las devuelve. */
    .th-corta { display: none; }
    @media (max-width: 720px) {
      table.fin.compacta th.det, table.fin.compacta td.det { display: none; }
      /* Esconder 4 columnas no alcanzaba: las 5 que quedan median 477px en una
         pantalla de 375. Se aprieta el relleno, baja la tipografia y los
         encabezados largos cambian por su version corta. */
      table.fin.compacta { font-size: 0.78rem; }
      table.fin.compacta th, table.fin.compacta td { padding: 0.45rem 0.35rem; }
      table.fin.compacta .th-larga { display: none; }
      table.fin.compacta .th-corta { display: inline; }
    }
    .tabla-pie { display: flex; justify-content: flex-end; margin-top: 0.5rem; }
    .tabla-pie .fin-boton { font-size: 0.76rem; padding: 0.3rem 0.8rem; }
    @media (min-width: 721px) { .tabla-pie { display: none; } }

    .fin-cargando { padding: 3.5rem 0; text-align: center; opacity: 0.6; }
    .fin-error { background: #F6E4DF; border-radius: 14px; padding: 1rem 1.2rem;
      font-size: 0.9rem; line-height: 1.5; }
  </style>
</head>
<body>
  <!-- Dentro del shell de Finanzas (?embed=1) se oculta la barra ENTERA, no solo el
       boton "Panel principal": el shell ya trae la suya con el nombre y la salida, y
       repetirla apilaba dos barras verdes (12-sep-2026). Code.gs manda mostrarVolver en
       false cuando la pagina viene embebida. Abierta directo, se ve igual que siempre. -->
  <? if (mostrarVolver) { ?>
  <header class="app">
    <div class="marca">
      <span class="logo" role="img" aria-label="Rosanta"></span>
      <span class="sec">Finanzas</span>
    </div>
    <div class="quien">
      <span><?= usuario.nombre || usuario.email ?></span>
      <a class="volver" href="<?= urlBase ?><?= authToken ? '?u=' + authToken : '' ?>">Panel principal</a>
    </div>
  </header>
  <? } ?>

  <main class="fin">
    <div class="fin-barra-sup">
      <div>
        <h1>Cómo vamos</h1>
        <p class="fin-sub" id="sub">Cargando…</p>
      </div>
      <button class="fin-boton" id="btn-refrescar">Actualizar datos</button>
    </div>

    <!-- Sistema de Medicion (27-sep-2026): el pilar leido como el reporte semanal, arriba. -->
    <div id="lx-modulo" style="margin-bottom:1.2rem"></div>
    <div id="cargando" class="fin-cargando">Leyendo el maestro…</div>

    <div id="todo" style="display:none">
      <div class="fin-kpis" id="kpis"></div>
      <!-- Limpieza del 28-sep-2026 (Juanma): fuera la tira de integridad (vive en El gasto), el bloque RAA
           (las acciones viven en una sola lista: "Qué hacemos esta semana") y los semáforos de food y prime
           (el food cost es de Profit OS; el prime cost está en las palancas de arriba). -->

      <section class="fin-seccion">
        <h2>Semana por semana</h2>
        <div class="tabla-scroll">
          <table class="fin compacta" id="tabla-sem-caja">
            <thead><tr>
              <th>Semana</th>
              <th><span class="th-larga">Ventas netas</span><span class="th-corta">Ventas</span></th>
              <th>Δ</th>
              <th class="det">Comensales</th><th class="det">Ticket</th>
              <th class="det">Food cruda</th>
              <th><span class="th-larga">Food móvil 4</span><span class="th-corta">Food m4</span></th>
              <th class="det">Prime móvil 4</th><th>Caja</th>
            </tr></thead>
            <tbody id="tabla-sem"></tbody>
          </table>
        </div>
        <div class="tabla-pie">
          <button class="fin-boton" id="btn-columnas">Ver todas las columnas</button>
        </div>
      </section>
    </div>
  </main>

<script>
  /* El token va como PRIMER argumento en TODA llamada a google.script.run: doGet
     resolvio la identidad al abrir la pagina, pero cada llamada es una peticion
     nueva y el servidor la vuelve a resolver. Si agregas una llamada, pasale AUTH. */
  var AUTH = '<?= authToken ?>';
  var D = null;
  var M = null;      // getMetasData: la meta del mes y la de cada semana

  function q(n, dec) {
    var d = dec === undefined ? 0 : dec;
    return 'Q' + Number(n || 0).toLocaleString('es-GT',
      { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function pct(n) { return (n === null || n === undefined) ? '—' : Number(n).toFixed(1) + '%'; }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function nombreHoja(h) { return h.replace(/^[0-9]+[a-z]?_/, '').replace(/_/g, ' '); }

  // Seccion 5 de la especificacion. El semaforo va sobre la movil de 4.
  function zona(ind, v, meta) {
    if (v === null || v === undefined) return 'gris';
    if (ind === 'food')   return v <= meta ? 'verde' : (v <= meta + 3 ? 'amarillo' : 'rojo');
    if (ind === 'prime')  return v < 60 ? 'verde' : (v <= 65 ? 'amarillo' : 'rojo');
    if (ind === 'caja')   return v >= 21 ? 'verde' : (v >= 7 ? 'amarillo' : 'rojo');
    if (ind === 'ventas') return v >= 0 ? 'verde' : (v >= -10 ? 'amarillo' : 'rojo');
    return 'gris';
  }
  function letra(z) {
    return z === 'verde' ? 'v' : (z === 'amarillo' ? 'a' : (z === 'rojo' ? 'r' : ''));
  }

  /* ------------------------------------------------------------ la cinta */

  function unidad(t, n, c, clase) {
    return '<div class="u"><div class="t">' + t + '</div>' +
           '<div class="n' + (clase ? ' ' + clase : '') + '">' + n + '</div>' +
           (c ? '<div class="c">' + c + '</div>' : '') + '</div>';
  }

  /* La meta de la semana y el ritmo del mes salen de getMetasData, que es el
     mismo motor de la pestaña Metas: no hay un segundo calculo que se pueda
     desincronizar. Si esa llamada falla, la cinta se dibuja igual con lo que
     hay (venta, delta y caja) y las dos celdas de meta dicen que no se pudo. */
  function pintarKpis() {
    var t = D.total, u = D.ultima || {};
    var semMeta = null;
    if (M && M.semanas) {
      M.semanas.forEach(function (s) { if (s.w === u.w) semMeta = s; });
    }

    var html = '';

    // 1) la venta de la semana contra su meta
    if (semMeta && semMeta.meta_hoy) {
      var cumple = semMeta.cumple;
      html += unidad('Venta de la semana', q(u.ventas),
        pct(cumple) + ' de su meta · ' +
        (semMeta.dif >= 0 ? 'Q' + Math.abs(semMeta.dif).toLocaleString('es-GT') + ' arriba'
                          : 'faltaron ' + q(Math.abs(semMeta.dif))),
        cumple >= 100 ? 'bien' : (cumple >= 90 ? '' : 'mal'));
    } else {
      html += unidad('Venta de la semana', q(u.ventas),
        M && M.sin_meta ? 'sin meta cargada para el mes' : 'meta de la semana no disponible');
    }

    // 3) el acumulado del mes contra la meta del mes
    if (M && !M.sin_meta && M.meta) {
      html += unidad('Acumulado de ' + esc(M.mes), q(M.acumulado),
        pct(M.avance) + ' de ' + q(M.meta.venta) + ' · ' +
          M.dias.corridos + ' de ' + M.dias.total + ' días',
        M.avance >= 100 ? 'bien' : '');
    } else {
      html += unidad('Acumulado del mes', M ? q(M.acumulado) : '—',
        M && M.sin_meta ? 'sin meta cargada' : 'no disponible');
    }

    // Limpieza del 28-sep-2026: fuera "Contra la semana anterior" (está en La semana), "Ritmo del mes"
    // (está en Metas) y "Caja" (es el número principal de la lectura de arriba).

    document.getElementById('kpis').innerHTML = html;
  }

  /* ------------------------------------------------------------ la vista */

  function pintar(d) {
    D = d;
    var u = d.ultima || {};
    document.getElementById('sub').textContent =
      (u.w ? 'Semana S' + u.w + ' · ' + u.ini + ' al ' + u.fin : 'Sin semana cerrada') +
      ' · año ' + d.anio;

    pintarKpis();

    // ---- semana por semana
    document.getElementById('tabla-sem').innerHTML =
      d.semanas.slice(-13).reverse().map(function (s) {
        return '<tr' + (s.w === u.w ? ' class="actual"' : '') + '>' +
          '<td>S' + s.w + ' · ' + s.ini + '</td>' +
          '<td>' + q(s.ventas) + '</td>' +
          '<td class="' + letra(zona('ventas', s.dv)) + '">' +
            (s.dv === undefined ? '—' : (s.dv >= 0 ? '+' : '') + pct(s.dv)) + '</td>' +
          '<td class="det">' + s.com + '</td><td class="det">' + q(s.tp) + '</td>' +
          '<td class="det" style="opacity:.55">' + pct(s.cogsp) + '</td>' +
          '<td class="' + letra(zona('food', s.cogs_m4, d.meta_cogs)) + '">' + pct(s.cogs_m4) + '</td>' +
          '<td class="det ' + letra(zona('prime', s.prime_m4)) + '">' + pct(s.prime_m4) + '</td>' +
          '<td>' + q(s.caja) + '</td></tr>';
      }).join('');

    document.getElementById('cargando').style.display = 'none';
    document.getElementById('todo').style.display = '';
  }

  // El aviso de "Leyendo el maestro…" queda DEBAJO de la lectura, fuera de la pantalla:
  // al apretar Actualizar no se veia nada (Juanma, 8-oct-2026). Ahora avisa el boton
  // y, al terminar, la lectura de arriba se vuelve a pedir con los datos nuevos.
  function cargar(forzar) {
    document.getElementById('todo').style.display = 'none';
    var c = document.getElementById('cargando');
    c.style.display = ''; c.textContent = 'Leyendo el maestro…';
    var btn = document.getElementById('btn-refrescar'), lx = document.getElementById('lx-modulo');
    var fin = function () { btn.disabled = false; btn.textContent = 'Actualizar datos'; if (lx) lx.style.opacity = ''; };
    if (forzar) { btn.disabled = true; btn.textContent = 'Actualizando…'; if (lx) lx.style.opacity = '0.45'; }
    var run = google.script.run
      .withSuccessHandler(function (d) {
        pintar(d); cargarMetas(forzar);
        if (forzar && window.cargarLecturaFin) window.cargarLecturaFin(fin); else fin();
      })
      .withFailureHandler(function (e) {
        fin();
        c.innerHTML = '<div class="fin-error">No se pudo leer el maestro.<br>' +
          esc(e && e.message ? e.message : e) + '</div>';
      });
    if (forzar) run.refrescarFinanzas(AUTH); else run.getFinanzasData(AUTH, false);
  }

  /* La meta llega despues que el resto: la cinta ya se dibujo con lo que hay y
     aca se vuelve a dibujar con las dos celdas de meta completas. Si falla, la
     pantalla NO se rompe; las celdas quedan diciendo que no se pudo. */
  function cargarMetas(forzar) {
    google.script.run
      .withSuccessHandler(function (m) { M = m; if (D) pintarKpis(); })
      .withFailureHandler(function () { M = { error: true }; if (D) pintarKpis(); })
      .getMetasData(AUTH, !!forzar);
  }

  document.getElementById('btn-refrescar').addEventListener('click', function () { cargar(true); });
  document.getElementById('btn-columnas').addEventListener('click', function () {
    var t = document.getElementById('tabla-sem-caja');
    var compacta = t.classList.toggle('compacta');
    this.textContent = compacta ? 'Ver todas las columnas' : 'Ver solo lo esencial';
  });
  cargar(false);
</script>
<?!= incluirCrudo_('LecturaJs') ?>
<script>
  window.cargarLecturaFin = function (listo) {
    var host = document.getElementById('lx-modulo');
    listo = listo || function () {};
    if (!host || !window.LECTURA) { listo(); return; }
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.lectura) { host.innerHTML = ''; host.style.display = ''; window.LECTURA.pintar(host, r.lectura, {}); }
        else host.style.display = 'none';
        listo();
      })
      .withFailureHandler(function () { listo(); })
      .getLecturaPilar(AUTH, 'finanzas');
  };
  window.cargarLecturaFin();
</script>
</body>
</html>
