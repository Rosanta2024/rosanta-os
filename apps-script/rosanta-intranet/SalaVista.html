<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <?!= include('Estilos') ?>
  <?!= include('Logo') ?>
  <?!= incluirCrudo_('LecturaEstilo') ?>
  <style>
    /* Sala (27-sep-2026, Sistema de Medicion): el numero de José y lo que tiene que hacer hoy. */
    .sl-mio { background: #fff; border: 2px solid var(--lila); border-radius: 18px; padding: 1rem 1.2rem; display: flex; flex-wrap: wrap; gap: 0.6rem 1.8rem; margin: 1rem 0; }
    .sl-i { display: flex; flex-direction: column; min-width: 8rem; }
    .sl-i b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
    .sl-i span { font-size: 0.76rem; color: #52514e; line-height: 1.35; }
    .sl-dos { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1rem; }
    .sl-box { background: #fff; border-radius: 18px; padding: 1rem 1.2rem; box-shadow: 0 2px 10px rgba(26,26,26,0.06); }
    .sl-box h3 { margin-bottom: 0.5rem; }
    .sl-box table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    .sl-box td, .sl-box th { padding: 0.45rem 0.3rem; border-bottom: 1px solid rgba(26,26,26,0.08); text-align: left; vertical-align: top; }
    .sl-box th { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8780; }
    .sl-box a.b { display: inline-block; border: 1px solid rgba(78,109,90,0.35); color: var(--verde-bosque); border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.78rem; text-decoration: none; white-space: nowrap; }
    .sl-p { display: inline-block; font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.15rem 0.5rem; border-radius: 999px; background: #FBF3E2; color: #8a6420; }
    .sl-p.r { background: #F6E4DF; color: #A33A2A; }
    .sl-big { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sl-nota { font-size: 0.8rem; color: #52514e; line-height: 1.5; margin-top: 0.5rem; }
    .sl-cargando { padding: 2rem 0; text-align: center; opacity: 0.6; }
    .sl-aviso { background: #FBF3E2; border-radius: 12px; padding: 0.6rem 0.9rem; font-size: 0.84rem; margin-top: 0.8rem; }
    @media (max-width: 760px) { .sl-dos { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="app">
    <div class="marca"><span class="logo" role="img" aria-label="Rosanta"></span><span class="sec">Sala</span></div>
    <div class="quien"><span><?= usuario.nombre || usuario.email ?></span>
      <a class="volver" href="<?= urlBase ?><?= authToken ? '?u=' + authToken : '' ?>">Panel principal</a></div>
  </header>
  <main>
    <h1>Sala</h1>
    <p style="font-size:0.9rem;opacity:0.8">Tu número es el ticket por comensal. Lo mueven la ocupación de lunes a miércoles, las reseñas y las mesas bien cerradas en Wix.</p>
    <div id="lx-modulo" style="margin:1rem 0 1.2rem"></div>
    <div id="sl"><div class="sl-cargando">Leyendo tus números, las reservas y las reseñas…</div></div>
  </main>
<script>
(function () {
  var AUTH = '<?= authToken ?>';
  var COL = { verde: '#2E6B3F', amarillo: '#C89A3C', rojo: '#A33A2A' };
  function esc(x) { return String(x === null || x === undefined ? '' : x).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function filas(lista, wix, etiqueta, rojo) {
    return lista.map(function (x) {
      return '<tr><td>' + esc(x.fecha) + '</td><td>' + esc(x.nombre) + '</td><td>' + esc(x.personas) + '</td><td><span class="sl-p' + (rojo ? ' r' : '') + '">' + esc(etiqueta) + '</span></td>' +
             '<td>' + (x.id ? '<a class="b" href="' + esc(wix + x.id) + '" target="_blank" rel="noopener">Abrir en Wix</a>' : '') + '</td></tr>';
    }).join('');
  }
  google.script.run
    .withSuccessHandler(function (r) {
      var h = '';
      var S = r.semana || {};
      /* el numero y las palancas ya los pinta la lectura de arriba (LecturaJs) */
      var M = r.mesas || { falta_consumo: [], sin_cerrar: [] };
      var n = M.falta_consumo.length + M.sin_cerrar.length;
      h += '<div class="sl-dos"><div class="sl-box"><h3>Mesas por cerrar en Wix (' + n + ')</h3>';
      if (!n) h += '<p>Todas las mesas de los últimos 7 días están cerradas. Así el CAC se puede medir.</p>';
      else h += '<table><tr><th>Fecha</th><th>Nombre</th><th>Pers.</th><th>Falta</th><th></th></tr>' +
        filas(M.falta_consumo, M.wix, 'poner consumo', false) + filas(M.sin_cerrar, M.wix, 'sigue en Reserved', true) + '</table>';
      h += '<p class="sl-nota">Del ' + esc(M.desde || '') + ' al ' + esc(M.hasta || '') + '. Al sentar la mesa: Seated. Al terminar: el total en "Consumo total de la mesa (Q)" y se deja en Seated. Finished solo para pedir la reseña. No-show solo si de verdad no llegó.</p></div>';
      var R = r.resenas || {};
      h += '<div class="sl-box"><h3>Reseñas de Google</h3><div class="sl-big">' + esc(R.esta_semana === undefined ? '—' : R.esta_semana) +
        ' <span style="font-size:0.95rem;font-weight:400;color:#52514e">esta semana · meta ' + esc(r.meta_resenas) + '</span></div>' +
        '<p class="sl-nota">La semana pasada: ' + esc(R.semana_pasada === undefined ? '—' : R.semana_pasada) + ' · promedio de 4 semanas: ' + esc(R.prom_4 === undefined ? '—' : R.prom_4) +
        (R.estrellas_4 ? ' · ' + esc(R.estrellas_4) + '★' : '') + '. Se cuentan solas desde el bot de reseñas.</p>';
      var P = r.semana_pos || {};
      h += '<h3 style="margin-top:1rem">Para el huddle</h3><table><tr><td>Última semana cargada</td><td>S' + esc(P.w) + ' · ' + esc(P.ini) + ' al ' + esc(P.fin) + '</td></tr>' +
        '<tr><td>Comensales</td><td>' + esc(P.com) + '</td></tr><tr><td>Ticket por comensal (sin IVA)</td><td>Q' + esc(P.tp) + '</td></tr></table>' +
        '<p class="sl-nota">El POS se carga los lunes (último día cargado: ' + esc(r.pos_al || '?') + ').</p></div></div>';
      if (r.avisos && r.avisos.length) h += '<div class="sl-aviso">' + r.avisos.map(esc).join('<br>') + '</div>';
      document.getElementById('sl').innerHTML = h;
    })
    .withFailureHandler(function (e) { document.getElementById('sl').innerHTML = '<div class="sl-aviso">' + esc(e && e.message || e) + '</div>'; })
    .getSala(AUTH);
})();
</script>
<?!= incluirCrudo_('LecturaJs') ?>
<script>
  (function () {
    var host = document.getElementById('lx-modulo');
    if (!host || !window.LECTURA) return;
    google.script.run
      .withSuccessHandler(function (r) { if (r && r.lectura) window.LECTURA.pintar(host, r.lectura, {}); else host.style.display = 'none'; })
      .withFailureHandler(function () { host.style.display = 'none'; })
      .getLecturaPilar(AUTH, 'management');
  })();
</script>
</body>
</html>
