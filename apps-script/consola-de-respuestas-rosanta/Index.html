  .brand small{color:#7a7468;font-size:11px;}
  .tools{padding:0 14px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  .search{flex:1;min-width:120px;}

  .count{font-size:12px;color:#8a8478;padding:0 18px 8px;}

  .thread.sel{background:#e4ece4;}
  .av{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;background:var(--verde);}

  .th-time{font-size:11px;color:#9a9488;flex:0 0 auto;}
  .th-prev{font-size:12.5px;color:#7d7669;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .chip{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:middle;color:#fff;}
  .c-whatsapp{background:#25a35a;}.c-instagram{background:#c13584;}.c-messenger{background:#0a7cff;}
  .status{font-size:16px;flex:0 0 auto;line-height:1;}
  .chat{flex:1;display:flex;flex-direction:column;background:#f6f4ee;min-width:0;}

  .back{display:none;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--verde);line-height:1;}
  .chat-head .nm{font-weight:700;font-size:15px;}
  .chat-head .sub{font-size:11px;color:#8a8478;}
  .msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px;}
  .row{display:flex;}
  .row.out{justify-content:flex-end;}
  .bubble{max-width:74%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.05);}
  .in .bubble{background:#fff;border-bottom-left-radius:5px;}
  .out.bot .bubble{background:#def0e2;border-bottom-right-radius:5px;}
  .out.humano .bubble{background:var(--verde);color:#fff;border-bottom-right-radius:5px;}
  .meta{font-size:10px;color:#9a9488;margin-top:3px;}
  .out .meta{text-align:right;}
  .tagh{font-size:10px;font-weight:700;opacity:.85;display:block;margin-bottom:2px;}
  .compose{border-top:1px solid var(--linea);padding:12px;background:var(--crema);}

  .empty{flex:1;display:flex;align-items:center;justify-content:center;color:#9a9488;font-size:14px;text-align:center;padding:30px;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--negro);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  @media(max-width:760px){
    .side{width:100%;min-width:0;}
    .chat{display:none;position:fixed;inset:0;z-index:20;}
    .app.viewing .side{display:none;}
    .app.viewing .chat{display:flex;}
    .back{display:block;}
  }

<div class="app" id="app">
  <div class="side">

        <button id="fAll" class="on" onclick="setFilter('todos')">Todos</button>

      <div class="search"><input id="q" placeholder="Buscar…" oninput="render()"></div>
      <button class="refresh" onclick="loadThreads(true)">&#8635;</button>
    </div>
    <div class="count" id="count">Cargando…</div>

<script>
  var THREADS=[],FILTER='todos',CUR=null,msgTimer=null,listTimer=null;
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}
  function initials(s){s=(s||'').trim();if(!s)return '·';var p=s.split(/\s+/);return ((p[0][0]||'')+(p[1]?p[1][0]:'')).toUpperCase();}
  function canalChip(c){c=(c||'').toLowerCase();var n=c==='whatsapp'?'WhatsApp':c==='instagram'?'Instagram':c==='messenger'?'Messenger':c;return '<span class="chip c-'+c+'">'+n+'</span>';}
  function fmtTime(iso){if(!iso)return '';var d=new Date(iso),now=new Date();if(d.toDateString()===now.toDateString())return d.toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString('es-GT',{day:'2-digit',month:'2-digit'});}
  function nameOf(t){return t.nombre || (t.canal==='whatsapp'?('+'+t.id):('ID '+String(t.id).substring(0,6)));}
  function estadoDe(t){
    if(t.pendiente)return{ico:'🟡',txt:'Esperando respuesta'};
    if(t.ultimoAutor==='humano')return{ico:'✅',txt:'Atendido por el equipo'};
    return{ico:'🤖',txt:'Contestado por el bot'};
  }
  function setFilter(f){FILTER=f;document.getElementById('fAll').classList.toggle('on',f==='todos');document.getElementById('fPend').classList.toggle('on',f==='pendientes');render();}
  function loadThreads(manual){
    google.script.run.withSuccessHandler(function(arr){THREADS=arr||[];render();aplicarPendiente();})
      .withFailureHandler(function(e){if(manual)toast('Error: '+e.message);}).getThreads(300);
  }

  /* ===== Abrir un hilo desde afuera (el CRM de la intranet lo embebe) =====
     El CRM manda la clave del telefono por postMessage al hacer clic en un
     contacto. Se usa postMessage y no recargar el iframe con un parametro para
     no perder el estado: el hilo abierto, el filtro y lo que este escrito en la
     caja de respuesta sobreviven al cambio de contacto.
     Solo selecciona un hilo que el usuario ya puede ver: no expone datos nuevos
     ni envia nada, asi que no hay nada que un origen ajeno pueda sacar de aqui. */
  var PENDIENTE=null;
  function claveTel(v){ var d=String(v||'').replace(/[^0-9]/g,''); return d.length<8?'':d.slice(-8); }
  function aplicarPendiente(){
    if(!PENDIENTE)return;
    var c=PENDIENTE;
    var t=THREADS.filter(function(x){return claveTel(x.id)===c;})[0];
    if(!t)return;              // sin hilo aun: queda pendiente por si aparece al refrescar
    PENDIENTE=null;
    openThread(t.canal,t.id);
  }
  window.addEventListener('message',function(ev){
    var d=ev.data;
    if(!d||d.tipo!=='rosanta:abrirContacto')return;
    var c=claveTel(d.clave);
    if(!c)return;
    PENDIENTE=c;
    if(THREADS.length)aplicarPendiente();   // si aun no cargan, lo toma loadThreads
  });
  function render(){
    var q=(document.getElementById('q').value||'').toLowerCase();
    var list=THREADS.filter(function(t){
      if(FILTER==='pendientes'&&!t.pendiente)return false;
      if(q){var hay=(nameOf(t)+' '+t.id+' '+(t.ultimoTexto||'')).toLowerCase();if(hay.indexOf(q)<0)return false;}
      return true;
    });
    document.getElementById('count').textContent=list.length+' chat'+(list.length===1?'':'s')+(FILTER==='pendientes'?' pendientes':'');
    document.getElementById('threads').innerHTML=list.map(function(t){
      var sel=(CUR&&CUR.id===t.id&&CUR.canal===t.canal)?' sel':'';
      var e=estadoDe(t);
      return '<div class="thread'+sel+'" onclick="openThread(\''+t.canal+'\',\''+esc(String(t.id))+'\')">'+
        '<div class="av">'+initials(t.nombre)+'</div><div class="th-main">'+
        '<div class="th-top"><span class="th-name">'+esc(nameOf(t))+'</span><span class="th-time">'+fmtTime(t.ultimaFechaIso)+'</span></div>'+
        '<div class="th-prev">'+canalChip(t.canal)+esc((t.ultimoTexto||'').substring(0,60))+'</div></div>'+
        '<div class="status" title="'+e.txt+'">'+e.ico+'</div></div>';
    }).join('')||'<div style="padding:24px;color:#9a9488;font-size:13px;text-align:center;">Nada por aquí.</div>';
  }
  function openThread(canal,id){
    CUR={canal:canal,id:id};document.getElementById('app').classList.add('viewing');render();
    renderShell();loadMsgs(true);
    if(msgTimer)clearInterval(msgTimer);msgTimer=setInterval(function(){loadMsgs(false);},9000);
  }
  function closeThread(){
    CUR=null;if(msgTimer)clearInterval(msgTimer);document.getElementById('app').classList.remove('viewing');
    document.getElementById('chat').innerHTML='<div class="empty">Elige un chat para ver la conversación.</div>';render();
  }
  function loadMsgs(scroll){
    if(!CUR)return;
    google.script.run.withSuccessHandler(function(msgs){if(CUR)renderMsgs(msgs||[],scroll);})
      .withFailureHandler(function(e){toast('Error: '+e.message);}).getMensajes(CUR.canal,CUR.id);
  }
  /* Arma el armazón del chat UNA vez (header + caja de texto). No se vuelve a tocar en el polling. */
  function renderShell(){
    var t=THREADS.filter(function(x){return x.id===CUR.id&&x.canal===CUR.canal;})[0]||{canal:CUR.canal,id:CUR.id,nombre:''};
    document.getElementById('chat').innerHTML=
      '<div class="chat-head"><button class="back" onclick="closeThread()">&#8249;</button>'+
      '<div class="av" style="width:38px;height:38px;font-size:14px;">'+initials(t.nombre)+'</div>'+
      '<div><div class="nm">'+esc(nameOf(t))+'</div><div class="sub">'+canalChip(t.canal)+esc(String(t.id))+'</div></div></div>'+
      '<div class="msgs" id="msgs"></div><div class="compose">'+
      '<div class="warn" id="warn" style="display:none"></div>'+
      '<div class="crow"><textarea id="ta" rows="1" placeholder="Escribe tu respuesta…" oninput="growTa(this)" onkeydown="taKey(event)"></textarea>'+
      '<button class="send" id="sendBtn" onclick="enviar()">&#10148;</button></div></div>';
  }
  /* Solo refresca los mensajes y el aviso de 24h. NO toca el textarea. */
  function renderMsgs(msgs,scroll){
    var box=document.getElementById('msgs');if(!box)return;
    var lastIn=null;msgs.forEach(function(m){if(m.direccion==='in')lastIn=m.fecha;});
    var fuera=false;
    if(CUR.canal==='whatsapp')fuera=!lastIn||(Date.now()-new Date(lastIn).getTime())>24*3600*1000;
    var warn=document.getElementById('warn');
    if(warn){
      if(fuera){warn.style.display='';warn.innerHTML='⚠️ Pasaron más de 24 h desde el último mensaje del cliente. WhatsApp puede rechazar este envío libre (haría falta una plantilla).';}
      else{warn.style.display='none';warn.innerHTML='';}
    }
    box.innerHTML=msgs.map(function(m){
      var side=m.direccion==='in'?'in':'out';
      var who=m.autor==='humano'?'humano':(m.autor==='bot'?'bot':'');
      var tag=(side==='out')?'<span class="tagh">'+(who==='humano'?'Equipo':'Bot')+'</span>':'';
      return '<div class="row '+side+' '+who+'"><div><div class="bubble">'+tag+esc(m.texto)+'</div><div class="meta">'+fmtTime(m.fecha)+'</div></div></div>';
    }).join('');
    if(scroll)box.scrollTop=box.scrollHeight;
  }
  function growTa(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
  function taKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar();}}
  function enviar(){
    if(!CUR)return;var ta=document.getElementById('ta');var txt=(ta.value||'').trim();if(!txt)return;
    var btn=document.getElementById('sendBtn');btn.disabled=true;
    var box=document.getElementById('msgs');
    box.insertAdjacentHTML('beforeend','<div class="row out humano"><div><div class="bubble"><span class="tagh">Equipo</span>'+esc(txt)+'</div><div class="meta">enviando…</div></div></div>');
    box.scrollTop=box.scrollHeight;ta.value='';growTa(ta);
    google.script.run.withSuccessHandler(function(r){
      btn.disabled=false;
      if(r&&r.ok){toast('Enviado. Llega en <1 min.');setTimeout(function(){loadMsgs(true);loadThreads(false);},1500);}
      else toast((r&&r.msg)||'No se pudo enviar.');
    }).withFailureHandler(function(e){btn.disabled=false;toast('Error: '+e.message);}).enviarMensaje(CUR.canal,CUR.id,txt);
  }
  loadThreads(true);
  listTimer=setInterval(function(){loadThreads(false);},20000);
</script>
