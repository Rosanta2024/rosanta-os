<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --verde:#4E6D5A;        /* Verde Bosque, bandas y titulares */
    --verde-texto:#2F4438;  /* verde profundo para lectura, contraste 9:1 */
    --crema:#F2EEEB;
    --lila:#AEAAE2;         /* chispa, solo acento */
    --linea:rgba(47,68,56,.22);
    --linea-suave:rgba(47,68,56,.12);
    --serif:'Italiana', Georgia, serif;           /* sustituto legal de PESKIA */
    --sans:'Lato', Arial, sans-serif;             /* fallback de Avenir */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--crema);color:var(--verde-texto);font-family:var(--sans);
       font-weight:400;-webkit-font-smoothing:antialiased;line-height:1.55;font-size:17px}
  a{color:inherit}
  .inner{max-width:820px;margin:0 auto;padding:0 22px}

  /* ================= barra fija ================= */
  .top{position:sticky;top:0;z-index:20}
  .bar{background:var(--verde);color:var(--crema)}
  .bar .inner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:14px;padding-bottom:14px}
  .mark{font-family:var(--serif);font-weight:400;letter-spacing:.3em;font-size:19px;text-transform:uppercase}
  .lang{display:flex;border:1px solid rgba(242,238,235,.55);border-radius:999px;overflow:hidden}
  .lang button{font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    padding:9px 15px;border:0;background:transparent;color:var(--crema);cursor:pointer;min-height:44px}
  .lang button[aria-pressed="true"]{background:var(--crema);color:var(--verde)}

  .bar2{background:var(--verde);border-top:1px solid rgba(242,238,235,.25)}
  .bar2 .inner{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding-top:10px;padding-bottom:10px;color:var(--crema)}
  .bar2 .aqui{font-size:15px;letter-spacing:.16em;text-transform:uppercase;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .btn-sec{display:flex;align-items:center;gap:9px;background:var(--crema);color:var(--verde);
    border:0;border-radius:999px;padding:11px 18px;font-family:var(--sans);font-weight:700;
    font-size:14px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;min-height:44px;white-space:nowrap}
  .btn-sec svg{width:15px;height:15px}

  /* ================= índice de secciones ================= */
  .idx{position:fixed;inset:0;z-index:40;background:var(--crema);display:none;overflow-y:auto}
  .idx.abierto{display:block}
  .idx .cab{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;
    background:var(--verde);color:var(--crema)}
  .idx .cab span{font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:.18em;text-transform:uppercase}
  .idx .cerrar{background:transparent;border:1px solid rgba(242,238,235,.55);color:var(--crema);
    border-radius:999px;width:44px;height:44px;font-size:20px;line-height:1;cursor:pointer}
  .idx ol{list-style:none;margin:0;padding:8px 22px 40px;max-width:820px;margin:0 auto}
  .idx li{border-bottom:1px solid var(--linea-suave)}
  .idx a{display:flex;align-items:baseline;gap:14px;padding:20px 4px;text-decoration:none;color:var(--verde-texto)}
  .idx .num{font-size:13px;letter-spacing:.14em;color:var(--verde);opacity:.7;min-width:26px}
  .idx .tit{font-family:var(--serif);font-weight:400;font-size:25px;text-transform:uppercase;letter-spacing:.06em;line-height:1.25}

  /* ================= portada / intro ================= */
  .intro{padding:40px 0 8px}
  .eyebrow{font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--verde);margin:0 0 14px}
  .lead{font-family:var(--sans);font-size:25px;line-height:1.4;font-weight:400;
    color:var(--verde);margin:0 0 22px;max-width:26ch}
  .intro p{font-size:17px;line-height:1.7;margin:0 0 15px;max-width:60ch}
  details{margin:6px 0 26px}
  summary{cursor:pointer;font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    list-style:none;display:inline-block;padding:13px 22px;border:1.5px solid var(--verde);
    border-radius:999px;color:var(--verde);min-height:44px}
  summary::-webkit-details-marker{display:none}
  details[open] summary{margin-bottom:18px}
  .coord{display:flex;gap:16px;align-items:flex-start;padding:18px 0 34px;border-top:1px solid var(--linea-suave)}
  .coord b{font-family:var(--serif);font-weight:400;letter-spacing:.16em;white-space:nowrap;
    font-size:17px;color:var(--verde);padding-top:2px}
  .coord span{font-size:15.5px;font-style:italic;line-height:1.55}

  /* ================= banda verde de sección ================= */
  section{scroll-margin-top:132px}
  .banda{background:var(--verde);color:var(--crema);position:relative;overflow:hidden}
  .banda .inner{padding-top:42px;padding-bottom:42px;position:relative;z-index:2}
  .banda .eyebrow{color:rgba(242,238,235,.8);margin-bottom:12px}
  .banda h2{font-family:var(--serif);font-weight:400;text-transform:uppercase;letter-spacing:.06em;
    font-size:41px;line-height:1.08;margin:0;max-width:14ch}

  /* ================= platos ================= */
  section .cuerpo{padding:30px 0 10px}
  .sec-intro{font-size:16.5px;line-height:1.65;font-style:italic;margin:0 0 30px;max-width:58ch}
  .item{padding:24px 0;border-bottom:1px solid var(--linea-suave)}
  .row{display:flex;align-items:baseline;gap:12px}
  .name{font-family:var(--serif);font-size:23px;font-weight:400;text-transform:uppercase;
    letter-spacing:.04em;line-height:1.25;color:var(--verde-texto)}
  .dots{flex:1;border-bottom:1px dotted var(--linea);transform:translateY(-5px);min-width:16px}
  .price{font-size:19px;font-weight:700;letter-spacing:.02em;white-space:nowrap;color:var(--verde)}
  .price2{font-size:14.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--verde);margin:9px 0 0}
  .desc{font-size:16.5px;line-height:1.62;margin:10px 0 0;max-width:58ch}
  .x{font-size:15.5px;font-style:italic;margin:8px 0 0}
  .mar{font-size:15.5px;line-height:1.6;margin:11px 0 0;max-width:58ch;
    padding-left:14px;border-left:2px solid var(--lila)}
  .mar b{font-weight:700;font-style:normal;letter-spacing:.04em;text-transform:uppercase;font-size:13px;
    display:block;margin-bottom:2px;color:var(--verde)}
  .nota{font-size:14.5px;line-height:1.5;margin:9px 0 0;max-width:58ch;display:flex;gap:9px}
  .nota .mk{color:var(--lila);flex:0 0 auto}
  .nota a{color:var(--verde);font-weight:700}

  /* ================= bloques de lista ================= */
  .grid-block{margin-top:38px;padding-top:30px;border-top:2px solid var(--linea)}
  .grid-title{font-family:var(--serif);font-weight:400;text-transform:uppercase;letter-spacing:.1em;font-size:25px;
    margin:0 0 8px;color:var(--verde)}
  .grid-intro{font-size:16px;font-style:italic;margin:0 0 22px}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
  .group{margin-bottom:28px}
  .group h4{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--verde);
    margin:0 0 10px;font-weight:700;padding-bottom:7px;border-bottom:1px solid var(--linea-suave)}
  .line{display:flex;align-items:baseline;gap:10px;padding:9px 0}
  .line .n{font-size:16.5px;line-height:1.35}
  .line .d2{flex:1;border-bottom:1px dotted var(--linea);transform:translateY(-5px);min-width:10px}
  .line .p{font-size:16.5px;font-weight:700;white-space:nowrap;color:var(--verde)}
  .line-desc{font-size:14.5px;margin:0 0 8px;line-height:1.5;max-width:38ch;font-style:italic}


  /* ================= subsecciones de cocteles ================= */
  .sub{margin-top:34px}
  .sub:first-of-type{margin-top:6px}
  .sub-cab{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--linea);padding-bottom:9px}
  .sub-cab h3{font-family:var(--serif);font-weight:400;text-transform:uppercase;letter-spacing:.1em;
    font-size:25px;margin:0;color:var(--verde);line-height:1.2}
  .sub-cab .pq{margin-left:auto;font-size:18px;font-weight:700;color:var(--verde);white-space:nowrap}
  .sub-nota{font-size:15.5px;font-style:italic;margin:11px 0 4px}
  .cierre{margin-top:30px;padding:16px 18px;border:1px dashed var(--linea);
    font-size:15.5px;font-style:italic;text-align:center;border-radius:3px}

  /* ================= vinos ================= */
  .vg{margin-top:34px}
  .vg:first-of-type{margin-top:4px}
  .vg > h3{font-family:var(--serif);font-weight:400;text-transform:uppercase;letter-spacing:.1em;
    font-size:25px;margin:0 0 12px;color:var(--verde);border-bottom:2px solid var(--linea);padding-bottom:9px}
  .vino{padding:18px 0;border-bottom:1px solid var(--linea-suave)}
  .vino .n{font-family:var(--serif);font-weight:400;font-size:22px;text-transform:uppercase;
    letter-spacing:.04em;color:var(--verde-texto);line-height:1.25}
  .vino .uva{font-size:16px;font-style:italic;margin:5px 0 0}
  .vino .zona{font-size:14.5px;margin:3px 0 0}
  .vino .pr{font-size:16.5px;font-weight:700;color:var(--verde);margin:9px 0 0}
  .vino .pr span{font-weight:400;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase}

  /* ================= pie ================= */
  footer{background:var(--verde);color:var(--crema);margin-top:50px}
  footer .inner{padding-top:34px;padding-bottom:40px;text-align:center}
  footer .brand{font-family:var(--serif);font-weight:400;letter-spacing:.2em;text-transform:uppercase;font-size:17px;display:block}
  footer .prop{font-size:15px;margin:12px 0 0}
  footer .cd{font-family:var(--serif);font-weight:400;letter-spacing:.22em;font-size:15px;margin:18px 0 0;
    padding-top:16px;border-top:1px solid rgba(242,238,235,.3);display:inline-block}

  @media (min-width:760px){
    body{font-size:18px}
    .banda h2{font-size:56px}
    .lead{font-size:36px}
    .name{font-size:25px}
  }
  @media (max-width:560px){
    .inner{padding:0 18px}
    .cols{grid-template-columns:1fr;gap:0}
    .banda h2{font-size:35px}
    .mark{font-size:17px;letter-spacing:.22em}
  }
</style>
</head>

  es: { menu: 'Menú', intro: 'Cocina con propósito' },
  en: { menu: 'Menu', intro: 'Cooking with purpose' }
};


let lang = (new URLSearchParams(location.search).get('lang') === 'en') ? 'en' : 'es';

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');


function itemHTML(it){
  const t = it[lang];
  let h = '<div class="item"><div class="row"><span class="name">' + esc(t.n) + '</span>';
  if(it.q) h += '<span class="dots"></span><span class="price">Q' + it.q + '</span>';
  h += '</div>';
  if(t.p)  h += '<p class="price2">' + esc(t.p) + '</p>';
  if(t.p2) h += '<p class="price2">' + esc(t.p2) + '</p>';
  if(t.d)  h += '<p class="desc">' + esc(t.d) + '</p>';
  if(t.x)  h += '<p class="x">' + esc(t.x) + '</p>';
  if(t.m)  h += '<p class="mar"><b>' + (lang==='es'?'Maridaje':'Pairing') + '</b>' + esc(t.m) + '</p>';
  (t.notas||[]).forEach(n => { h += '<p class="nota"><span class="mk">&#10048;</span><span>' + esc(n) + '</span></p>'; });
  if(t.link) h += '<p class="nota"><span class="mk">&#10048;</span><span><a href="' + t.link.u + '" target="_blank" rel="noopener">' + esc(t.link.t) + '</a></span></p>';
  return h + '</div>';
}

function subHTML(sub){
  const t = sub[lang];
  return '<div class="sub"><div class="sub-cab"><h3>' + esc(t.t) + '</h3>'
    + '<span class="pq">Q' + sub.q + '</span></div>'
    + (t.n ? '<p class="sub-nota">' + esc(t.n) + '</p>' : '')
    + sub.items.map(itemHTML).join('') + '</div>';
}

function vinoGrupoHTML(g){
  let h = '<div class="vg"><h3>' + esc(g[lang]) + '</h3>';
  g.items.forEach(v => {
    const copa = lang === 'es' ? 'Copa' : 'Glass';
    const bot  = lang === 'es' ? 'Botella' : 'Bottle';
    let pr = '';
    if(v.copa) pr += '<span>' + copa + '</span> Q' + v.copa + '&nbsp;&nbsp;&middot;&nbsp;&nbsp;';
    pr += '<span>' + bot + '</span> Q' + v.bot;
    h += '<div class="vino"><div class="n">' + esc(v.n) + '</div>'
       + '<p class="uva">' + esc(v.uva) + '</p>'
       + '<p class="zona">' + esc(lang === 'es' ? v.zEs : v.zEn) + '</p>'
       + '<p class="pr">' + pr + '</p></div>';
  });
  return h + '</div>';
}

function gridHTML(g){
  let h = '<div class="grid-block">';
  if(g[lang] && g[lang].title) h += '<h3 class="grid-title">' + esc(g[lang].title) + '</h3>';
  if(g[lang] && g[lang].intro) h += '<p class="grid-intro">' + esc(g[lang].intro) + '</p>';
  h += '<div class="cols">';
  g.groups.forEach(gr => {
    h += '<div class="group">';
    if(gr[lang]) h += '<h4>' + esc(gr[lang]) + '</h4>';
    gr.items.forEach(i => {
      h += '<div class="line"><span class="n">' + esc(i[lang]) + '</span><span class="d2"></span><span class="p">Q' + i.q + '</span></div>';
      const d = lang === 'es' ? i.dEs : i.dEn;
      if(d) h += '<p class="line-desc">' + esc(d) + '</p>';
    });
    h += '</div>';
  });
  return h + '</div></div>';
}

function render(){
  document.documentElement.lang = lang;
  const t = INTRO[lang];

  document.getElementById('btnSecTxt').textContent = lang==='es' ? 'Secciones' : 'Sections';
  document.getElementById('idxTit').textContent    = lang==='es' ? 'Secciones' : 'Sections';
  document.getElementById('aqui').textContent      = t.kicker;

  document.getElementById('idxList').innerHTML =
    '<li><a href="#top"><span class="num">00</span><span class="tit">' + esc(t.kicker) + '</span></a></li>' +
    MENU.map((s,i) => '<li><a href="#' + s.id + '"><span class="num">' +
      String(i+1).padStart(2,'0') + '</span><span class="tit">' + esc(s[lang].eyebrow) + '</span></a></li>').join('');

  document.getElementById('intro').innerHTML =
    '<span id="top"></span>' +
    '<p class="eyebrow">' + esc(t.kicker) + '</p>' +
    '<p class="lead">' + esc(t.lead) + '</p>' +
    '<p>' + esc(t.body[0]) + '</p>' +
    '<details><summary>' + (lang==='es'?'Seguir leyendo':'Keep reading') + '</summary>' +
      t.body.slice(1).map(p => '<p>' + esc(p) + '</p>').join('') +
    '</details>' +
    '<div class="coord"><b>14&deg; N &middot; 91&deg; W</b><span>' + esc(t.coordNote) + '</span></div>';

  document.getElementById('menu').innerHTML = MENU.map(s => {
    let h = '<section id="' + s.id + '">' +
      '<div class="banda"><div class="inner">' +
        '<p class="eyebrow">' + esc(s[lang].eyebrow) + '</p>' +
        '<h2>' + esc(s[lang].title) + '</h2>' +
      '</div></div>' +
      '<div class="cuerpo"><div class="inner">' +
        (s[lang].intro ? '<p class="sec-intro">' + esc(s[lang].intro) + '</p>' : '') +
        s.items.map(itemHTML).join('') +
        (s.subs  ? s.subs.map(subHTML).join('') : '') +
        (s.vinos ? s.vinos.map(vinoGrupoHTML).join('') : '') +
        (s.grid  ? gridHTML(s.grid) : '') +
        (s.cierre ? '<p class="cierre">' + esc(s.cierre[lang]) + '</p>' : '') +
      '</div></div></section>';
    return h;
  }).join('');

  document.getElementById('foot').innerHTML =
    '<span class="brand">' + esc(FOOT[lang].line1) + '</span>' +
    '<p class="prop">' + esc(FOOT[lang].line2) + '</p>' +
    '<p class="cd">14&deg; N &middot; 91&deg; W</p>';

  document.querySelectorAll('.lang button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  sendHeight();
}

/* ---- idioma ---- */
document.querySelectorAll('.lang button').forEach(b => {
  b.addEventListener('click', () => { lang = b.dataset.lang; render(); window.scrollTo(0,0); });
});

/* ---- índice de secciones ---- */
const idx = document.getElementById('idx');
function abrir(v){ idx.classList.toggle('abierto', v); idx.setAttribute('aria-hidden', String(!v)); }
document.getElementById('btnSec').addEventListener('click', () => abrir(true));
document.getElementById('cerrar').addEventListener('click', () => abrir(false));
idx.addEventListener('click', e => { if(e.target.closest('a')) abrir(false); });

/* ---- dónde estoy ---- */
addEventListener('scroll', () => {
  let cur = null;
  document.querySelectorAll('section').forEach(s => {
    if(s.getBoundingClientRect().top <= 140) cur = s;
  });
  const el = document.getElementById('aqui');
  el.textContent = cur ? cur.querySelector('.eyebrow').textContent : INTRO[lang].kicker;
}, {passive:true});

/* ---- alto automático para el componente HTML de Wix ---- */
function sendHeight(){
  try{ parent.postMessage({rosantaMenuHeight: document.body.scrollHeight}, '*'); }catch(e){}
}
addEventListener('load', sendHeight);
addEventListener('resize', sendHeight);
document.addEventListener('toggle', sendHeight, true);

render();
</script>
</body>
</html>
