<script>
/* EL TOKEN DEL ENLACE PERSONAL (10-sep-2026)
   Toda llamada a google.script.run tiene que mandarlo como primer argumento. La
   pagina se abre porque doGet ya resolvio la identidad, pero cada llamada al

   de dominio y a quien entra con Gmail personal le contesta "Sin acceso al
   recetario". Asi le paso a Jeffry, que fue el primero en entrar de verdad al
   modulo. Si agregas una llamada nueva, pasale AUTH. */
var AUTH = '<?= authToken ?>';
/* LOS ERRORES EN CRISTIANO (14-oct-2026, Juanma: "que todo el sistema sea user friendly").
   Toda pantalla de Profit OS pasa el error por aca antes de mostrarlo. Los errores tecnicos de
   Google o del navegador (en ingles, con "Exception", "TypeError", tiempos agotados) se cambian
   por una frase que dice que hacer; los mensajes propios del sistema ya vienen en español y
   pasan tal cual. El original queda en la consola para quien tenga que revisarlo.
   x: el error (Error, {message}) o un texto. defecto: si no vino nada. */
window.PF_ERROR = function (x, defecto) {
  var m = x && x.message ? String(x.message) : (x == null || x === '' ? String(defecto || '') : String(x));
  try { if (m) console.warn('[intranet] error:', m); } catch (e0) { /* sin consola */ }
  m = m.replace(/^\s*(Error|Exception|Excepción)\s*:\s*/i, '');
  var T = [
    [/sin respuesta|no response|empty response/i, 'No llegó respuesta del servidor. Probá de nuevo en un momento.'],
    [/Lock timeout|could not obtain lock|otra lectura en curso/i, 'Alguien más está guardando en este momento. Esperá unos segundos y probá de nuevo.'],
    [/NetworkError|Failed to fetch|network|timed? ?out|tiempo de espera|Exceeded maximum execution time|tiempo m[aá]ximo de ejecuci/i, 'Se tardó demasiado o se cortó el internet. Probá de nuevo en un momento.'],
    [/too many times|Service invoked|quota|Rate Limit|Limit Exceeded|demasiadas veces/i, 'Google está saturado un momento. Probá de nuevo en un minuto.'],
    [/Authorization is required|authorization.*expired|sesi[oó]n venci/i, 'Tu sesión venció. Recargá la página.'],
    [/permission|Access denied|not have access|You need access|Sin acceso/i, 'No tenés permiso para esto. Si debería poder, avisale a Juanma.'],
    [/^(TypeError|ReferenceError|SyntaxError|RangeError|InternalError)\b|Cannot read propert|is not defined|is not a function|Unexpected token|ScriptError/i, 'Algo falló en la intranet. Probá de nuevo; si sigue, avisale a Juanma.']
  ];
  for (var i = 0; i < T.length; i++) if (T[i][0].test(m)) return T[i][1];
  return m ? m.charAt(0).toUpperCase() + m.slice(1) : 'No se pudo completar. Probá de nuevo.';
};

function pagosOServidorNuevo(sec, modo){
  sec.innerHTML = '<div class="pg-vacio">Leyendo las facturas y los pagos…</div>';
  var deSiempre = function(){ sec.innerHTML = ''; window.PF_PAGOS(sec, AUTH, modo); };
  google.script.run.withSuccessHandler(function(d){
    if(!d || !d.base){ deSiempre(); return; }
    var f = document.createElement('iframe');
    f.src = d.url; f.title = 'Pagos'; f.style.cssText = 'width:100%;border:0;min-height:900px;display:block';
    sec.innerHTML = ''; sec.appendChild(f);
    window.addEventListener('message', function(ev){
      if(ev.source === f.contentWindow && ev.data && ev.data.rosantaAlto) f.style.height = Math.max(600, ev.data.rosantaAlto + 40) + 'px';
    });
  }).withFailureHandler(deSiempre).getPagosDestino(AUTH, modo || '', window.NUBE_PRUEBA || '');
}
/* Caja chica y Compras en el servidor nuevo (18-oct-2026, NubePagos.js): con motor_caja = base (y Pagos en base),
   la pestaña muestra la del servidor nuevo en un marco; si no, la de siempre (deSiempre). */
function cajaOServidorNuevo(sec, cual, deSiempre){
  sec.innerHTML = '<div class="pg-vacio">Leyendo…</div>';
  google.script.run.withSuccessHandler(function(d){
    if(!d || !d.base){ deSiempre(); return; }
    var f = document.createElement('iframe');
    f.src = d.url; f.title = cual === 'compras' ? 'Compras en efectivo' : 'Caja chica'; f.style.cssText = 'width:100%;border:0;min-height:900px;display:block';
    sec.innerHTML = ''; sec.appendChild(f);
    var origen = d.url.match(/^https:\/\/[^\/]+/)[0];
    window.addEventListener('message', function(ev){
      if(ev.source !== f.contentWindow || ev.origin !== origen || !ev.data) return;
      if(ev.data.rosantaAlto) f.style.height = Math.max(600, ev.data.rosantaAlto + 40) + 'px';
      if(ev.data.rosantaPuente) cajaPuente_(ev.source, origen, ev.data.rosantaPuente);
    });
  }).withFailureHandler(deSiempre).getCajaDestino(AUTH, cual, window.NUBE_PRUEBA || '');
}
/* EL PUENTE (18-oct-2026): "Leer cierres" y leer la foto de un comprobante usan Gmail, Drive y Claude, asi
   que los sigue corriendo la intranet aunque la pantalla sea la del servidor nuevo. La pantalla nueva pide
   y aca se corre la funcion de siempre (con motor_cierres = base, el cierre leido va al servidor nuevo).
   Solo estas dos: cualquier otro nombre se rechaza. */
function cajaPuente_(win, origen, p){
  var responder = function(ok, x){ win.postMessage({ rosantaPuenteResp: ok ? { id: p.id, ok: true, resultado: x } : { id: p.id, ok: false, error: (x && x.message) || String(x) } }, origen); };
  var run = google.script.run.withSuccessHandler(function(r){ responder(true, r); }).withFailureHandler(function(e){ responder(false, e); });
  if(p.nombre === 'leerCierresCaja') run.leerCierresCaja(AUTH);
  else if(p.nombre === 'leerComprobanteCompra') run.leerComprobanteCompra(AUTH, (p.args || [])[0]);
  else responder(false, { message: 'La intranet no corre ' + p.nombre + ' desde la pantalla nueva.' });
}

<script>
/* Adapta el modelo de CosteoDatos.gs a la forma compacta que usa la vista.
   Lo importante: area y cmvObjetivo viajan por receta, y cada linea lleva su sub-receta.

   Partido en piezas el 14-sep-2026: la pantalla ya no recarga despues de guardar, y
   lo que devuelve el servidor (una ficha, un producto) entra a la copia del modelo con
   estas mismas funciones. Ver aplicarCambios en CosteoJs_Base. */
function adaptarInsumo(i){
  return {id:i.id, p:i.producto, c:i.categoria, pr:i.precio, u:i.unidad, pc:i.precioCompra,
          uc:i.unidadCompra, cv:i.conversion, prov:i.proveedor, area:i.area, sub:i.sub, usos:i.usos || []};
}
function adaptarReceta(r){
  return {id:r.id, n:r.nombre, t:r.tipo, cat:r.categoria, area:r.area, obj:r.cmvObjetivo,
          precio:r.precio, costo:r.costo, costoUnit:r.costoUnit, unidadCosto:r.unidadCosto,
          cmv:r.cmv==null?null:Math.round(r.cmv*10)/10, merma:r.merma,
          rinde:r.rinde, rindeTexto:r.rindeTexto, nota:r.nota, sug:r.sugerido, est:r.estado, base:r.base,
          ing:(r.ingredientes || []).map(function(g){
            return {i:g.insumo, r:g.receta, n:g.nombre, q:g.cantidad, u:g.unidad, t:g.total, f:g.fila};
          })};
}
function adaptar(m){
  return {
    meta:{fuente:'hojas nativas del recetario', fecha:m.meta.generado.slice(0,10), areas:m.meta.areas,
          aliasSub:m.meta.aliasSub || {}, iva:m.meta.iva || 1.12, metaGlobal:m.meta.metaGlobal},
    proveedores:m.proveedores,
    insumos:m.insumos.map(adaptarInsumo),
    recetas:m.recetas.map(adaptarReceta)
  };
}
function arrancar(m){
  window.__DATA__ = adaptar(m);
  document.getElementById('cargando').remove();
  iniciarApp();
  window.__APP_LISTA__ = true;   // desde aca manda la navegacion de la app (CosteoJs_Acciones)
}
function fallar(e){
  window.__RECETARIO_FALLO__ = true;
  document.getElementById('cargando').innerHTML =
    '<p style="color:var(--alto)">No se pudo leer el recetario.</p><p style="font-size:13px">Revisá el internet y recargá la página. Hoy, Pagos, Compras y la Caja siguen funcionando.</p>' +
    '<p style="font-size:12px;color:var(--muted)">' + String(PF_ERROR(e)).replace(/</g, '&lt;') + '</p>';
}
/* LAS DOS LLAMADAS SALEN JUNTAS, no una despues de la otra.
   getCosteoData tarda lo suyo (es el recetario entero) y getProfitOS tambien, y
   hasta ahora la segunda no arrancaba hasta que la primera volvia: el usuario
   esperaba la SUMA. El tablero no necesita nada del recetario, asi que se pide en
   paralelo y lo que se espera es la mas lenta de las dos.

   El resultado se guarda y no se pinta: pintar() necesita __DATA__, que todavia
   puede no haber llegado. Cuando iniciarApp arranca, pedirProfitOS lo encuentra ya
   servido en el cache y no vuelve a pedirlo. */
window.__POS_CACHE__ = {};
window.__POSCARGANDO__ = 13;
google.script.run
  .withSuccessHandler(function(r){
    window.__POSCARGANDO__ = null;
    window.__POS_CACHE__[13] = r;
    if(window.__profitListo) window.__profitListo(13);

  .withFailureHandler(function(e){
    window.__POSCARGANDO__ = null;
    var err = {ok:false, error:PF_ERROR(e, 'No se pudo leer')};
    window.__POS_CACHE__[13] = {tablero:err, menu:err};
    if(window.__profitListo) window.__profitListo(13);
  })
  .getProfitOS(AUTH, 13);

google.script.run.withSuccessHandler(arrancar).withFailureHandler(fallar).getCosteoData(AUTH);
</script>

<script>
/* EL MENU SIN ESPERAR EL RECETARIO (14-oct-2026, Juanma: "que todo el sistema sea user friendly").
   La navegacion vive en iniciarApp, que corre cuando llega getCosteoData (el recetario entero, lo
   mas lento de la intranet): Maco no podia abrir la Caja hasta que cargaba un recetario que no
   usa. Esto navega YA entre las pestañas que no lo necesitan; las que si lo necesitan muestran
   "Cargando el recetario…". Cuando llega, iniciarApp arranca en la pestaña donde esta la persona
   (PROFIT_VISTA_INI) y esto se apaga (__APP_LISTA__). */
(function () {
  var SIN_RECETARIO = ['hoy', 'pagos', 'compras', 'caja', 'cocina', 'barrasala', 'adm-equipo', 'adm-banco', 'adm-balance', 'adm-iva'];
  var MONTAR = { hoy: montarHoy, pagos: montarPagos, compras: montarCompras, caja: montarCaja,
                 cocina: function () { montarArea('cocina'); }, barrasala: function () { montarArea('barrasala'); } };
  function lista() { return !!window.__APP_LISTA__; }
  function mostrar(v) {
    window.PROFIT_VISTA_INI = v;   // iniciarApp abre aca
    var sin = SIN_RECETARIO.indexOf(v) !== -1, carg = document.getElementById('cargando');
    if (carg) carg.style.display = sin ? 'none' : '';
    document.querySelectorAll('main > section[id^="v-"]').forEach(function (s) { s.hidden = s.id !== 'v-' + v; });
    var f = document.querySelector('.pf-filtro'); if (f) f.style.display = 'none';
    document.querySelectorAll('.nav button[data-view]').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.view === v)); });
    if (MONTAR[v]) MONTAR[v](); else if (v.indexOf('adm-') === 0) montarAdm(v);
  }
  document.addEventListener('click', function (e) {
    if (lista()) return;
    var t = e.target.closest && e.target.closest('button[data-view]');
    if (t) mostrar(t.dataset.view);
  });
  // el buscador filtra Pagos y Administracion desde ya (la app hace lo mismo cuando arranca)
  var qi = document.getElementById('q');
  if (qi) qi.addEventListener('input', function (e) {
    if (lista()) return;
    window.PF_BUSCA = e.target.value.trim(); window.dispatchEvent(new CustomEvent('pf-buscar', { detail: window.PF_BUSCA }));
  });
  if (!lista()) mostrar(window.PROFIT_VISTA_INI || 'hoy');
})();
/* El boton del menu en el telefono: abre y cierra, se cierra al elegir y muestra la pestaña de
   ahora (la lee de aria-selected, que ponen tanto el navegador liviano como la app). */
(function () {
  var lat = document.querySelector('.pf-lat'), btn = lat && lat.querySelector('.pf-menu-btn'), nav = document.getElementById('pf-nav');
  if (!btn || !nav) return;
  function abrir(si) { lat.classList.toggle('abierto', si); btn.setAttribute('aria-expanded', String(si)); }
  function rotulo() { var b = nav.querySelector('button[aria-selected="true"]'); document.getElementById('pf-menu-act').textContent = b ? b.textContent.trim() : ''; }
  btn.addEventListener('click', function () { abrir(!lat.classList.contains('abierto')); });
  nav.addEventListener('click', function (e) { if (e.target.closest('button[data-view]')) abrir(false); });
  new MutationObserver(rotulo).observe(nav, { subtree: true, attributes: true, attributeFilter: ['aria-selected'] });
  rotulo();
})();
</script>
